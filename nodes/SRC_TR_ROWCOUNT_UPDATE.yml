name: SRC_TR_ROWCOUNT_UPDATE
type: transformation
config:
  transformation_type: row_count
  description: "Counts update rows (BeanVersion different)"
  input_source: SRC_TR_CONDITIONAL_SPLIT
  input_path: update
  logic:
    operation: count_rows
    variable_name: "User::UpdateCount"
    count_type: updated_records
    filter_condition: "BEANVERSION != EDWBEANVERSION AND EDWBEANVERSION IS NOT NULL"
  output:
    pass_through: true
    add_count_column: false
  execution_order: 8
  dependencies:
    - SRC_TR_CONDITIONAL_SPLIT
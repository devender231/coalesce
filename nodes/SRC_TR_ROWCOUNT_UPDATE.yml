name: TR_ROWCOUNT_UPDATE
operation:
  database: ""
  deployEnabled: true
  description: "Row Count transformation - Counts update rows where BeanVersion differs from EDW BeanVersion and stores count in User::UpdateCount variable"
  locationName: SRC
  metadata:
    transformation:
      type: ROW_COUNT
      inputSource:
        name: TR_CONDITIONAL_SPLIT_BEANVERSION
        stepCounter: T4
        outputName: UPDATE_ROWS
      logic: "Count rows where BEANVERSION != EDWBeanVersion (records need update)"
      variable:
        name: "User::UpdateCount"
        type: "INTEGER"
        scope: "Package"
        description: "Stores the count of records that need to be updated in DIMBILLINGACCOUNT"
      executionOrder: 7
      purpose: "Audit and tracking of update record count for ETL monitoring and SCD Type 1 updates"
  name: TR_ROWCOUNT_UPDATE
  schema: ""
  sqlType: Transformation
  type: rowCount
  version: 1

name: SRC_TR_ROWCOUNT_UPDATE
type: transformation
transformation_type: ROW_COUNT
description: Counts update rows (BeanVersion different)
execution_order: 7
dependencies:
  - SRC_TR_CONDITIONALSPLIT_SCD

logic:
  operation: COUNT_ROWS
  variable_name: User::UpdateCount
  description: Captures count of rows requiring updates in dimension table
  input_path: UPDATE_ROWS

input:
  source: SRC_TR_CONDITIONALSPLIT_SCD
  output_path: update_rows
  
output:
  row_count_variable: User::UpdateCount
  pass_through: true
  target_destination: DIMBILLINGACCOUNT
  load_type: UPDATE
  columns:
    - ACCOUNTNUMBER
    - ACCOUNTNAME
    - ACCOUNTTYPE_NAME
    - BILLINGLEVEL_NAME
    - SERVICETIER_NAME
    - SECURITYZONE_NAME
    - SEGMENT_NAME
    - CLOSEDATE
    - CREATETIME
    - DELINQUENCYSTATUS_NAME
    - FIRSTTWICEPERMTHINVOICEDOM
    - SECONDTWICEPERMTHINVOICEDOM
    - PUBLICID
    - ACCOUNT_ID
    - BEANVERSION
    - RETIRED
    - UPDATETIME
    - PARENT_FOREIGNENTITYID
    - INSURED_FIRSTNAME
    - INSURED_LASTNAME
    - ADDRESS_LINE1
    - ADDRESS_LINE2
    - ADDRESS_LINE3
    - CITY
    - POSTALCODE
    - STATE_NAME
    - EDW_BEANVERSION
    - BatchID
  
  update_key:
    - PUBLICID
  
metadata:
  package_name: EDW_BC_Load_DimBillingAccount
  component_name: Row Count - Update
  purpose: Audit tracking and pass-through of update rows to target
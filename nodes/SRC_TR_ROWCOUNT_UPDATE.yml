fileVersion: 1.0.0
id: tr_rowcount_update
name: SRC_TR_ROWCOUNT_UPDATE
description: Counts update rows (BeanVersion different)
type: RowCount

execution_order: 7

source:
  name: CHANGED_OUTPUT
  description: Input from conditional split changed output

transformation:
  type: ROW_COUNT
  operation: COUNT_ROWS
  output_variable: User::UpdateCount
  description: Counts rows where BeanVersion differs (updates needed)

logic:
  count_expression: COUNT(*)
  variable_assignment:
    variable_name: User::UpdateCount
    variable_type: INTEGER
    description: Number of rows to be updated
  
  filter_condition: "BEANVERSION != EDWBeanVersion"

output:
  name: ROWCOUNT_UPDATE_OUTPUT
  pass_through: true
  description: Changed rows to be updated with count captured
  action: UPDATE
  target_table: DIMBILLINGACCOUNT
  update_key: PUBLICID

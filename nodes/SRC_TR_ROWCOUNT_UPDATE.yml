name: SRC_TR_ROWCOUNT_UPDATE
type: transformation
config:
  transformation_type: row_count
  description: "Counts update rows where BeanVersion differs from EDWBeanVersion"
  audit_variable: "User::UpdateCount"
source:
  - SRC_TR_CONDITIONALSPLIT_SCD
  input_stream: UPDATE_ROWS
transformation_logic:
  operation: COUNT
  count_type: FILTERED_ROWS
  filter_condition: "BEANVERSION != EDWBeanVersion AND !ISNULL(EDWBeanVersion)"
  output_variable: "UpdateCount"
  scope: "Package"
output:
  pass_through: true
  action: UPDATE_TARGET
  audit_column:
    name: UPDATE_ROW_COUNT
    data_type: INTEGER
    value: "COUNT(*)"
  load_type: UPDATE
execution_order: 8
dependencies:
  upstream:
    - SRC_TR_CONDITIONALSPLIT_SCD
  downstream:
    - TARGET_DIMBILLINGACCOUNT
metadata:
  created_from: "SSIS Package: EDW_BC_Load_DimBillingAccount"
  transformation_sequence: 7
  ssis_component_type: "Row Count"
  purpose: "Audit update row count for ETL monitoring and SCD Type 1 tracking"
  load_behavior: "Update existing records in target"
name: SRC_TR_ROWCOUNT_UPDATE
type: transformation
config:
  transformation_type: ROW_COUNT
  description: "Counts update rows (BeanVersion different)"
  execution_order: 7
  logic:
    operation: COUNT_ROWS
    variable: "User::UpdateCount"
    count_type: "update_rows"
    filter: "BEANVERSION != EDWBeanVersion AND EDWBeanVersion IS NOT NULL"
    
  input:
    source: SRC_TR_CONDITIONALSPLIT_BEANVERSION
    output_name: UPDATE_OUTPUT
    
  output:
    row_count_variable: "User::UpdateCount"
    pass_through: true
    action: SEND_TO_TARGET
    
  audit:
    capture_count: true
    log_to_variable: true
    log_message: "Existing rows to be updated"
    
dependencies:
  - SRC_TR_CONDITIONALSPLIT_BEANVERSION
name: SRC_LOOKUP_BEANVERSION
type: transformation
config:
  transformation_type: lookup
  description: "Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID"
  execution_order: 3
dependencies:
  - SRC_DERIVED_BATCHID
  - SRC_DIMBILLINGACCOUNT
logic:
  operation: lookup
  lookup_source: SRC_DIMBILLINGACCOUNT
  lookup_query: "SELECT PUBLICID, BEANVERSION FROM DIMBILLINGACCOUNT"
  join_condition:
    - input_column: PUBLICID
      lookup_column: PUBLICID
      match_type: exact
  return_columns:
    - column_name: BEANVERSION
      alias: EDWBeanVersion
      description: "Existing BeanVersion from target table"
  no_match_behavior: pass_through
  description: "Retrieves existing BeanVersion to compare with source BeanVersion"
output:
  columns:
    - all_input_columns
    - EDWBeanVersion
  description: "All input columns plus EDWBeanVersion for comparison"
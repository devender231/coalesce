name: SRC_LOOKUP_BEANVERSION
type: Lookup
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID

transformation_type: LOOKUP
execution_order: 3

input:
  source: SRC_DERIVED_COLUMN_BATCHID
  description: Dataset after BatchID derivation

lookup_configuration:
  lookup_table: DIMBILLINGACCOUNT
  lookup_source: SRC_DIMBILLINGACCOUNT.yml
  cache_mode: FULL
  
  join_condition:
    input_column: PUBLICID
    lookup_column: PUBLICID
    join_type: LEFT_OUTER
  
  columns_to_retrieve:
    - column_name: BeanVersion
      alias: EDWBeanVersion
      description: Existing BeanVersion from dimension table
  
  sql_query: |
    SELECT 
      Publicid, 
      BeanVersion 
    FROM DimBillingAccount

logic:
  operation: LOOKUP
  match_condition: "PUBLICID = DIMBILLINGACCOUNT.PUBLICID"
  description: Retrieves existing BeanVersion from dimension table to compare with source
  no_match_behavior: PASS_NULL

output:
  columns: ALL_INPUT_COLUMNS_PLUS_EDWBeanVersion
  description: All input columns plus EDWBeanVersion from lookup
  match_output: Rows with matching PUBLICID get EDWBeanVersion populated
  no_match_output: Rows without match get NULL for EDWBeanVersion (new records)

upstream_dependencies:
  - SRC_DERIVED_COLUMN_BATCHID.yml
  - SRC_DIMBILLINGACCOUNT.yml

metadata:
  purpose: Identify existing records and retrieve current BeanVersion for SCD comparison
  usage: EDWBeanVersion is compared with source BeanVersion to determine if update is needed
name: SRC_LOOKUP_BEANVERSION
type: transformation
transformation_type: LOOKUP
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID to determine if record exists and needs update
execution_order: 3

source:
  upstream_component: SRC_ALL_JOINS_DIMBILLINGACCOUNT
  description: Receives joined dataset after all table joins are complete

lookup_configuration:
  lookup_table: SRC_DIMBILLINGACCOUNT
  lookup_query: |
    SELECT 
      PUBLICID,
      BEANVERSION AS EDWBeanVersion
    FROM DIMBILLINGACCOUNT
  
  join_condition:
    - left_column: PUBLICID
      right_column: PUBLICID
      match_type: EXACT
  
  lookup_columns:
    - source_column: BEANVERSION
      alias: EDWBeanVersion
      data_type: STRING
      description: Existing BeanVersion from EDW dimension table
  
  match_behavior:
    on_match: RETURN_LOOKUP_VALUES
    on_no_match: RETURN_NULL
    cache_mode: FULL_CACHE
    description: Returns EDWBeanVersion if PUBLICID matches, NULL otherwise

output:
  columns:
    - All columns from upstream joined dataset
    - EDWBeanVersion (from lookup)
  description: Original dataset enriched with EDWBeanVersion for comparison

logic:
  operation: LEFT_OUTER_JOIN
  join_key: PUBLICID
  lookup_source: DIMBILLINGACCOUNT
  return_columns:
    - EDWBeanVersion

validation:
  - rule: PUBLICID_NOT_NULL
    condition: PUBLICID IS NOT NULL
    error_message: PUBLICID cannot be null for lookup operation

dependencies:
  - SRC_ALL_JOINS_DIMBILLINGACCOUNT
  - SRC_DIMBILLINGACCOUNT

next_component: SRC_CONDITIONAL_SPLIT_SCD
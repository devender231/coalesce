name: SRC_LOOKUP_BEANVERSION
type: transformation
transformation_type: LOOKUP
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID
execution_order: 4

source:
  - SRC_DERIVED_BATCHID

lookup_configuration:
  lookup_table: SRC_DIMBILLINGACCOUNT
  lookup_query: |
    SELECT 
      PUBLICID,
      BEANVERSION
    FROM DIMBILLINGACCOUNT
  join_condition:
    - source_column: PUBLICID
      lookup_column: PUBLICID
      match_type: EXACT
  
  lookup_columns:
    - name: BEANVERSION
      alias: EDWBeanVersion
      dataType: STRING
      description: BeanVersion from existing dimension table
  
  no_match_behavior: PASS_THROUGH
  cache_mode: FULL

output:
  description: Source data enriched with EDWBeanVersion from lookup
  includes_all_source_columns: true
  additional_columns:
    - name: EDWBeanVersion
      dataType: STRING
      source: LOOKUP
      nullable: true
name: SRC_LOOKUP_BEANVERSION
type: transformation
config:
  transformation_type: LOOKUP
  description: "Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID"
  input_source: SRC_DERIVED_BATCHID
  lookup_source: SRC_DIMBILLINGACCOUNT
  logic:
    lookup_query: "SELECT PUBLICID, BEANVERSION FROM DIMBILLINGACCOUNT"
    join_condition:
      - input_column: PUBLICID
        lookup_column: PUBLICID
        match_type: EXACT
    lookup_columns:
      - source_column: BEANVERSION
        output_column: EDWBeanVersion
        data_type: STRING
    no_match_behavior: PASS_THROUGH
    cache_mode: FULL
  execution_order: 3
  output:
    pass_through: true
    add_columns:
      - name: EDWBeanVersion
        dataType: STRING
        nullable: true
        description: "Existing BeanVersion from target table for comparison"

name: SRC_LOOKUP_BEANVERSION
type: source
config:
  source_type: transformation
  transformation_type: LOOKUP
  description: "Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID"
  execution_order: 3
  depends_on:
    - SRC_DERIVED_BATCHID
transformation_logic:
  operation: LOOKUP
  lookup_table: DIMBILLINGACCOUNT
  lookup_query: "SELECT PUBLICID, BEANVERSION FROM DIMBILLINGACCOUNT"
  join_condition:
    - left_column: PUBLICID
      right_column: DIMBILLINGACCOUNT.PUBLICID
      operator: "="
  lookup_columns:
    - source_column: BEANVERSION
      target_column: EDWBeanVersion
      data_type: STRING
      nullable: true
  no_match_behavior: "PASS_THROUGH"
  cache_mode: "FULL"
input_source:
  - SRC_DERIVED_BATCHID
output:
  pass_through: true
  add_columns:
    - name: EDWBeanVersion
      data_type: STRING
      expression: "DIMBILLINGACCOUNT.BEANVERSION"
      nullable: true
      description: "BeanVersion from existing dimension table"
name: SRC_LOOKUP_BEANVERSION
type: lookup
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID

source:
  name: SRC_DERIVED_BATCHID
  type: derived_column

lookup_table:
  name: DIMBILLINGACCOUNT
  alias: dim
  columns:
    - PUBLICID
    - BEANVERSION

transformation:
  type: LOOKUP
  operation: lookup_match
  
lookup_configuration:
  lookup_type: LEFT_OUTER
  cache_mode: full
  
join_condition:
  type: INNER
  expression: source.PUBLICID = dim.PUBLICID
  
logic:
  description: Lookup BeanVersion from DimBillingAccount by PUBLICID
  sql: |
    SELECT 
      Publicid, 
      BeanVersion 
    FROM DimBillingAccount
  join_logic: PUBLICID = DIMBILLINGACCOUNT.PUBLICID

output_columns:
  - source.*
  - dim.BEANVERSION as EDWBeanVersion

execution_order: 3

dependencies:
  - SRC_DERIVED_BATCHID
  - SRC_DIMBILLINGACCOUNT

match_behavior:
  no_match: pass_null
  multiple_matches: first_match
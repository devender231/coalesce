name: SRC_CONDITIONALSPLIT_BEANVERSION
type: transformation
config:
  transformation_type: CONDITIONAL_SPLIT
  description: "Routes rows based on whether BeanVersion matches EDWBeanVersion"
  input_source: SRC_LOOKUP_BEANVERSION
  logic:
    split_conditions:
      - output_name: UNCHANGED_ROWS
        condition: "BEANVERSION == EDWBeanVersion"
        description: "Rows where source BeanVersion matches target BeanVersion (no changes)"
        priority: 1
      
      - output_name: UPDATE_ROWS
        condition: "BEANVERSION != EDWBeanVersion AND EDWBeanVersion IS NOT NULL"
        description: "Rows where BeanVersion differs (updates needed)"
        priority: 2
      
      - output_name: INSERT_ROWS
        condition: "EDWBeanVersion IS NULL"
        description: "Rows with no match in target (new inserts)"
        priority: 3
    
    default_output: INSERT_ROWS
  execution_order: 4
  outputs:
    - name: UNCHANGED_ROWS
      description: "No action needed - records are current"
    - name: UPDATE_ROWS
      description: "Records to be updated in target"
    - name: INSERT_ROWS
      description: "New records to be inserted into target"

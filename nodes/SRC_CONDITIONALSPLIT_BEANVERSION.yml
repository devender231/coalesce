name: SRC_CONDITIONALSPLIT_BEANVERSION
type: transformation
config:
  transformation_type: conditional_split
  description: "Routes rows based on whether BeanVersion matches EDWBeanVersion"
  execution_order: 4
dependencies:
  - SRC_LOOKUP_BEANVERSION
logic:
  operation: split
  split_conditions:
    - condition_name: UnchangedRows
      expression: "BEANVERSION == EDWBeanVersion"
      output_path: SRC_ROWCOUNT_UNCHANGED
      description: "Rows where BeanVersion matches - no update needed"
      priority: 1
    
    - condition_name: UpdateRows
      expression: "BEANVERSION != EDWBeanVersion AND EDWBeanVersion IS NOT NULL"
      output_path: SRC_ROWCOUNT_UPDATE
      description: "Rows where BeanVersion differs - needs update"
      priority: 2
    
    - condition_name: InsertRows
      expression: "EDWBeanVersion IS NULL"
      output_path: SRC_ROWCOUNT_INSERT
      description: "Rows with no match in lookup - needs insert"
      priority: 3
  default_output: SRC_ROWCOUNT_INSERT
  description: "Routes data to appropriate paths based on SCD logic"
output:
  branches:
    - UnchangedRows
    - UpdateRows
    - InsertRows
  description: "Three output branches for different row types"
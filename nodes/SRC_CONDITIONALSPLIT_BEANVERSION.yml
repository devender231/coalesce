name: SRC_CONDITIONALSPLIT_BEANVERSION
type: source
config:
  source_type: transformation
  transformation_type: CONDITIONAL_SPLIT
  description: "Routes rows based on whether BeanVersion matches EDWBeanVersion"
  execution_order: 4
  depends_on:
    - SRC_LOOKUP_BEANVERSION
transformation_logic:
  operation: CONDITIONAL_SPLIT
  split_conditions:
    - output_name: UNCHANGED_ROWS
      condition: "BEANVERSION == EDWBeanVersion"
      description: "Rows where BeanVersion matches (no changes needed)"
      priority: 1
    - output_name: UPDATE_ROWS
      condition: "BEANVERSION != EDWBeanVersion AND EDWBeanVersion IS NOT NULL"
      description: "Rows where BeanVersion differs (updates needed)"
      priority: 2
    - output_name: INSERT_ROWS
      condition: "EDWBeanVersion IS NULL"
      description: "Rows with no match in lookup (new inserts)"
      priority: 3
  default_output: INSERT_ROWS
input_source:
  - SRC_LOOKUP_BEANVERSION
output:
  split_outputs:
    - name: UNCHANGED_ROWS
      pass_through: true
    - name: UPDATE_ROWS
      pass_through: true
    - name: INSERT_ROWS
      pass_through: true
fileVersion: 1
id: "SRC_TR_02_DERIVED_BATCHID"
name: "SRC_TR_02_DERIVED_BATCHID"
description: "Adds or overwrites BatchID column"
type: "Transformation"
transformationType: "DERIVED"
executionOrder: 2
config:
  database: "${database}"
  schema: "${schema}"
  tags:
    - "SSIS_MIGRATION"
    - "DERIVED_COLUMN"
    - "DIMBILLINGACCOUNT"
    - "BATCHID"
sources:
  - name: "SRC_TR_01_ROW_COUNT_SOURCE"
    type: "transformation"
transformationLogic: |
  -- Derived Column Transformation: Add BatchID
  -- Original SSIS Logic: BatchID = @[User::BatchID]
  SELECT
    *,
    ${BatchID} AS BATCHID
  FROM {{ ref('SRC_TR_01_ROW_COUNT_SOURCE') }}
variables:
  - name: "BatchID"
    type: "INTEGER"
    description: "Batch identifier for ETL run"
    source: "User::BatchID"
derivedColumns:
  - name: "BATCHID"
    dataType: "INTEGER"
    expression: "${BatchID}"
    description: "Batch ID from SSIS variable User::BatchID"
columns:
  - name: "*"
    description: "All columns from previous transformation"
  - name: "BATCHID"
    dataType: "INTEGER"
    description: "Batch identifier"
dependencies:
  - "SRC_TR_01_ROW_COUNT_SOURCE"
metadata:
  ssis_component: "Derived Column"
  ssis_expression: "BatchID = @[User::BatchID]"
  execution_sequence: 2
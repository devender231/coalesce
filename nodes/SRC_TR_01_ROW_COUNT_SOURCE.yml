fileVersion: 1
id: "SRC_TR_01_ROW_COUNT_SOURCE"
name: "SRC_TR_01_ROW_COUNT_SOURCE"
description: "Counts source rows from OLE_SRC - GuideWire"
type: "Transformation"
transformationType: "ROW_COUNT"
executionOrder: 1
config:
  database: "${database}"
  schema: "${schema}"
  tags:
    - "SSIS_MIGRATION"
    - "ROW_COUNT"
    - "DIMBILLINGACCOUNT"
    - "SOURCE_COUNT"
sources:
  - name: "SRC_JOIN_DIMBILLINGACCOUNT"
    type: "join"
transformationLogic: |
  -- Row Count Transformation: Count source rows
  -- Original SSIS Logic: Variable: User::SourceCount
  SELECT
    *,
    COUNT(*) OVER () AS SOURCE_ROW_COUNT
  FROM {{ ref('SRC_JOIN_DIMBILLINGACCOUNT') }}
variables:
  - name: "SourceCount"
    type: "INTEGER"
    description: "Total count of source rows from GuideWire"
    calculation: "COUNT(*)"
columns:
  - name: "*"
    description: "All columns from joined source"
  - name: "SOURCE_ROW_COUNT"
    dataType: "INTEGER"
    description: "Total source row count"
dependencies:
  - "SRC_JOIN_DIMBILLINGACCOUNT"
metadata:
  ssis_component: "Row Count"
  ssis_variable: "User::SourceCount"
  execution_sequence: 1
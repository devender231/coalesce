name: SRC_DIMBILLINGACCOUNT_JOINS
type: join
description: All joins for DimBillingAccount ETL process
sources:
  - SRC_BC_ACCOUNT
  - SRC_BCTL_ACCOUNTTYPE
  - SRC_BC_PARENTACCT
  - SRC_BCTL_BILLINGLEVEL
  - SRC_BCTL_CUSTOMERSERVICETIER
  - SRC_BC_SECURITYZONE
  - SRC_BCTL_DELINQUENCYSTATUS
  - SRC_BCTL_ACCOUNTSEGMENT
  - SRC_BC_ACCOUNTCONTACT
  - SRC_BC_ACCOUNTCONTACTROLE
  - SRC_BCTL_ACCOUNTROLE
  - SRC_BC_CONTACT
  - SRC_BC_ADDRESS
  - SRC_BCTL_STATE
  - SRC_DIMBILLINGACCOUNT

joins:
  - join_order: 1
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BCTL_ACCOUNTTYPE
    join_type: LEFT
    join_condition: SRC_BC_ACCOUNT.ACCOUNTTYPE = SRC_BCTL_ACCOUNTTYPE.ID
    output_alias: JOIN_ACCOUNTTYPE
    
  - join_order: 2
    left_table: JOIN_ACCOUNTTYPE
    right_table: SRC_BC_PARENTACCT
    join_type: LEFT
    join_condition: SRC_BC_PARENTACCT.OWNERID = SRC_BC_ACCOUNT.ID
    output_alias: JOIN_PARENTACCT
    
  - join_order: 3
    left_table: JOIN_PARENTACCT
    right_table: SRC_BCTL_BILLINGLEVEL
    join_type: LEFT
    join_condition: SRC_BC_ACCOUNT.BILLINGLEVEL = SRC_BCTL_BILLINGLEVEL.ID
    output_alias: JOIN_BILLINGLEVEL
    
  - join_order: 4
    left_table: JOIN_BILLINGLEVEL
    right_table: SRC_BCTL_CUSTOMERSERVICETIER
    join_type: LEFT
    join_condition: SRC_BC_ACCOUNT.SERVICETIER = SRC_BCTL_CUSTOMERSERVICETIER.ID
    output_alias: JOIN_SERVICETIER
    
  - join_order: 5
    left_table: JOIN_SERVICETIER
    right_table: SRC_BC_SECURITYZONE
    join_type: LEFT
    join_condition: SRC_BC_ACCOUNT.SECURITYZONEID = SRC_BC_SECURITYZONE.ID
    output_alias: JOIN_SECURITYZONE
    
  - join_order: 6
    left_table: JOIN_SECURITYZONE
    right_table: SRC_BCTL_DELINQUENCYSTATUS
    join_type: LEFT
    join_condition: SRC_BC_ACCOUNT.DELINQUENCYSTATUS = SRC_BCTL_DELINQUENCYSTATUS.ID
    output_alias: JOIN_DELINQUENCYSTATUS
    
  - join_order: 7
    left_table: JOIN_DELINQUENCYSTATUS
    right_table: SRC_BCTL_ACCOUNTSEGMENT
    join_type: LEFT
    join_condition: SRC_BC_ACCOUNT.SEGMENT = SRC_BCTL_ACCOUNTSEGMENT.ID
    output_alias: JOIN_ACCOUNTSEGMENT
    
  - join_order: 8
    left_table: JOIN_ACCOUNTSEGMENT
    right_table: INSUREDINFO
    join_type: LEFT
    join_condition: INSUREDINFO.ACCOUNTID = SRC_BC_ACCOUNT.ID
    output_alias: JOIN_INSUREDINFO
    description: Intermediate join to INSUREDINFO subquery
    
  - join_order: 9
    left_table: INSUREDINFO
    right_table: SRC_BC_ACCOUNTCONTACT
    join_type: INNER
    join_condition: SRC_BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID
    output_alias: JOIN_ACCOUNTCONTACT
    
  - join_order: 10
    left_table: JOIN_ACCOUNTCONTACT
    right_table: SRC_BC_ACCOUNTCONTACTROLE
    join_type: INNER
    join_condition: SRC_BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = SRC_BC_ACCOUNTCONTACT.ID
    output_alias: JOIN_CONTACTROLE
    
  - join_order: 11
    left_table: JOIN_CONTACTROLE
    right_table: SRC_BCTL_ACCOUNTROLE
    join_type: INNER
    join_condition: SRC_BCTL_ACCOUNTROLE.ID = SRC_BC_ACCOUNTCONTACTROLE.ROLE AND SRC_BCTL_ACCOUNTROLE.TYPECODE = 'insured'
    output_alias: JOIN_ACCOUNTROLE
    
  - join_order: 12
    left_table: JOIN_ACCOUNTROLE
    right_table: SRC_BC_CONTACT
    join_type: LEFT
    join_condition: SRC_BC_CONTACT.ID = SRC_BC_ACCOUNTCONTACT.CONTACTID
    output_alias: JOIN_CONTACT
    
  - join_order: 13
    left_table: JOIN_CONTACT
    right_table: SRC_BC_ADDRESS
    join_type: LEFT
    join_condition: SRC_BC_ADDRESS.ID = SRC_BC_CONTACT.PRIMARYADDRESSID
    output_alias: JOIN_ADDRESS
    
  - join_order: 14
    left_table: JOIN_ADDRESS
    right_table: SRC_BCTL_STATE
    join_type: LEFT
    join_condition: SRC_BCTL_STATE.ID = SRC_BC_ADDRESS.STATE
    output_alias: JOIN_STATE
    
  - join_order: 15
    left_table: LOOKUP_INPUT
    right_table: SRC_DIMBILLINGACCOUNT
    join_type: INNER
    join_condition: LOOKUP_INPUT.PUBLICID = SRC_DIMBILLINGACCOUNT.PUBLICID
    output_alias: JOIN_LOOKUP_DIMBILLINGACCOUNT
    description: Join for lookup validation

output:
  name: JOINED_DATA
  description: All source tables joined as per SSIS package logic
  execution_order: 1
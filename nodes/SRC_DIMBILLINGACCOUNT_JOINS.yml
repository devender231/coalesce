          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'SRC_BCTL_CUSTOMERSERVICETIER') }} "BCTL_CUSTOMERSERVICETIER"
            ON "BC_ACCOUNT"."SERVICETIER" = "BCTL_CUSTOMERSERVICETIER"."ID"
        name: BCTL_CUSTOMERSERVICETIER
        noLinkRefs: []
      
      # Join 5: BC_ACCOUNT LEFT JOIN BC_SECURITYZONE
      - aliases:
          BC_SECURITYZONE: SRC_BC_SECURITYZONE
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BC_SECURITYZONE
        join:
          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'SRC_BC_SECURITYZONE') }} "BC_SECURITYZONE"
            ON "BC_ACCOUNT"."SECURITYZONEID" = "BC_SECURITYZONE"."ID"
        name: BC_SECURITYZONE
        noLinkRefs: []
      
      # Join 6: BC_ACCOUNT LEFT JOIN BCTL_DELINQUENCYSTATUS
      - aliases:
          BCTL_DELINQUENCYSTATUS: SRC_BCTL_DELINQUENCYSTATUS
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BCTL_DELINQUENCYSTATUS
        join:
          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'SRC_BCTL_DELINQUENCYSTATUS') }} "BCTL_DELINQUENCYSTATUS"
            ON "BC_ACCOUNT"."DELINQUENCYSTATUS" = "BCTL_DELINQUENCYSTATUS"."ID"
        name: BCTL_DELINQUENCYSTATUS
        noLinkRefs: []
      
      # Join 7: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTSEGMENT
      - aliases:
          BCTL_ACCOUNTSEGMENT: SRC_BCTL_ACCOUNTSEGMENT
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BCTL_ACCOUNTSEGMENT
        join:
          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'SRC_BCTL_ACCOUNTSEGMENT') }} "BCTL_ACCOUNTSEGMENT"
            ON "BC_ACCOUNT"."SEGMENT" = "BCTL_ACCOUNTSEGMENT"."ID"
        name: BCTL_ACCOUNTSEGMENT
        noLinkRefs: []
      
      # Join 8-14: Insured Contact Information joins
      # Join 8: BC_ACCOUNT LEFT JOIN BC_ACCOUNTCONTACT (for insured)
      - aliases:
          BC_ACCOUNTCONTACT: SRC_BC_ACCOUNTCONTACT
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BC_ACCOUNTCONTACT
        join:
          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'SRC_BC_ACCOUNTCONTACT') }} "BC_ACCOUNTCONTACT"
            ON "BC_ACCOUNTCONTACT"."INSUREDACCOUNTID" = "BC_ACCOUNT"."ID"
        name: BC_ACCOUNTCONTACT
        noLinkRefs: []
      
      # Join 9: BC_ACCOUNTCONTACT INNER JOIN BC_ACCOUNTCONTACTROLE
      - aliases:
          BC_ACCOUNTCONTACTROLE: SRC_BC_ACCOUNTCONTACTROLE
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BC_ACCOUNTCONTACTROLE
        join:
          joinCondition: |
            INNER JOIN {{ ref('SRC', 'SRC_BC_ACCOUNTCONTACTROLE') }} "BC_ACCOUNTCONTACTROLE"
            ON "BC_ACCOUNTCONTACTROLE"."ACCOUNTCONTACTID" = "BC_ACCOUNTCONTACT"."ID"
        name: BC_ACCOUNTCONTACTROLE
        noLinkRefs: []
      
      # Join 10: BC_ACCOUNTCONTACTROLE INNER JOIN BCTL_ACCOUNTROLE (filter for 'insured')
      - aliases:
          BCTL_ACCOUNTROLE: SRC_BCTL_ACCOUNTROLE
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BCTL_ACCOUNTROLE
        join:
          joinCondition: |
            INNER JOIN {{ ref('SRC', 'SRC_BCTL_ACCOUNTROLE') }} "BCTL_ACCOUNTROLE"
            ON "BCTL_ACCOUNTROLE"."ID" = "BC_ACCOUNTCONTACTROLE"."ROLE"
            AND "BCTL_ACCOUNTROLE"."TYPECODE" = 'insured'
        name: BCTL_ACCOUNTROLE
        noLinkRefs: []
      
      # Join 11: BC_ACCOUNTCONTACT LEFT JOIN BC_CONTACT
      - aliases:
          BC_CONTACT: SRC_BC_CONTACT
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BC_CONTACT
        join:
          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'SRC_BC_CONTACT') }} "BC_CONTACT"
            ON "BC_CONTACT"."ID" = "BC_ACCOUNTCONTACT"."CONTACTID"
        name: BC_CONTACT
        noLinkRefs: []
      
      # Join 12: BC_CONTACT LEFT JOIN BC_ADDRESS
      - aliases:
          BC_ADDRESS: SRC_BC_ADDRESS
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BC_ADDRESS

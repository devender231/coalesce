            nodeName: BC_SECURITYZONE
          - locationName: SRC
            nodeName: BCTL_DELINQUENCYSTATUS
          - locationName: SRC
            nodeName: BCTL_ACCOUNTSEGMENT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACTROLE
          - locationName: SRC
            nodeName: BCTL_ACCOUNTROLE
          - locationName: SRC
            nodeName: BC_CONTACT
          - locationName: SRC
            nodeName: BC_ADDRESS
          - locationName: SRC
            nodeName: BCTL_STATE
        join:
          joinCondition: |
            -- Join 1: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTTYPE
            LEFT JOIN {{ ref('SRC_BCTL_ACCOUNTTYPE') }} AS BCTL_ACCOUNTTYPE
              ON BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
            
            -- Join 2: BC_ACCOUNT LEFT JOIN BC_PARENTACCT
            LEFT JOIN {{ ref('SRC_BC_PARENTACCT') }} AS BC_PARENTACCT
              ON BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
            
            -- Join 3: BC_ACCOUNT LEFT JOIN BCTL_BILLINGLEVEL
            LEFT JOIN {{ ref('SRC_BCTL_BILLINGLEVEL') }} AS BCTL_BILLINGLEVEL
              ON BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
            
            -- Join 4: BC_ACCOUNT LEFT JOIN BCTL_CUSTOMERSERVICETIER
            LEFT JOIN {{ ref('SRC_BCTL_CUSTOMERSERVICETIER') }} AS BCTL_CUSTOMERSERVICETIER
              ON BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
            
            -- Join 5: BC_ACCOUNT LEFT JOIN BC_SECURITYZONE
            LEFT JOIN {{ ref('SRC_BC_SECURITYZONE') }} AS BC_SECURITYZONE
              ON BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
            
            -- Join 6: BC_ACCOUNT LEFT JOIN BCTL_DELINQUENCYSTATUS
            LEFT JOIN {{ ref('SRC_BCTL_DELINQUENCYSTATUS') }} AS BCTL_DELINQUENCYSTATUS
              ON BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
            
            -- Join 7: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTSEGMENT
            LEFT JOIN {{ ref('SRC_BCTL_ACCOUNTSEGMENT') }} AS BCTL_ACCOUNTSEGMENT
              ON BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
            
            -- Join 8: BC_ACCOUNT LEFT JOIN INSUREDINFO (Derived from BC_ACCOUNTCONTACT)
            LEFT JOIN {{ ref('SRC_BC_ACCOUNTCONTACT') }} AS BC_ACCOUNTCONTACT
              ON BC_ACCOUNTCONTACT.INSUREDACCOUNTID = BC_ACCOUNT.ID
            
            -- Join 9: INSUREDINFO INNER JOIN BC_ACCOUNTCONTACTROLE
            INNER JOIN {{ ref('SRC_BC_ACCOUNTCONTACTROLE') }} AS BC_ACCOUNTCONTACTROLE
              ON BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
            
            -- Join 10: INSUREDINFO INNER JOIN BCTL_ACCOUNTROLE
            INNER JOIN {{ ref('SRC_BCTL_ACCOUNTROLE') }} AS BCTL_ACCOUNTROLE
              ON BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE
              AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
            
            -- Join 11: INSUREDINFO LEFT JOIN BC_CONTACT
            LEFT JOIN {{ ref('SRC_BC_CONTACT') }} AS BC_CONTACT
              ON BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
            
            -- Join 12: INSUREDINFO LEFT JOIN BC_ADDRESS
            LEFT JOIN {{ ref('SRC_BC_ADDRESS') }} AS BC_ADDRESS
              ON BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID
            
            -- Join 13: INSUREDINFO LEFT JOIN BCTL_STATE
            LEFT JOIN {{ ref('SRC_BCTL_STATE') }} AS BCTL_STATE
              ON BCTL_STATE.ID = BC_ADDRESS.STATE
        name: SRC_DIMBILLINGACCOUNT_JOINS
        noLinkRefs: []

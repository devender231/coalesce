fileVersion: 1
id: "SRC_DIMBILLINGACCOUNT_JOINS"
name: "SRC_DIMBILLINGACCOUNT_JOINS"
operation:
  config:
    insertStrategy: INSERT
    selectDistinct: false
  database: ""
  deployEnabled: true
  description: "Join operations for DimBillingAccount - 15 joins in execution order"
  isMultisource: true
  locationName: "WORK"
  materializationType: "view"
  metadata:
    appliedNodeTests: []
    columns:
      - acceptedValues:
          strictMatch: true
          values: []
        appliedColumnTests: {}
        columnReference:
          columnCounter: 1
          stepCounter: "SRC_DIMBILLINGACCOUNT_JOINS"
        config: {}
        dataType: "VARCHAR(16777216)"
        description: "Account ID from BC_ACCOUNT"
        name: "ACCOUNT_ID"
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 1
                stepCounter: "SRC_BC_ACCOUNT"
            transform: ""
    cteString: ""
    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          BC_ACCOUNT: "SRC_BC_ACCOUNT"
          BC_PARENTACCT: "SRC_BC_PARENTACCT"
          BC_ACCOUNTCONTACT: "SRC_BC_ACCOUNTCONTACT"
          BC_ACCOUNTCONTACTROLE: "SRC_BC_ACCOUNTCONTACTROLE"
          BCTL_ACCOUNTROLE: "SRC_BCTL_ACCOUNTROLE"
          BC_CONTACT: "SRC_BC_CONTACT"
          BC_ADDRESS: "SRC_BC_ADDRESS"
          BCTL_STATE: "SRC_BCTL_STATE"
          BCTL_ACCOUNTTYPE: "SRC_BCTL_ACCOUNTTYPE"
          BCTL_BILLINGLEVEL: "SRC_BCTL_BILLINGLEVEL"
          BCTL_CUSTOMERSERVICETIER: "SRC_BCTL_CUSTOMERSERVICETIER"
          BC_SECURITYZONE: "SRC_BC_SECURITYZONE"
          BCTL_DELINQUENCYSTATUS: "SRC_BCTL_DELINQUENCYSTATUS"
          BCTL_ACCOUNTSEGMENT: "SRC_BCTL_ACCOUNTSEGMENT"
          DIMBILLINGACCOUNT: "SRC_DIMBILLINGACCOUNT"
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: "WORK"
            nodeName: "SRC_BC_ACCOUNT"
          - locationName: "WORK"
            nodeName: "SRC_BC_PARENTACCT"
          - locationName: "WORK"
            nodeName: "SRC_BC_ACCOUNTCONTACT"
          - locationName: "WORK"
            nodeName: "SRC_BC_ACCOUNTCONTACTROLE"
          - locationName: "WORK"
            nodeName: "SRC_BCTL_ACCOUNTROLE"
          - locationName: "WORK"
            nodeName: "SRC_BC_CONTACT"
          - locationName: "WORK"
            nodeName: "SRC_BC_ADDRESS"
          - locationName: "WORK"
            nodeName: "SRC_BCTL_STATE"
          - locationName: "WORK"
            nodeName: "SRC_BCTL_ACCOUNTTYPE"
          - locationName: "WORK"
            nodeName: "SRC_BCTL_BILLINGLEVEL"
          - locationName: "WORK"
            nodeName: "SRC_BCTL_CUSTOMERSERVICETIER"
          - locationName: "WORK"
            nodeName: "SRC_BC_SECURITYZONE"
          - locationName: "WORK"
            nodeName: "SRC_BCTL_DELINQUENCYSTATUS"
          - locationName: "WORK"
            nodeName: "SRC_BCTL_ACCOUNTSEGMENT"
          - locationName: "WORK"
            nodeName: "SRC_DIMBILLINGACCOUNT"
        join:
          # Join 1: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTTYPE
          - joinCondition: |
              FROM {{ ref('WORK', 'SRC_BC_ACCOUNT') }} BC_ACCOUNT
              LEFT JOIN {{ ref('WORK', 'SRC_BCTL_ACCOUNTTYPE') }} BCTL_ACCOUNTTYPE
                ON BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
          # Join 2: BC_ACCOUNT LEFT JOIN BC_PARENTACCT
          - joinCondition: |
              LEFT JOIN {{ ref('WORK', 'SRC_BC_PARENTACCT') }} BC_PARENTACCT
                ON BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
          # Join 3: BC_ACCOUNT LEFT JOIN BCTL_BILLINGLEVEL
          - joinCondition: |
              LEFT JOIN {{ ref('WORK', 'SRC_BCTL_BILLINGLEVEL') }} BCTL_BILLINGLEVEL
                ON BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
          # Join 4: BC_ACCOUNT LEFT JOIN BCTL_CUSTOMERSERVICETIER
          - joinCondition: |
              LEFT JOIN {{ ref('WORK', 'SRC_BCTL_CUSTOMERSERVICETIER') }} BCTL_CUSTOMERSERVICETIER
                ON BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
          # Join 5: BC_ACCOUNT LEFT JOIN BC_SECURITYZONE
          - joinCondition: |
              LEFT JOIN {{ ref('WORK', 'SRC_BC_SECURITYZONE') }} BC_SECURITYZONE
                ON BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
          # Join 6: BC_ACCOUNT LEFT JOIN BCTL_DELINQUENCYSTATUS
          - joinCondition: |
              LEFT JOIN {{ ref('WORK', 'SRC_BCTL_DELINQUENCYSTATUS') }} BCTL_DELINQUENCYSTATUS
                ON BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
          # Join 7: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTSEGMENT
          - joinCondition: |
              LEFT JOIN {{ ref('WORK', 'SRC_BCTL_ACCOUNTSEGMENT') }} BCTL_ACCOUNTSEGMENT
                ON BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
          # Join 8: BC_ACCOUNT LEFT JOIN INSUREDINFO (derived from accountcontact joins)
          - joinCondition: |
              LEFT JOIN (
                SELECT 
                  BC_ACCOUNTCONTACT.ACCOUNTID,
                  BC_CONTACT.ID AS CONTACT_ID,
                  BC_ADDRESS.ID AS ADDRESS_ID,
                  BCTL_STATE.ID AS STATE_ID
                FROM {{ ref('WORK', 'SRC_BC_ACCOUNTCONTACT') }} BC_ACCOUNTCONTACT
                INNER JOIN {{ ref('WORK', 'SRC_BC_ACCOUNTCONTACTROLE') }} BC_ACCOUNTCONTACTROLE
                  ON BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
                INNER JOIN {{ ref('WORK', 'SRC_BCTL_ACCOUNTROLE') }} BCTL_ACCOUNTROLE
                  ON BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE 
                  AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
                LEFT JOIN {{ ref('WORK', 'SRC_BC_CONTACT') }} BC_CONTACT
                  ON BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
                LEFT JOIN {{ ref('WORK', 'SRC_BC_ADDRESS') }} BC_ADDRESS
                  ON BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID
                LEFT JOIN {{ ref('WORK', 'SRC_BCTL_STATE') }} BCTL_STATE
                  ON BCTL_STATE.ID = BC_ADDRESS.STATE
              ) INSUREDINFO
                ON INSUREDINFO.ACCOUNTID = BC_ACCOUNT.ID
          # Join 15: INNER JOIN with DIMBILLINGACCOUNT for lookup
          - joinCondition: |
              INNER JOIN {{ ref('WORK', 'SRC_DIMBILLINGACCOUNT') }} DIMBILLINGACCOUNT
                ON BC_ACCOUNT.PUBLICID = DIMBILLINGACCOUNT.PUBLICID
        name: "SRC_DIMBILLINGACCOUNT_JOINS"
        noLinkRefs: []
  name: "SRC_DIMBILLINGACCOUNT_JOINS"
  overrideSQL: false
  schema: ""
  sqlType: "DT113:::156"
  type: "sql"
  version: 1
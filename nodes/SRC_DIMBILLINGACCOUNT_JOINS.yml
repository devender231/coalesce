          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'SRC_BCTL_STATE') }} "BCTL_STATE"
            ON "BCTL_STATE"."ID" = "BC_ADDRESS"."STATE"
        name: BCTL_STATE
        noLinkRefs: []

          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'SRC_BC_ADDRESS') }} "BC_ADDRESS"
            ON "BC_ADDRESS"."ID" = "BC_CONTACT"."PRIMARYADDRESSID"
        name: BC_ADDRESS
        noLinkRefs: []
      
      # Join 13: BC_ADDRESS LEFT JOIN BCTL_STATE
      - aliases:
          BCTL_STATE: SRC_BCTL_STATE
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BCTL_STATE

    sourceMapping:
      # Base table - BC_ACCOUNT
      - aliases:
          BC_ACCOUNT: SRC_BC_ACCOUNT
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BC_ACCOUNT
        join:
          joinCondition: |
            FROM {{ ref('SRC', 'SRC_BC_ACCOUNT') }} "BC_ACCOUNT"
        name: BC_ACCOUNT
        noLinkRefs: []
      
      # Join 1: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTTYPE
      - aliases:
          BCTL_ACCOUNTTYPE: SRC_BCTL_ACCOUNTTYPE
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BCTL_ACCOUNTTYPE
        join:
          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'SRC_BCTL_ACCOUNTTYPE') }} "BCTL_ACCOUNTTYPE"
            ON "BC_ACCOUNT"."ACCOUNTTYPE" = "BCTL_ACCOUNTTYPE"."ID"
        name: BCTL_ACCOUNTTYPE
        noLinkRefs: []
      
      # Join 2: BC_ACCOUNT LEFT JOIN BC_PARENTACCT
      - aliases:
          BC_PARENTACCT: SRC_BC_PARENTACCT
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BC_PARENTACCT
        join:
          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'SRC_BC_PARENTACCT') }} "BC_PARENTACCT"
            ON "BC_PARENTACCT"."OWNERID" = "BC_ACCOUNT"."ID"
        name: BC_PARENTACCT
        noLinkRefs: []
      
      # Join 3: BC_ACCOUNT LEFT JOIN BCTL_BILLINGLEVEL
      - aliases:
          BCTL_BILLINGLEVEL: SRC_BCTL_BILLINGLEVEL
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BCTL_BILLINGLEVEL
        join:
          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'SRC_BCTL_BILLINGLEVEL') }} "BCTL_BILLINGLEVEL"
            ON "BC_ACCOUNT"."BILLINGLEVEL" = "BCTL_BILLINGLEVEL"."ID"
        name: BCTL_BILLINGLEVEL
        noLinkRefs: []
      
      # Join 4: BC_ACCOUNT LEFT JOIN BCTL_CUSTOMERSERVICETIER
      - aliases:
          BCTL_CUSTOMERSERVICETIER: SRC_BCTL_CUSTOMERSERVICETIER
        customSQL:
          customSQL: ""
        dependencies:

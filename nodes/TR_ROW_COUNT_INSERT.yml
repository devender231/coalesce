name: TR_ROW_COUNT_INSERT
type: row_count
description: Counts the number of new records to be inserted from conditional split
source: TR_CONDITIONAL_SPLIT_SCD.INSERT
transformation_logic: |
  Count all rows that are new records (INSERT output)
  Store count in variable for logging and monitoring
  These records will be inserted into DimBillingAccount

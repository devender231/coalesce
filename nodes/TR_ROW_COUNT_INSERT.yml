  - BC_CONTACT.LASTNAME
  - BC_ADDRESS.ADDRESSLINE1
  - BC_ADDRESS.CITY
  - BCTL_STATE.NAME
  - DIMBILLINGACCOUNT.BEANVERSION
  - BatchID
  - INSERT_ROW_COUNT
row_count_variable: INSERT_ROW_COUNT

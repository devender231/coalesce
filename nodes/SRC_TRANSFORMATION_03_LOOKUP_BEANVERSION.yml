---
name: SRC_TRANSFORMATION_03_LOOKUP_BEANVERSION
type: transformation
transformation_type: LOOKUP
execution_order: 3
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID

source:
  type: upstream_transformation
  name: SRC_TRANSFORMATION_02_DERIVED_BATCHID
  description: Output from derived column transformation

lookup_configuration:
  lookup_table: DIMBILLINGACCOUNT
  lookup_query: "SELECT Publicid, BeanVersion FROM DimBillingAccount"
  join_type: LEFT_OUTER
  join_condition:
    - input_column: PUBLICID
      lookup_column: DIMBILLINGACCOUNT.PUBLICID
      operator: "="
  
  lookup_columns:
    - name: BeanVersion
      alias: EDWBeanVersion
      description: Current BeanVersion from dimension table
  
  cache_mode: FULL
  no_match_behavior: OUTPUT_NULL

transformation_logic:
  operation: LOOKUP_AND_ENRICH
  match_condition: PUBLICID = DIMBILLINGACCOUNT.PUBLICID
  output_on_match:
    - BeanVersion as EDWBeanVersion
  output_on_no_match:
    - NULL as EDWBeanVersion

output:
  columns:
    - name: EDWBeanVersion
      source: LOOKUP
      lookup_table: DIMBILLINGACCOUNT
      lookup_column: BeanVersion
  description: All input columns plus EDWBeanVersion from lookup

upstream_dependencies:
  - SRC_TRANSFORMATION_02_DERIVED_BATCHID
  - SRC_DIMBILLINGACCOUNT

metadata:
  package_name: EDW_BC_Load_DimBillingAccount
  component_type: Lookup
  execution_sequence: 3
  purpose: Retrieve existing BeanVersion for change detection
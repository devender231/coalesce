name: SRC_JOINS_DIMBILLINGACCOUNT
type: join
description: All joins for DimBillingAccount ETL pipeline
sources:
  - SRC_BC_ACCOUNT
  - SRC_BCTL_ACCOUNTTYPE
  - SRC_BC_PARENTACCT
  - SRC_BCTL_BILLINGLEVEL
  - SRC_BCTL_CUSTOMERSERVICETIER
  - SRC_BC_SECURITYZONE
  - SRC_BCTL_DELINQUENCYSTATUS
  - SRC_BCTL_ACCOUNTSEGMENT
  - SRC_BC_ACCOUNTCONTACT
  - SRC_BC_ACCOUNTCONTACTROLE
  - SRC_BCTL_ACCOUNTROLE
  - SRC_BC_CONTACT
  - SRC_BC_ADDRESS
  - SRC_BCTL_STATE
  - SRC_DIMBILLINGACCOUNT

joins:
  # Join 1: BC_ACCOUNT with BCTL_ACCOUNTTYPE
  - join_order: 1
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_ACCOUNTTYPE
    join_type: LEFT
    condition: BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
    output_alias: ACCOUNT_WITH_TYPE

  # Join 2: BC_ACCOUNT with BC_PARENTACCT
  - join_order: 2
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BC_PARENTACCT
    join_type: LEFT
    condition: BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
    output_alias: ACCOUNT_WITH_PARENT

  # Join 3: BC_ACCOUNT with BCTL_BILLINGLEVEL
  - join_order: 3
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_BILLINGLEVEL
    join_type: LEFT
    condition: BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
    output_alias: ACCOUNT_WITH_BILLING

  # Join 4: BC_ACCOUNT with BCTL_CUSTOMERSERVICETIER
  - join_order: 4
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_CUSTOMERSERVICETIER
    join_type: LEFT
    condition: BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
    output_alias: ACCOUNT_WITH_SERVICE

  # Join 5: BC_ACCOUNT with BC_SECURITYZONE
  - join_order: 5
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BC_SECURITYZONE
    join_type: LEFT
    condition: BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
    output_alias: ACCOUNT_WITH_SECURITY

  # Join 6: BC_ACCOUNT with BCTL_DELINQUENCYSTATUS
  - join_order: 6
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_DELINQUENCYSTATUS
    join_type: LEFT
    condition: BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
    output_alias: ACCOUNT_WITH_DELINQUENCY

  # Join 7: BC_ACCOUNT with BCTL_ACCOUNTSEGMENT
  - join_order: 7
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_ACCOUNTSEGMENT
    join_type: LEFT
    condition: BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
    output_alias: ACCOUNT_WITH_SEGMENT

  # Join 8: BC_ACCOUNT with INSUREDINFO (intermediate result)
  - join_order: 8
    left_source: SRC_BC_ACCOUNT
    right_source: INSUREDINFO
    join_type: LEFT
    condition: INSUREDINFO.ACCOUNTID = BC_ACCOUNT.ID
    output_alias: ACCOUNT_WITH_INSURED
    note: INSUREDINFO is derived from subsequent joins

  # Join 9: INSUREDINFO with BC_ACCOUNTCONTACT
  - join_order: 9
    left_source: INSUREDINFO
    right_source: SRC_BC_ACCOUNTCONTACT
    join_type: INNER
    condition: BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID
    output_alias: INSURED_WITH_CONTACT

  # Join 10: INSUREDINFO with BC_ACCOUNTCONTACTROLE
  - join_order: 10
    left_source: INSUREDINFO
    right_source: SRC_BC_ACCOUNTCONTACTROLE
    join_type: INNER
    condition: BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
    output_alias: INSURED_WITH_ROLE

  # Join 11: INSUREDINFO with BCTL_ACCOUNTROLE
  - join_order: 11
    left_source: INSUREDINFO
    right_source: SRC_BCTL_ACCOUNTROLE
    join_type: INNER
    condition: BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
    output_alias: INSURED_WITH_ROLE_TYPE

  # Join 12: INSUREDINFO with BC_CONTACT
  - join_order: 12
    left_source: INSUREDINFO
    right_source: SRC_BC_CONTACT
    join_type: LEFT
    condition: BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
    output_alias: INSURED_WITH_CONTACT_DETAILS

  # Join 13: INSUREDINFO with BC_ADDRESS
  - join_order: 13
    left_source: INSUREDINFO
    right_source: SRC_BC_ADDRESS
    join_type: LEFT
    condition: BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID
    output_alias: INSURED_WITH_ADDRESS

  # Join 14: INSUREDINFO with BCTL_STATE
  - join_order: 14
    left_source: INSUREDINFO
    right_source: SRC_BCTL_STATE
    join_type: LEFT
    condition: BCTL_STATE.ID = BC_ADDRESS.STATE
    output_alias: INSURED_WITH_STATE

  # Join 15: LOOKUP_INPUT with DIMBILLINGACCOUNT (for lookup transformation)
  - join_order: 15
    left_source: LOOKUP_INPUT
    right_source: SRC_DIMBILLINGACCOUNT
    join_type: INNER
    condition: LOOKUP_INPUT.PUBLICID = DIMBILLINGACCOUNT.PUBLICID
    output_alias: LOOKUP_RESULT
    note: Used in Lookup transformation to match existing records

output:
  name: JOINED_DATASET
  description: Complete joined dataset ready for transformations

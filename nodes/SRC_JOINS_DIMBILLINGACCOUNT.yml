name: SRC_JOINS_DIMBILLINGACCOUNT
type: join
config:
  description: "Joins all source tables for DimBillingAccount ETL process"
  join_strategy: multi_table_join
sources:
  - SRC_BC_ACCOUNT
  - SRC_BCTL_ACCOUNTTYPE
  - SRC_BC_PARENTACCT
  - SRC_BCTL_BILLINGLEVEL
  - SRC_BCTL_CUSTOMERSERVICETIER
  - SRC_BC_SECURITYZONE
  - SRC_BCTL_DELINQUENCYSTATUS
  - SRC_BCTL_ACCOUNTSEGMENT
  - SRC_BC_ACCOUNTCONTACT
  - SRC_BC_ACCOUNTCONTACTROLE
  - SRC_BCTL_ACCOUNTROLE
  - SRC_BC_CONTACT
  - SRC_BC_ADDRESS
  - SRC_BCTL_STATE
joins:
  - join_number: 1
    join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_ACCOUNTTYPE
    join_condition: "SRC_BC_ACCOUNT.ACCOUNTTYPE = SRC_BCTL_ACCOUNTTYPE.ID"
    description: "Join BC_ACCOUNT with ACCOUNTTYPE lookup"
  
  - join_number: 2
    join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BC_PARENTACCT
    join_condition: "SRC_BC_PARENTACCT.OWNERID = SRC_BC_ACCOUNT.ID"
    description: "Join BC_ACCOUNT with parent account information"
  
  - join_number: 3
    join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_BILLINGLEVEL
    join_condition: "SRC_BC_ACCOUNT.BILLINGLEVEL = SRC_BCTL_BILLINGLEVEL.ID"
    description: "Join BC_ACCOUNT with billing level lookup"
  
  - join_number: 4
    join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_CUSTOMERSERVICETIER
    join_condition: "SRC_BC_ACCOUNT.SERVICETIER = SRC_BCTL_CUSTOMERSERVICETIER.ID"
    description: "Join BC_ACCOUNT with service tier lookup"
  
  - join_number: 5
    join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BC_SECURITYZONE
    join_condition: "SRC_BC_ACCOUNT.SECURITYZONEID = SRC_BC_SECURITYZONE.ID"
    description: "Join BC_ACCOUNT with security zone"
  
  - join_number: 6
    join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_DELINQUENCYSTATUS
    join_condition: "SRC_BC_ACCOUNT.DELINQUENCYSTATUS = SRC_BCTL_DELINQUENCYSTATUS.ID"
    description: "Join BC_ACCOUNT with delinquency status lookup"
  
  - join_number: 7
    join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_ACCOUNTSEGMENT
    join_condition: "SRC_BC_ACCOUNT.SEGMENT = SRC_BCTL_ACCOUNTSEGMENT.ID"
    description: "Join BC_ACCOUNT with account segment lookup"
  
  - join_number: 8
    join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: INSUREDINFO
    join_condition: "INSUREDINFO.ACCOUNTID = SRC_BC_ACCOUNT.ID"
    description: "Join BC_ACCOUNT with insured information (derived from account contact)"
  
  - join_number: 9
    join_type: INNER
    left_source: INSUREDINFO
    right_source: SRC_BC_ACCOUNTCONTACT
    join_condition: "SRC_BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID"
    description: "Join insured info with account contact"
  
  - join_number: 10
    join_type: INNER
    left_source: INSUREDINFO
    right_source: SRC_BC_ACCOUNTCONTACTROLE
    join_condition: "SRC_BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = SRC_BC_ACCOUNTCONTACT.ID"
    description: "Join with account contact role"
  
  - join_number: 11
    join_type: INNER
    left_source: INSUREDINFO
    right_source: SRC_BCTL_ACCOUNTROLE
    join_condition: "SRC_BCTL_ACCOUNTROLE.ID = SRC_BC_ACCOUNTCONTACTROLE.ROLE AND SRC_BCTL_ACCOUNTROLE.TYPECODE = 'insured'"
    description: "Join with account role lookup filtered for insured type"
  
  - join_number: 12
    join_type: LEFT
    left_source: INSUREDINFO
    right_source: SRC_BC_CONTACT
    join_condition: "SRC_BC_CONTACT.ID = SRC_BC_ACCOUNTCONTACT.CONTACTID"
    description: "Join with contact information"
  
  - join_number: 13
    join_type: LEFT
    left_source: INSUREDINFO
    right_source: SRC_BC_ADDRESS
    join_condition: "SRC_BC_ADDRESS.ID = SRC_BC_CONTACT.PRIMARYADDRESSID"
    description: "Join with primary address"
  
  - join_number: 14
    join_type: LEFT
    left_source: INSUREDINFO
    right_source: SRC_BCTL_STATE
    join_condition: "SRC_BCTL_STATE.ID = SRC_BC_ADDRESS.STATE"
    description: "Join with state lookup"
output_columns:
  - SRC_BC_ACCOUNT.ACCOUNTNUMBER
  - SRC_BC_ACCOUNT.ACCOUNTNAME
  - SRC_BC_ACCOUNT.ACCOUNTTYPE
  - SRC_BCTL_ACCOUNTTYPE.NAME as ACCOUNTTYPE_NAME
  - SRC_BC_ACCOUNT.BILLINGLEVEL
  - SRC_BCTL_BILLINGLEVEL.NAME as BILLINGLEVEL_NAME
  - SRC_BC_ACCOUNT.SERVICETIER
  - SRC_BCTL_CUSTOMERSERVICETIER.NAME as SERVICETIER_NAME
  - SRC_BC_ACCOUNT.SECURITYZONEID
  - SRC_BC_SECURITYZONE.NAME as SECURITYZONE_NAME
  - SRC_BC_ACCOUNT.SEGMENT
  - SRC_BCTL_ACCOUNTSEGMENT.NAME as SEGMENT_NAME
  - SRC_BC_ACCOUNT.CLOSEDATE
  - SRC_BC_ACCOUNT.CREATETIME
  - SRC_BC_ACCOUNT.DELINQUENCYSTATUS
  - SRC_BCTL_DELINQUENCYSTATUS.NAME as DELINQUENCYSTATUS_NAME
  - SRC_BC_ACCOUNT.FIRSTTWICEPERMTHINVOICEDOM
  - SRC_BC_ACCOUNT.SECONDTWICEPERMTHINVOICEDOM
  - SRC_BC_ACCOUNT.PUBLICID
  - SRC_BC_ACCOUNT.ID
  - SRC_BC_ACCOUNT.BEANVERSION
  - SRC_BC_ACCOUNT.RETIRED
  - SRC_BC_ACCOUNT.UPDATETIME
  - SRC_BC_PARENTACCT.FOREIGNENTITYID as PARENT_ACCOUNT_ID
  - SRC_BC_CONTACT.FIRSTNAME as INSURED_FIRSTNAME
  - SRC_BC_CONTACT.LASTNAME as INSURED_LASTNAME
  - SRC_BC_ADDRESS.ADDRESSLINE1
  - SRC_BC_ADDRESS.ADDRESSLINE2
  - SRC_BC_ADDRESS.ADDRESSLINE3
  - SRC_BC_ADDRESS.CITY
  - SRC_BC_ADDRESS.POSTALCODE
  - SRC_BCTL_STATE.NAME as STATE_NAME
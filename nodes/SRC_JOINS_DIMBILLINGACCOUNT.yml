fileVersion: 1
id: J1
name: JOINS_DIMBILLINGACCOUNT
operation:
  database: ""
  deployEnabled: true
  description: "All joins for DimBillingAccount ETL process - 15 joins combining BC_ACCOUNT with lookup tables and insured information"
  locationName: SRC
  metadata:
    joins:
      - join:
          joinType: LEFT
          leftTable:
            name: BC_ACCOUNT
            stepCounter: S1
          rightTable:
            name: BCTL_ACCOUNTTYPE
            stepCounter: S9
          condition: "BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID"
          description: "Join BC_ACCOUNT with BCTL_ACCOUNTTYPE to get account type name"
      - join:
          joinType: LEFT
          leftTable:
            name: BC_ACCOUNT
            stepCounter: S1
          rightTable:
            name: BC_PARENTACCT
            stepCounter: S2
          condition: "BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID"
          description: "Join BC_ACCOUNT with BC_PARENTACCT to get parent account information"
      - join:
          joinType: LEFT
          leftTable:
            name: BC_ACCOUNT
            stepCounter: S1
          rightTable:
            name: BCTL_BILLINGLEVEL
            stepCounter: S10
          condition: "BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID"
          description: "Join BC_ACCOUNT with BCTL_BILLINGLEVEL to get billing level name"
      - join:
          joinType: LEFT
          leftTable:
            name: BC_ACCOUNT
            stepCounter: S1
          rightTable:
            name: BCTL_CUSTOMERSERVICETIER
            stepCounter: S11
          condition: "BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID"
          description: "Join BC_ACCOUNT with BCTL_CUSTOMERSERVICETIER to get service tier name"
      - join:
          joinType: LEFT
          leftTable:
            name: BC_ACCOUNT
            stepCounter: S1
          rightTable:
            name: BC_SECURITYZONE
            stepCounter: S12
          condition: "BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID"
          description: "Join BC_ACCOUNT with BC_SECURITYZONE to get security zone name"
      - join:
          joinType: LEFT
          leftTable:
            name: BC_ACCOUNT
            stepCounter: S1
          rightTable:
            name: BCTL_DELINQUENCYSTATUS
            stepCounter: S13
          condition: "BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID"
          description: "Join BC_ACCOUNT with BCTL_DELINQUENCYSTATUS to get delinquency status name"
      - join:
          joinType: LEFT
          leftTable:
            name: BC_ACCOUNT
            stepCounter: S1
          rightTable:
            name: BCTL_ACCOUNTSEGMENT
            stepCounter: S14
          condition: "BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID"
          description: "Join BC_ACCOUNT with BCTL_ACCOUNTSEGMENT to get account segment name"
      - join:
          joinType: LEFT
          leftTable:
            name: BC_ACCOUNT
            stepCounter: S1
          rightTable:
            name: INSUREDINFO
            stepCounter: DERIVED
          condition: "INSUREDINFO.ACCOUNTID = BC_ACCOUNT.ID"
          description: "Join BC_ACCOUNT with INSUREDINFO subquery to get insured contact information"
      - join:
          joinType: INNER
          leftTable:
            name: INSUREDINFO
            stepCounter: DERIVED
          rightTable:
            name: BC_ACCOUNTCONTACT
            stepCounter: S3
          condition: "BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID"
          description: "Join INSUREDINFO with BC_ACCOUNTCONTACT to get account contact ID"
      - join:
          joinType: INNER
          leftTable:
            name: INSUREDINFO
            stepCounter: DERIVED
          rightTable:
            name: BC_ACCOUNTCONTACTROLE
            stepCounter: S4
          condition: "BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID"
          description: "Join INSUREDINFO with BC_ACCOUNTCONTACTROLE to get contact role"
      - join:
          joinType: INNER
          leftTable:
            name: INSUREDINFO
            stepCounter: DERIVED
          rightTable:
            name: BCTL_ACCOUNTROLE
            stepCounter: S5
          condition: "BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'"
          description: "Join INSUREDINFO with BCTL_ACCOUNTROLE to filter for insured role type"
      - join:
          joinType: LEFT
          leftTable:
            name: INSUREDINFO
            stepCounter: DERIVED
          rightTable:
            name: BC_CONTACT
            stepCounter: S6
          condition: "BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID"
          description: "Join INSUREDINFO with BC_CONTACT to get contact details (name)"
      - join:
          joinType: LEFT
          leftTable:
            name: INSUREDINFO
            stepCounter: DERIVED
          rightTable:
            name: BC_ADDRESS
            stepCounter: S7
          condition: "BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID"
          description: "Join INSUREDINFO with BC_ADDRESS to get primary address details"
      - join:
          joinType: LEFT
          leftTable:
            name: INSUREDINFO
            stepCounter: DERIVED
          rightTable:
            name: BCTL_STATE
            stepCounter: S8
          condition: "BCTL_STATE.ID = BC_ADDRESS.STATE"
          description: "Join INSUREDINFO with BCTL_STATE to get state name"
      - join:
          joinType: INNER
          leftTable:
            name: LOOKUP_INPUT
            stepCounter: DERIVED
          rightTable:
            name: DIMBILLINGACCOUNT
            stepCounter: S15
          condition: "LOOKUP_INPUT.PUBLICID = DIMBILLINGACCOUNT.PUBLICID"
          description: "Lookup join to match existing records in DIMBILLINGACCOUNT by PUBLICID"
  name: JOINS_DIMBILLINGACCOUNT
  schema: ""
  sqlType: Join
  type: join
  version: 1
type: Node
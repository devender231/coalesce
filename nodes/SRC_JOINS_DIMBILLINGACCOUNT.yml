          BC_CONTACT: S6
          BC_ADDRESS: S7
          BCTL_STATE: S8
        customSQL:
          customSQL: |
            SELECT
              BC_ACCOUNT.ACCOUNTNUMBER               AS ACCOUNTNUMBER,
              BC_ACCOUNT.ACCOUNTNAME                 AS ACCOUNTNAME,
              BC_ACCOUNT.ACCOUNTTYPE                 AS ACCOUNTTYPE,
              BC_ACCOUNT.BILLINGLEVEL                AS BILLINGLEVEL,
              BC_ACCOUNT.SERVICETIER                 AS SERVICETIER,
              BC_ACCOUNT.SECURITYZONEID              AS SECURITYZONEID,
              BC_ACCOUNT.SEGMENT                     AS SEGMENT,
              BC_ACCOUNT.CLOSEDATE                   AS CLOSEDATE,
              BC_ACCOUNT.CREATETIME                  AS CREATETIME,
              BC_ACCOUNT.DELINQUENCYSTATUS           AS DELINQUENCYSTATUS,
              BC_ACCOUNT.FIRSTTWICEPERMTHINVOICEDOM  AS FIRSTTWICEPERMTHINVOICEDOM,
              BC_ACCOUNT.SECONDTWICEPERMTHINVOICEDOM AS SECONDTWICEPERMTHINVOICEDOM,
              BC_ACCOUNT.PUBLICID                    AS PUBLICID,
              BC_ACCOUNT.ID                          AS ID,
              BC_ACCOUNT.BEANVERSION                 AS BEANVERSION,
              BC_ACCOUNT.RETIRED                     AS RETIRED,
              BC_ACCOUNT.UPDATETIME                  AS UPDATETIME,
              BCTL_ACCOUNTTYPE.NAME                  AS ACCOUNTTYPENAME,
              BC_PARENTACCT.FOREIGNENTITYID          AS PARENTACCOUNTID,
              BCTL_BILLINGLEVEL.NAME                 AS BILLINGLEVELNAME,
              BCTL_CUSTOMERSERVICETIER.NAME          AS SERVICETIER_NAME,
              BC_SECURITYZONE.NAME                   AS SECURITYZONENAME,
              BCTL_DELINQUENCYSTATUS.NAME            AS DELINQUENCYSTATUSNAME,
              BCTL_ACCOUNTSEGMENT.NAME               AS SEGMENTNAME,
              BC_CONTACT.FIRSTNAME                   AS FIRSTNAME,
              BC_CONTACT.LASTNAME                    AS LASTNAME,
              BC_ADDRESS.ADDRESSLINE1                AS ADDRESSLINE1,
              BC_ADDRESS.ADDRESSLINE2                AS ADDRESSLINE2,
              BC_ADDRESS.ADDRESSLINE3                AS ADDRESSLINE3,
              BC_ADDRESS.CITY                        AS CITY,
              BC_ADDRESS.POSTALCODE                  AS POSTALCODE,
              BCTL_STATE.NAME                        AS STATENAME
            FROM {{ ref('SRC', 'BC_ACCOUNT') }}
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }}        ON BC_ACCOUNT.ACCOUNTTYPE      = BCTL_ACCOUNTTYPE.ID
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }}           ON BC_PARENTACCT.OWNERID        = BC_ACCOUNT.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }}       ON BC_ACCOUNT.BILLINGLEVEL      = BCTL_BILLINGLEVEL.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} ON BC_ACCOUNT.SERVICETIER      = BCTL_CUSTOMERSERVICETIER.ID
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }}         ON BC_ACCOUNT.SECURITYZONEID    = BC_SECURITYZONE.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }}  ON BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }}     ON BC_ACCOUNT.SEGMENT           = BCTL_ACCOUNTSEGMENT.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACT') }}       ON BC_ACCOUNTCONTACT.INSUREDACCOUNTID = BC_ACCOUNT.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }}   ON BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }}        ON BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
            LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }}              ON BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
            LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }}              ON BC_ADDRESS.ID  = BC_CONTACT.PRIMARYADDRESSID
            LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }}              ON BCTL_STATE.ID  = BC_ADDRESS.STATE

    sourceMapping:
      - aliases:
          BC_ACCOUNT: S1
          BCTL_ACCOUNTTYPE: S9
          BC_PARENTACCT: S2
          BCTL_BILLINGLEVEL: S10
          BCTL_CUSTOMERSERVICETIER: S11
          BC_SECURITYZONE: S12

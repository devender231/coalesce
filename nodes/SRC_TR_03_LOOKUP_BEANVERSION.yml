fileVersion: 1
id: "SRC_TR_03_LOOKUP_BEANVERSION"
name: "SRC_TR_03_LOOKUP_BEANVERSION"
description: "Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID"
type: "Transformation"
transformationType: "LOOKUP"
executionOrder: 3
config:
  database: "${database}"
  schema: "${schema}"
  tags:
    - "SSIS_MIGRATION"
    - "LOOKUP"
    - "DIMBILLINGACCOUNT"
    - "BEANVERSION"
sources:
  - name: "SRC_TR_02_DERIVED_BATCHID"
    type: "transformation"
  - name: "DIMBILLINGACCOUNT"
    type: "source"
transformationLogic: |
  -- Lookup Transformation: Get BeanVersion from DIMBILLINGACCOUNT
  -- Original SSIS Logic: SQL: Select Publicid, BeanVersion from DimBillingAccount
  -- Join: PUBLICID = DIMBILLINGACCOUNT.PUBLICID
  SELECT
    src.*,
    dim.BEANVERSION AS EDW_BEANVERSION
  FROM {{ ref('SRC_TR_02_DERIVED_BATCHID') }} src
  LEFT JOIN (
    SELECT
      PUBLICID,
      BEANVERSION
    FROM DIMBILLINGACCOUNT
  ) dim
    ON src.PUBLICID = dim.PUBLICID
lookupConfig:
  lookupTable: "DIMBILLINGACCOUNT"
  lookupColumns:
    - "PUBLICID"
    - "BEANVERSION"
  joinCondition: "src.PUBLICID = dim.PUBLICID"
  joinType: "LEFT"
  cacheMode: "FULL"
lookupColumns:
  - name: "EDW_BEANVERSION"
    dataType: "STRING"
    source: "DIMBILLINGACCOUNT.BEANVERSION"
    description: "BeanVersion from existing DimBillingAccount table"
columns:
  - name: "*"
    description: "All columns from previous transformation"
  - name: "EDW_BEANVERSION"
    dataType: "STRING"
    description: "Looked up BeanVersion from DIMBILLINGACCOUNT"
dependencies:
  - "SRC_TR_02_DERIVED_BATCHID"
  - "DIMBILLINGACCOUNT"
metadata:
  ssis_component: "Lookup"
  ssis_sql: "Select Publicid, BeanVersion from DimBillingAccount"
  ssis_join: "PUBLICID = DIMBILLINGACCOUNT.PUBLICID"
  execution_sequence: 3
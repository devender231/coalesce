name: SRC_ROWCOUNT_UNCHANGED
type: transformation
transformation_type: ROW_COUNT
description: Counts unchanged rows where BeanVersion matches EDWBeanVersion
execution_order: 5

source:
  upstream_component: SRC_CONDITIONAL_SPLIT_SCD
  output_path: UNCHANGED_RECORDS
  description: Receives records where BeanVersion matches EDWBeanVersion

logic:
  operation: COUNT
  variable_name: User::UnChangeCount
  count_type: ALL_ROWS
  description: Captures count of records that require no changes

output:
  variable: User::UnChangeCount
  data_type: INTEGER
  description: Total count of unchanged records
  action: SKIP_LOAD
  reason: Records are already current in EDW

validation:
  - rule: COUNT_NON_NEGATIVE
    condition: User::UnChangeCount >= 0
    error_message: Unchanged count cannot be negative

dependencies:
  - SRC_CONDITIONAL_SPLIT_SCD
  - Variable: User::UnChangeCount

next_component: AUDIT_LOG
name: SRC_ROWCOUNT_UNCHANGED
type: transformation
transformation_type: ROW_COUNT
description: Counts unchanged rows (BeanVersion matches)
execution_order: 6

source:
  - SRC_CONDITIONAL_SPLIT_BEANVERSION
  source_output: UNCHANGED_ROWS

transformation_logic:
  operation: COUNT_ROWS
  output_variable: User::UnChangeCount
  description: Counts rows where BeanVersion matches existing dimension (no update needed)

output:
  columns:
    - name: ROW_COUNT
      dataType: INTEGER
      description: Count of unchanged rows
  variable_assignment:
    variable_name: User::UnChangeCount
    variable_type: INTEGER
    description: Stores the count of unchanged rows for audit purposes
  action: DISCARD
  description: These rows are not loaded to target as they are unchanged
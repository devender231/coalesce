name: SRC_ROWCOUNT_UNCHANGED
type: row_count
description: Counts unchanged rows where BeanVersion matches EDWBeanVersion

source:
  name: UNCHANGED_ROWS
  type: conditional_split_output
  upstream_dependency: SRC_CONDITIONALSPLIT_BEANVERSION
  split_output_path: UNCHANGED_ROWS

transformation_logic:
  operation: COUNT
  count_type: UNCHANGED_ROWS
  description: Counts rows where BeanVersion matches existing EDW BeanVersion (no changes)
  filter_condition: BeanVersion == EDWBeanVersion
  
output:
  variable_name: User::UnChangeCount
  variable_type: INTEGER
  description: Total count of unchanged rows (no update needed)
  

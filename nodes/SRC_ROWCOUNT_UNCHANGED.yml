name: SRC_ROWCOUNT_UNCHANGED
type: transformation
config:
  transformation_type: ROW_COUNT
  description: "Counts unchanged rows (BeanVersion matches)"
  input_source: SRC_CONDITIONALSPLIT_BEANVERSION
  input_branch: UNCHANGED_ROWS
  logic:
    operation: COUNT
    variable_name: "User::UnChangeCount"
    count_type: "UNCHANGED_ROWS"
    description: "Tracks number of records that don't need updates"
  execution_order: 5
  output:
    pass_through: true
    add_columns:
      - name: UNCHANGED_ROW_COUNT
        dataType: INTEGER
        expression: "COUNT(*)"

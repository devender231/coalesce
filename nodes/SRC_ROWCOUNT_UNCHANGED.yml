name: SRC_ROWCOUNT_UNCHANGED
type: source
config:
  source_type: transformation
  transformation_type: ROW_COUNT
  description: "Counts unchanged rows (BeanVersion matches)"
  execution_order: 5
  depends_on:
    - SRC_CONDITIONALSPLIT_BEANVERSION
transformation_logic:
  operation: COUNT_ROWS
  input_stream: UNCHANGED_ROWS
  variable_assignment:
    variable_name: "User::UnChangeCount"
    variable_type: INTEGER
    description: "Count of rows with matching BeanVersion (no changes)"
input_source:
  - SRC_CONDITIONALSPLIT_BEANVERSION.UNCHANGED_ROWS
output:
  pass_through: true
  add_columns:
    - name: UNCHANGED_ROW_COUNT
      data_type: INTEGER
      expression: "COUNT(*)"
      nullable: false
name: SRC_DERIVED_BATCHID
type: transformation
config:
  transformation_type: DERIVED_COLUMN
  description: "Adds or overwrites BatchID column"
  input_source: SRC_ROWCOUNT_SOURCE
  logic:
    derived_columns:
      - column_name: BatchID
        expression: "@[User::BatchID]"
        data_type: INTEGER
        operation: ADD_OR_REPLACE
        description: "Batch identifier for tracking ETL runs"
  execution_order: 2
  output:
    pass_through: true
    columns:
      - "All input columns"
      - "BatchID (new/replaced)"

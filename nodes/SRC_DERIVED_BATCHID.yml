# Derived Column Transformation - BatchID
# Package: EDW_BC_Load_DimBillingAccount
# Description: Adds or overwrites BatchID column

name: SRC_DERIVED_BATCHID
type: TRANSFORMATION
transformation_type: DERIVED_COLUMN
version: 1.0

source:
  name: SOURCE_COUNTED
  description: Dataset after source row count
  upstream_dependency: SRC_ROWCOUNT_SOURCE

transformation_logic:
  operation: ADD_COLUMN
  derived_columns:
    - column_name: BatchID
      expression: "@[User::BatchID]"
      data_type: INTEGER
      nullable: false
      description: Unique batch identifier for ETL run tracking
      operation_type: ADD_OR_OVERWRITE

output:
  name: DATASET_WITH_BATCHID
  description: Dataset with BatchID column added
  columns_added:
    - BatchID

execution_order: 2

metadata:
  created_from: SSIS_Documentation/EDW_BC_Load_DimBillingAccount.json
  transformation_sequence: 2
  purpose: Add batch tracking identifier
  next_transformation: SRC_LOOKUP_BEANVERSION
name: SRC_DERIVED_BATCHID
type: transformation
transformation_type: DERIVED_COLUMN
description: Adds or overwrites BatchID column with current batch identifier
execution_order: 2

source:
  upstream_component: SRC_ROWCOUNT_SOURCE
  description: Receives counted source rows

logic:
  operation: ADD_OR_REPLACE_COLUMN
  derived_columns:
    - column_name: BatchID
      expression: '@[User::BatchID]'
      data_type: INTEGER
      description: Current batch execution identifier
      action: ADD_OR_REPLACE

output:
  columns:
    - All columns from upstream source
    - BatchID (newly added or replaced)
  description: Original dataset with BatchID column added

validation:
  - rule: BATCHID_NOT_NULL
    condition: BatchID IS NOT NULL
    error_message: BatchID cannot be null
  - rule: BATCHID_POSITIVE
    condition: BatchID > 0
    error_message: BatchID must be a positive integer

dependencies:
  - SRC_ROWCOUNT_SOURCE
  - Variable: User::BatchID

next_component: SRC_ALL_JOINS_DIMBILLINGACCOUNT
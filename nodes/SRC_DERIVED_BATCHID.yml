name: SRC_DERIVED_BATCHID
type: transformation
config:
  transformation_type: derived_column
  description: "Adds or overwrites BatchID column"
  execution_order: 2
dependencies:
  - SRC_ROWCOUNT_SOURCE
logic:
  operation: add_column
  derived_columns:
    - column_name: BatchID
      expression: "@[User::BatchID]"
      data_type: INTEGER
      description: "Batch identifier from SSIS variable"
      overwrite_existing: true
output:
  columns:
    - all_input_columns
    - BatchID
  description: "All input columns plus BatchID column"
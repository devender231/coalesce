name: SRC_DERIVED_BATCHID
type: transformation
transformation_type: DERIVED_COLUMN
description: Adds or overwrites BatchID column
execution_order: 3

source:
  - SRC_ROWCOUNT_SOURCE

transformation_logic:
  derived_columns:
    - column_name: BatchID
      expression: "@[User::BatchID]"
      dataType: INTEGER
      operation: ADD_OR_REPLACE
      description: Assigns the current batch ID from the package variable

output:
  description: Source data with BatchID column added
  includes_all_source_columns: true
  additional_columns:
    - name: BatchID
      dataType: INTEGER
      source: VARIABLE
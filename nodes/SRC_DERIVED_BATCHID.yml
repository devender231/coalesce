name: SRC_DERIVED_BATCHID
type: source
config:
  source_type: transformation
  transformation_type: DERIVED
  description: "Adds or overwrites BatchID column"
  execution_order: 2
  depends_on:
    - SRC_ROWCOUNT_SOURCE
transformation_logic:
  operation: ADD_DERIVED_COLUMN
  derived_columns:
    - column_name: BATCHID
      data_type: INTEGER
      expression: "@[User::BatchID]"
      description: "Batch identifier from user variable"
      nullable: false
      overwrite_if_exists: true
input_source:
  - SRC_ROWCOUNT_SOURCE
output:
  pass_through: true
  add_columns:
    - name: BATCHID
      data_type: INTEGER
      expression: "@[User::BatchID]"
      nullable: false
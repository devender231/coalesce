fileVersion: 1.0
name: SRC_TR_ROW_COUNT_SOURCE
type: RowCount
description: Counts source rows from OLE_SRC - GuideWire before any transformations

config:
  clusterKey: false
  downstreamOption: true
  groupByAll: false
  initialize: ON_CREATE
  insertStrategy: UNION
  orderby: false
  postSQL: ''
  preSQL: ''
  testsEnabled: true
  truncateBefore: true
  warehouseName: DEV_WH

transformation:
  type: ROW_COUNT
  logic: |
    -- Count all rows from the joined source tables
    SELECT COUNT(*) AS SourceCount
    FROM {{ ref('SRC_JOIN_DIMBILLINGACCOUNT') }}
  
  variableMapping:
    targetVariable: User::SourceCount
    description: Stores the total count of source rows for audit purposes


name: SRC_TR_ROW_COUNT_SOURCE
type: transformation
transformation_type: ROW_COUNT
description: Counts source rows from OLE_SRC - GuideWire
execution_order: 1

input:
  source: SRC_JOINS_DIMBILLINGACCOUNT
  description: Joined dataset from all source tables

transformation_logic:
  operation: COUNT_ROWS
  output_variable: User::SourceCount
  description: Counts total number of rows from the joined source dataset

output:
  name: SOURCE_COUNTED
  pass_through: true
  metadata:
    row_count_variable: User::SourceCount

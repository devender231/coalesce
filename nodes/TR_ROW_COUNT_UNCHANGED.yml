name: TR_ROW_COUNT_UNCHANGED
type: row_count
description: Counts the number of unchanged records from conditional split
source: TR_CONDITIONAL_SPLIT_SCD.UNCHANGED
transformation_logic: |
  Count all rows that have no changes (UNCHANGED output)
  Store count in variable for logging and monitoring
  These records will not be processed further

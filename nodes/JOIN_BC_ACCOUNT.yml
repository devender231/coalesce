    cteString: ""
    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          BC_ACCOUNT: BA
          BC_PARENTACCT: PACCT
          BC_ACCOUNTCONTACT: ACC
          BC_ACCOUNTCONTACTROLE: ACR
          BCTL_ACCOUNTROLE: TLAR
          BC_CONTACT: CON
          BC_ADDRESS: ADDR
          BCTL_STATE: TLS
          BCTL_ACCOUNTTYPE: ATY
          BCTL_BILLINGLEVEL: BL
          BCTL_CUSTOMERSERVICETIER: CST
          BC_SECURITYZONE: BCSZ
          BCTL_DELINQUENCYSTATUS: TLDS
          BCTL_ACCOUNTSEGMENT: ACSG
        customSQL:
          customSQL: |
            SELECT DISTINCT
              BA.ACCOUNTNUMBER,
              BA.ACCOUNTNAME,
              ATY.NAME                           AS ACCOUNTTYPENAME,
              PACCT.FOREIGNENTITYID              AS PARENTACCOUNTNUMBER,
              BL.NAME                            AS BILLINGLEVELNAME,
              ACSG.NAME                          AS SEGMENT,
              CST.NAME                           AS SERVICETIERNAME,
              BCSZ.NAME                            AS SECURITYZONE,
              CON.FIRSTNAME,
              CON.LASTNAME,
              ADDR.ADDRESSLINE1,
              ADDR.ADDRESSLINE2,
              ADDR.ADDRESSLINE3,
              ADDR.CITY,
              TLS.NAME                           AS STATE,
              ADDR.POSTALCODE,
              BA.CLOSEDATE                       AS ACCOUNTCLOSEDATE,
              BA.CREATETIME                      AS ACCOUNTCREATIONDATE,
              TLDS.NAME                          AS DELIQUENCYSTATUSNAME,
              BA.FIRSTTWICEPERMTHINVOICEDOM,
              BA.SECONDTWICEPERMTHINVOICEDOM,
              BA.PUBLICID,
              BA.ID                              AS GWROWNUMBER,
              BA.BEANVERSION,
              BA.RETIRED                         AS ISACTIVE,
              'WC'                               AS LEGACYSOURCESYSTEM,
              BA.UPDATETIME                      AS BA_UPDATETIME,
              PACCT.UPDATETIME                   AS PACCT_UPDATETIME,
              BCSZ.UPDATETIME                    AS SZ_UPDATETIME,
              ACC.UPDATETIME                     AS AC_UPDATETIME,
              ACR.UPDATETIME                     AS ACR_UPDATETIME,
              CON.UPDATETIME                     AS C_UPDATETIME,
              ADDR.UPDATETIME                    AS A_UPDATETIME
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} BA
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} ATY
              ON ATY.ID = BA.ACCOUNTTYPE
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} PACCT
              ON PACCT.OWNERID = BA.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} BL
              ON BL.ID = BA.BILLINGLEVEL
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} CST
              ON CST.ID = BA.SERVICETIER
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} BCSZ
              ON BCSZ.ID = BA.SECURITYZONEID
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} TLDS
              ON TLDS.ID = BA.DELINQUENCYSTATUS
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} ACSG
              ON ACSG.ID = BA.SEGMENT
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} ACC
              ON ACC.INSUREDACCOUNTID = BA.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} ACR
              ON ACR.ACCOUNTCONTACTID = ACC.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} TLAR
              ON TLAR.ID = ACR.ROLE
            LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} CON
              ON CON.ID = ACC.CONTACTID
            LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} ADDR
              ON ADDR.ID = CON.PRIMARYADDRESSID
            LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} TLS
              ON TLS.ID = ADDR.STATE
            WHERE TLAR.TYPECODE = 'insured' OR TLAR.TYPECODE IS NULL
        dependencies:
          - locationName: SRC
            nodeName: BC_ACCOUNT
          - locationName: SRC
            nodeName: BCTL_ACCOUNTTYPE
          - locationName: SRC
            nodeName: BC_PARENTACCT

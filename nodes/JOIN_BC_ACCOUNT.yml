    cteString: ""
    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          BC_ACCOUNT: BA
          BC_PARENTACCT: PACCT
          BC_ACCOUNTCONTACT: ACC
          BC_ACCOUNTCONTACTROLE: ACR
          BCTL_ACCOUNTROLE: TLAR
          BC_CONTACT: CON
          BC_ADDRESS: ADDR
          BCTL_STATE: TLS
          BCTL_ACCOUNTTYPE: ATY
          BCTL_BILLINGLEVEL: BL
          BCTL_CUSTOMERSERVICETIER: CST
          BC_SECURITYZONE: BCSZ
          BCTL_DELINQUENCYSTATUS: TLDS
          BCTL_ACCOUNTSEGMENT: ACSG
        customSQL:
          customSQL: |
            SELECT DISTINCT
              BA.ACCOUNTNUMBER                                                                   AS ACCOUNTNUMBER,
              BA.ACCOUNTNAME                                                                     AS ACCOUNTNAME,
              CAST(ATY.NAME AS VARCHAR(50))                                                      AS ACCOUNTTYPENAME,
              CAST(BA2.ACCOUNTNUMBER AS INTEGER)                                                 AS PARENTACCOUNTNUMBER,
              CAST(BL.NAME AS VARCHAR(100))                                                      AS BILLINGLEVELNAME,
              CAST(ACSG.NAME AS VARCHAR(50))                                                     AS SEGMENT,
              CAST(CST.NAME AS VARCHAR(50))                                                      AS SERVICETIERNAME,
              BCSZ.NAME                                                                          AS SECURITYZONE,
              CON.FIRSTNAME                                                                      AS FIRSTNAME,
              CON.LASTNAME                                                                       AS LASTNAME,
              ADDR.ADDRESSLINE1                                                                  AS ADDRESSLINE1,
              ADDR.ADDRESSLINE2                                                                  AS ADDRESSLINE2,
              ADDR.ADDRESSLINE3                                                                  AS ADDRESSLINE3,
              CAST(ADDR.CITY AS VARCHAR(50))                                                     AS CITY,
              CAST(TLS.NAME AS VARCHAR(50))                                                      AS STATE,
              CAST(ADDR.POSTALCODE AS VARCHAR(50))                                               AS POSTALCODE,
              BA.CLOSEDATE                                                                       AS ACCOUNTCLOSEDATE,
              BA.CREATETIME                                                                      AS ACCOUNTCREATIONDATE,
              CAST(TLDS.NAME AS VARCHAR(50))                                                     AS DELIQUENCYSTATUSNAME,
              BA.FIRSTTWICEPERMTHINVOICEDOM                                                      AS FIRSTTWICEPERMTHINVOICEDOM,
              BA.SECONDTWICEPERMTHINVOICEDOM                                                     AS SECONDTWICEPERMTHINVOICEDOM,
              BA.PUBLICID                                                                        AS PUBLICID,
              BA.ID                                                                              AS GWROWNUMBER,
              CAST(CONCAT(BA.BEANVERSION, PACCT.BEANVERSION, BCSZ.BEANVERSION) AS VARCHAR(20))  AS BEANVERSION,
              CASE BA.RETIRED WHEN 0 THEN 1 ELSE 0 END                                          AS ISACTIVE,
              'WC'                                                                               AS LEGACYSOURCESYSTEM,
              BA.UPDATETIME                                                                      AS BA_UPDATETIME,
              PACCT.UPDATETIME                                                                   AS PACCT_UPDATETIME,
              BCSZ.UPDATETIME                                                                    AS SZ_UPDATETIME,
              ACC.UPDATETIME                                                                     AS AC_UPDATETIME,
              ACR.UPDATETIME                                                                     AS ACR_UPDATETIME,
              CON.UPDATETIME                                                                     AS C_UPDATETIME,
              ADDR.UPDATETIME                                                                    AS A_UPDATETIME
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} BA
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} ATY
              ON ATY.ID = BA.ACCOUNTTYPE
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} PACCT
              ON PACCT.OWNERID = BA.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNT') }} BA2
              ON BA2.ID = PACCT.FOREIGNENTITYID
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} BL
              ON BL.ID = BA.BILLINGLEVEL
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} CST
              ON CST.ID = BA.SERVICETIER
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} BCSZ
              ON BCSZ.ID = BA.SECURITYZONEID
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} TLDS
              ON TLDS.ID = BA.DELINQUENCYSTATUS
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} ACSG
              ON ACSG.ID = BA.SEGMENT
            JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} ACC
              ON ACC.INSUREDACCOUNTID = BA.ID
            JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} ACR
              ON ACR.ACCOUNTCONTACTID = ACC.ID
            JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} TLAR
              ON TLAR.ID = ACR.ROLE
            LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} CON
              ON CON.ID = ACC.CONTACTID
            LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} ADDR
              ON ADDR.ID = CON.PRIMARYADDRESSID
            LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} TLS
              ON TLS.ID = ADDR.STATE
            WHERE TLAR.TYPECODE = 'insured'
        dependencies:
          - locationName: SRC
            nodeName: BC_ACCOUNT
          - locationName: SRC

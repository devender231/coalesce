          - locationName: SRC
            nodeName: BCTL_ACCOUNTSEGMENT
        join:
          joinCondition: |
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} BA
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} PA ON PA.OWNERID = BA.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNT') }} PACT ON PACT.ID = PA.FOREIGNENTITYID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} ATY ON ATY.ID = BA.ACCOUNTTYPE
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} BL ON BL.ID = BA.BILLINGLEVEL
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} CST ON CST.ID = BA.SERVICETIER
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} SZ ON SZ.ID = BA.SECURITYZONEID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} ACC ON ACC.INSUREDACCOUNTID = BA.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} ACR ON ACR.ACCOUNTCONTACTID = ACC.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} TLAR ON TLAR.ID = ACR.ROLE
            LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} CON ON CON.ID = ACC.CONTACTID
            LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} ADDR ON ADDR.ID = CON.PRIMARYADDRESSID
            LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} TLS ON TLS.ID = ADDR.STATE
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} TLDS ON TLDS.ID = BA.DELINQUENCYSTATUS
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} ACSG ON ACSG.ID = BA.SEGMENT
            WHERE TLAR.TYPECODE = 'insured'

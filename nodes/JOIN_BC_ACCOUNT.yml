    sourceMapping:
      - aliases:
          BC_ACCOUNT: BA
          BC_PARENTACCT: PA
          BCTL_ACCOUNTTYPE: ATY
          BCTL_BILLINGLEVEL: BL
          BCTL_CUSTOMERSERVICETIER: CST
          BC_SECURITYZONE: SZ
          BC_ACCOUNTCONTACT: ACC
          BC_ACCOUNTCONTACTROLE: ACR
          BCTL_ACCOUNTROLE: TLAR
          BC_CONTACT: CON
          BC_ADDRESS: ADDR
          BCTL_STATE: TLS
          BCTL_DELINQUENCYSTATUS: TLDS
          BCTL_ACCOUNTSEGMENT: ACSG
        customSQL:
          customSQL: |
            SELECT DISTINCT
              BA.ACCOUNTNUMBER,
              BA.ACCOUNTNAME,
              CAST(ATY.NAME AS VARCHAR(100)) AS ACCOUNTTYPENAME,
              CAST(PACT.ACCOUNTNUMBER AS INT) AS PARENTACCOUNTNUMBER,
              CAST(BL.NAME AS VARCHAR(100)) AS BILLINGLEVELNAME,
              CAST(ACSG.NAME AS VARCHAR(100)) AS SEGMENT,
              CAST(CST.NAME AS VARCHAR(100)) AS SERVICETIERNAME,
              SZ.NAME AS SECURITYZONE,
              CON.FIRSTNAME,
              CON.LASTNAME,
              ADDR.ADDRESSLINE1,
              ADDR.ADDRESSLINE2,
              ADDR.ADDRESSLINE3,
              CAST(ADDR.CITY AS VARCHAR(100)) AS CITY,
              CAST(TLS.NAME AS VARCHAR(100)) AS STATE,
              CAST(ADDR.POSTALCODE AS VARCHAR(50)) AS POSTALCODE,
              BA.CLOSEDATE AS ACCOUNTCLOSEDATE,
              BA.CREATETIME AS ACCOUNTCREATIONDATE,
              CAST(TLDS.NAME AS VARCHAR(100)) AS DELIQUENCYSTATUSNAME,
              BA.FIRSTTWICEPERMTHINVOICEDOM AS FIRSTTWICEPERMONTH INVOICEDAYOFMONTH,
              BA.SECONDTWICEPERMTHINVOICEDOM AS SECONDTWICEPERMONTH INVOICEDAYOFMONTH,
              BA.PUBLICID,
              BA.ID AS GWROWNUMBER,
              CAST(CONCAT(BA.BEANVERSION, PA.BEANVERSION, SZ.BEANVERSION) AS VARCHAR(20)) AS BEANVERSION,
              CASE BA.RETIRED WHEN 0 THEN 1 ELSE 0 END AS ISACTIVE,
              'WC' AS LEGACYSOURCESYSTEM
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} BA
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} PA ON PA.OWNERID = BA.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNT') }} PACT ON PACT.ID = PA.FOREIGNENTITYID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} ATY ON ATY.ID = BA.ACCOUNTTYPE
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} BL ON BL.ID = BA.BILLINGLEVEL
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} CST ON CST.ID = BA.SERVICETIER
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} SZ ON SZ.ID = BA.SECURITYZONEID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} ACC ON ACC.INSUREDACCOUNTID = BA.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} ACR ON ACR.ACCOUNTCONTACTID = ACC.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} TLAR ON TLAR.ID = ACR.ROLE
            LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} CON ON CON.ID = ACC.CONTACTID
            LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} ADDR ON ADDR.ID = CON.PRIMARYADDRESSID
            LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} TLS ON TLS.ID = ADDR.STATE
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} TLDS ON TLDS.ID = BA.DELINQUENCYSTATUS
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} ACSG ON ACSG.ID = BA.SEGMENT
            WHERE TLAR.TYPECODE = 'insured'
        dependencies:
          - locationName: SRC

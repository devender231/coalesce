fileVersion: 1
id: "SRC_TR_04_CONDITIONAL_SPLIT"
name: "SRC_TR_04_CONDITIONAL_SPLIT"
description: "Routes rows based on whether BeanVersion matches EDWBeanVersion"
type: "Transformation"
transformationType: "CONDITIONAL_SPLIT"
executionOrder: 4
config:
  database: "${database}"
  schema: "${schema}"
  tags:
    - "SSIS_MIGRATION"
    - "CONDITIONAL_SPLIT"
    - "DIMBILLINGACCOUNT"
sources:
  - name: "SRC_TR_03_LOOKUP_BEANVERSION"
    type: "transformation"
transformationLogic: |
  SELECT
    *,
    CASE
      WHEN BEANVERSION = EDW_BEANVERSION THEN 'UNCHANGED'
      WHEN EDW_BEANVERSION IS NULL THEN 'INSERT'
      WHEN BEANVERSION != EDW_BEANVERSION THEN 'UPDATE'
      ELSE 'DEFAULT'
    END AS SPLIT_CONDITION
  FROM {{ ref('SRC_TR_03_LOOKUP_BEANVERSION') }}
conditions:
  - name: "UNCHANGED"
    expression: "BEANVERSION = EDW_BEANVERSION"
  - name: "INSERT"
    expression: "EDW_BEANVERSION IS NULL"
  - name: "UPDATE"
    expression: "BEANVERSION != EDW_BEANVERSION"
dependencies:
  - "SRC_TR_03_LOOKUP_BEANVERSION"
metadata:
  ssis_component: "Conditional Split"
  execution_sequence: 4
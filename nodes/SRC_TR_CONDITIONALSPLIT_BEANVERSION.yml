name: SRC_TR_CONDITIONALSPLIT_BEANVERSION
type: transformation
transformation_type: CONDITIONAL_SPLIT
execution_sequence: 4
description: Routes rows based on whether BeanVersion matches EDWBeanVersion

input:
  source: SRC_TR_LOOKUP_BEANVERSION
  description: Takes output from lookup transformation

split_conditions:
  - condition_name: UNCHANGED_ROWS
    expression: "BeanVersion == EDWBeanVersion"
    description: Rows where BeanVersion matches existing record (no changes)
    output_path: UNCHANGED_OUTPUT
    
  - condition_name: UPDATE_ROWS
    expression: "BeanVersion != EDWBeanVersion AND EDWBeanVersion IS NOT NULL"
    description: Rows where BeanVersion differs from existing record (updates)
    output_path: UPDATE_OUTPUT
    
  - condition_name: INSERT_ROWS
    expression: "EDWBeanVersion IS NULL"
    description: Rows with no match in lookup (new inserts)
    output_path: INSERT_OUTPUT

outputs:
  - name: UNCHANGED_OUTPUT
    description: Rows with matching BeanVersion
    
  - name: UPDATE_OUTPUT
    description: Rows requiring update
    
  - name: INSERT_OUTPUT
    description: New rows requiring insert
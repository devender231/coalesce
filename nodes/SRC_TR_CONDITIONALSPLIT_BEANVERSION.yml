name: SRC_TR_CONDITIONALSPLIT_BEANVERSION
type: transformation
config:
  transformation_type: CONDITIONAL_SPLIT
  description: "Routes rows based on whether BeanVersion matches EDWBeanVersion"
  execution_order: 4
  logic:
    operation: SPLIT_ROWS
    conditions:
      - condition_name: UNCHANGED_ROWS
        expression: "BEANVERSION == EDWBeanVersion"
        output_name: UNCHANGED_OUTPUT
        priority: 1
        description: "Rows where BeanVersion matches - no update needed"
        
      - condition_name: UPDATE_ROWS
        expression: "BEANVERSION != EDWBeanVersion AND EDWBeanVersion IS NOT NULL"
        output_name: UPDATE_OUTPUT
        priority: 2
        description: "Rows where BeanVersion differs - needs update"
        
      - condition_name: INSERT_ROWS
        expression: "EDWBeanVersion IS NULL"
        output_name: INSERT_OUTPUT
        priority: 3
        description: "Rows with no lookup match - new inserts"
        
    default_output: ERROR_OUTPUT
    
  input:
    source: SRC_TR_LOOKUP_BEANVERSION
    
  outputs:
    - name: UNCHANGED_OUTPUT
      route_to: SRC_TR_ROWCOUNT_UNCHANGED
    - name: UPDATE_OUTPUT
      route_to: SRC_TR_ROWCOUNT_UPDATE
    - name: INSERT_OUTPUT
      route_to: SRC_TR_ROWCOUNT_INSERT
    - name: ERROR_OUTPUT
      route_to: ERROR_HANDLER
    
dependencies:
  - SRC_TR_LOOKUP_BEANVERSION
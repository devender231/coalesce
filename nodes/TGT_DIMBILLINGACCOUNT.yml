fileVersion: 1
id: TGT_DIMBILLINGACCOUNT_001
name: TGT_DIMBILLINGACCOUNT
description: |
  Target dimension table for Billing Account data.
  Loads and updates Snowflake table DIMBILLINGACCOUNT from GuideWire and related source tables with SCD Type 1 logic.
  Sources include 15 tables: BC_ACCOUNT (main), BC_PARENTACCT, BC_ACCOUNTCONTACT, BC_ACCOUNTCONTACTROLE, 
  BCTL_ACCOUNTROLE, BC_CONTACT, BC_ADDRESS, BCTL_STATE, BCTL_ACCOUNTTYPE, BCTL_BILLINGLEVEL, 
  BCTL_CUSTOMERSERVICETIER, BC_SECURITYZONE, BCTL_DELINQUENCYSTATUS, BCTL_ACCOUNTSEGMENT, and DIMBILLINGACCOUNT (for lookup).
  Package: EDW_BC_Load_DimBillingAccount

type: Dimension
subType: SCD Type 1

metadata:
  packageName: EDW_BC_Load_DimBillingAccount
  sourceSystem: GuideWire
  loadType: INSERT/UPDATE
  scdType: Type 1
  targetDatabase: SNOWFLAKE
  targetSchema: EDW
  targetTable: DIMBILLINGACCOUNT

location:
  locationName: TARGET
  database: SNOWFLAKE_DB
  schema: EDW

sources:
  - name: BC_ACCOUNT
    type: source
    schema: SRC
    table: BC_ACCOUNT
    alias: ACC
    joinType: MAIN
    
  - name: BC_PARENTACCT
    type: source
    schema: SRC
    table: BC_PARENTACCT
    alias: PACC
    joinType: LEFT
    joinCondition: ACC.PARENTACCT_ID = PACC.ID
    
  - name: BC_ACCOUNTCONTACT
    type: source
    schema: SRC
    table: BC_ACCOUNTCONTACT
    alias: ACCTCON
    joinType: LEFT
    joinCondition: ACC.ID = ACCTCON.ACCOUNT_ID
    
  - name: BC_ACCOUNTCONTACTROLE
    type: source
    schema: SRC
    table: BC_ACCOUNTCONTACTROLE
    alias: ACCTCONROLE
    joinType: LEFT
    joinCondition: ACCTCON.ID = ACCTCONROLE.ACCOUNTCONTACT_ID
    
  - name: BCTL_ACCOUNTROLE
    type: source
    schema: SRC
    table: BCTL_ACCOUNTROLE
    alias: ACCTROLE
    joinType: LEFT
    joinCondition: ACCTCONROLE.ACCOUNTROLE_ID = ACCTROLE.ID
    
  - name: BC_CONTACT
    type: source
    schema: SRC
    table: BC_CONTACT
    alias: CON
    joinType: LEFT
    joinCondition: ACCTCON.CONTACT_ID = CON.ID
    
  - name: BC_ADDRESS
    type: source
    schema: SRC
    table: BC_ADDRESS
    alias: ADDR
    joinType: LEFT
    joinCondition: ACC.BILLINGADDRESS_ID = ADDR.ID
    
  - name: BCTL_STATE
    type: source
    schema: SRC
    table: BCTL_STATE
    alias: ST
    joinType: LEFT
    joinCondition: ADDR.STATE_ID = ST.ID
    
  - name: BCTL_ACCOUNTTYPE
    type: source
    schema: SRC
    table: BCTL_ACCOUNTTYPE
    alias: ACCTYPE
    joinType: LEFT
    joinCondition: ACC.ACCOUNTTYPE_ID = ACCTYPE.ID
    
  - name: BCTL_BILLINGLEVEL
    type: source
    schema: SRC
    table: BCTL_BILLINGLEVEL
    alias: BLVL
    joinType: LEFT
    joinCondition: ACC.BILLINGLEVEL_ID = BLVL.ID
    
  - name: BCTL_CUSTOMERSERVICETIER
    type: source
    schema: SRC
    table: BCTL_CUSTOMERSERVICETIER
    alias: CST
    joinType: LEFT
    joinCondition: ACC.CUSTOMERSERVICETIER_ID = CST.ID
    
  - name: BC_SECURITYZONE
    type: source
    schema: SRC
    table: BC_SECURITYZONE
    alias: SECZONE
    joinType: LEFT
    joinCondition: ACC.SECURITYZONE_ID = SECZONE.ID
    
  - name: BCTL_DELINQUENCYSTATUS
    type: source
    schema: SRC
    table: BCTL_DELINQUENCYSTATUS
    alias: DELSTAT
    joinType: LEFT
    joinCondition: ACC.DELINQUENCYSTATUS_ID = DELSTAT.ID
    
  - name: BCTL_ACCOUNTSEGMENT
    type: source
    schema: SRC
    table: BCTL_ACCOUNTSEGMENT
    alias: ACCTSEG
    joinType: LEFT
    joinCondition: ACC.ACCOUNTSEGMENT_ID = ACCTSEG.ID
    
  - name: DIMBILLINGACCOUNT_LOOKUP
    type: lookup
    schema: EDW
    table: DIMBILLINGACCOUNT
    alias: DIM_LOOKUP
    joinType: LEFT
    joinCondition: ACC.PUBLICID = DIM_LOOKUP.PUBLICID
    lookupColumns:
      - BEANVERSION
      - EDWBEANVERSION

transformations:
  - name: SourceCount
    type: RowCount
    description: Count of source records
    operation: COUNT(*)
    outputColumn: SOURCE_COUNT
    
  - name: BatchID
    type: DerivedColumn
    description: Generate batch identifier
    expression: CURRENT_TIMESTAMP()
    outputColumn: BATCH_ID
    dataType: TIMESTAMP
    
  - name: BeanVersionLookup
    type: Lookup
    description: Lookup BeanVersion from existing dimension
    lookupTable: DIMBILLINGACCOUNT_LOOKUP
    lookupKey: PUBLICID
    returnColumns:
      - BEANVERSION
      - EDWBEANVERSION
    
  - name: ChangeDetection
    type: ConditionalSplit
    description: Split records based on change detection
    conditions:
      - name: UnChanged
        condition: BEANVERSION = EDWBEANVERSION
        outputName: UnChangeCount
      - name: Insert
        condition: DIM_LOOKUP.PUBLICID IS NULL
        outputName: InsertCount
      - name: Update
        condition: BEANVERSION != EDWBEANVERSION AND DIM_LOOKUP.PUBLICID IS NOT NULL
        outputName: UpdateCount
    
  - name: UnChangeCount
    type: RowCount
    description: Count of unchanged records
    operation: COUNT(*)
    outputColumn: UNCHANGED_COUNT
    
  - name: InsertCount
    type: RowCount
    description: Count of records to insert
    operation: COUNT(*)
    outputColumn: INSERT_COUNT
    
  - name: UpdateCount
    type: RowCount
    description: Count of records to update
    operation: COUNT(*)
    outputColumn: UPDATE_COUNT

columns:
  - name: PUBLICID
    dataType: VARCHAR(100)
    description: Public identifier from BC_ACCOUNT
    sourceColumn: ACC.PUBLICID
    isPrimaryKey: true
    isBusinessKey: true
    
  - name: ACCOUNTNUMBER
    dataType: VARCHAR(50)
    description: Account number
    sourceColumn: ACC.ACCOUNTNUMBER
    
  - name: ACCOUNTNAME
    dataType: VARCHAR(255)
    description: Account name
    sourceColumn: ACC.ACCOUNTNAME
    
  - name: ACCOUNTTYPE
    dataType: VARCHAR(100)
    description: Account type description
    sourceColumn: ACCTYPE.DESCRIPTION
    
  - name: ACCOUNTSTATUS
    dataType: VARCHAR(50)
    description: Account status
    sourceColumn: ACC.ACCOUNTSTATUS
    
  - name: PARENTACCOUNTID
    dataType: VARCHAR(100)
    description: Parent account public ID
    sourceColumn: PACC.PUBLICID
    
  - name: BILLINGLEVEL
    dataType: VARCHAR(100)
    description: Billing level description
    sourceColumn: BLVL.DESCRIPTION
    
  - name: CUSTOMERSERVICETIER
    dataType: VARCHAR(100)
    description: Customer service tier
    sourceColumn: CST.DESCRIPTION
    
  - name: BILLINGADDRESS
    dataType: VARCHAR(500)
    description: Billing address
    sourceColumn: ADDR.ADDRESSLINE1
    
  - name: BILLINGCITY
    dataType: VARCHAR(100)
    description: Billing city
    sourceColumn: ADDR.CITY
    
  - name: BILLINGSTATE
    dataType: VARCHAR(50)
    description: Billing state
    sourceColumn: ST.CODE
    
  - name: BILLINGPOSTALCODE
    dataType: VARCHAR(20)
    description: Billing postal code
    sourceColumn: ADDR.POSTALCODE
    
  - name: SECURITYZONE
    dataType: VARCHAR(100)
    description: Security zone
    sourceColumn: SECZONE.NAME
    
  - name: DELINQUENCYSTATUS
    dataType: VARCHAR(100)
    description: Delinquency status
    sourceColumn: DELSTAT.DESCRIPTION
    
  - name: ACCOUNTSEGMENT
    dataType: VARCHAR(100)
    description: Account segment
    sourceColumn: ACCTSEG.DESCRIPTION
    
  - name: CONTACTNAME
    dataType: VARCHAR(255)
    description: Primary contact name
    sourceColumn: CON.NAME
    
  - name: CONTACTEMAIL
    dataType: VARCHAR(255)
    description: Primary contact email
    sourceColumn: CON.EMAILADDRESS1
    
  - name: CONTACTPHONE
    dataType: VARCHAR(50)
    description: Primary contact phone
    sourceColumn: CON.WORKPHONE
    
  - name: BEANVERSION
    dataType: INTEGER
    description: Source bean version for change tracking
    sourceColumn: ACC.BEANVERSION
    
  - name: EDWBEANVERSION
    dataType: INTEGER
    description: EDW bean version for change tracking
    sourceColumn: DIM_LOOKUP.EDWBEANVERSION
    
  - name: BATCH_ID
    dataType: TIMESTAMP
    description: Batch execution timestamp
    sourceColumn: BATCH_ID
    isSystemColumn: true
    
  - name: INSERT_DATE
    dataType: TIMESTAMP
    description: Record insert timestamp
    defaultValue: CURRENT_TIMESTAMP()
    isSystemColumn: true
    
  - name: UPDATE_DATE
    dataType: TIMESTAMP
    description: Record update timestamp
    defaultValue: CURRENT_TIMESTAMP()
    isSystemColumn: true
    
  - name: IS_ACTIVE
    dataType: BOOLEAN
    description: Active record indicator
    defaultValue: true
    isSystemColumn: true

loadStrategy:
  type: MERGE
  matchCondition: TARGET.PUBLICID = SOURCE.PUBLICID
  whenMatched:
    condition: SOURCE.BEANVERSION != TARGET.EDWBEANVERSION
    action: UPDATE
    updateColumns:
      - ACCOUNTNUMBER
      - ACCOUNTNAME
      - ACCOUNTTYPE
      - ACCOUNTSTATUS
      - PARENTACCOUNTID
      - BILLINGLEVEL
      - CUSTOMERSERVICETIER
      - BILLINGADDRESS
      - BILLINGCITY
      - BILLINGSTATE
      - BILLINGPOSTALCODE
      - SECURITYZONE
      - DELINQUENCYSTATUS
      - ACCOUNTSEGMENT
      - CONTACTNAME
      - CONTACTEMAIL
      - CONTACTPHONE
      - EDWBEANVERSION
      - UPDATE_DATE
  whenNotMatched:
    action: INSERT
    insertColumns: ALL

validation:
  enabled: true
  rules:
    - name: PrimaryKeyNotNull
      type: NOT_NULL
      columns:
        - PUBLICID
      severity: ERROR
      
    - name: BeanVersionValid
      type: CUSTOM
      expression: BEANVERSION IS NOT NULL AND BEANVERSION >= 0
      severity: WARNING
      
    - name: AccountNumberUnique
      type: UNIQUE
      columns:
        - ACCOUNTNUMBER
      severity: ERROR

performance:
  clusteringKeys:
    - PUBLICID
    - ACCOUNTNUMBER
  distributionKey: PUBLICID
  sortKeys:
    - PUBLICID
    - INSERT_DATE

monitoring:
  metrics:
    - SOURCE_COUNT
    - INSERT_COUNT
    - UPDATE_COUNT
    - UNCHANGED_COUNT
  alerts:
    - name: HighUpdateRate
      condition: UPDATE_COUNT > (SOURCE_COUNT * 0.5)
      severity: WARNING
      message: More than 50% of records are being updated
    - name: NoRecordsProcessed
      condition: SOURCE_COUNT = 0
      severity: ERROR
      message: No source records found to process

dependencies:
  upstream:
    - BC_ACCOUNT
    - BC_PARENTACCT
    - BC_ACCOUNTCONTACT
    - BC_ACCOUNTCONTACTROLE
    - BCTL_ACCOUNTROLE
    - BC_CONTACT
    - BC_ADDRESS
    - BCTL_STATE
    - BCTL_ACCOUNTTYPE
    - BCTL_BILLINGLEVEL
    - BCTL_CUSTOMERSERVICETIER
    - BC_SECURITYZONE
    - BCTL_DELINQUENCYSTATUS
    - BCTL_ACCOUNTSEGMENT
  downstream: []

executionOrder: 100

tags:
  - dimension
  - billing
  - scd-type-1
  - guidewire
  - edw

audit:
  createdBy: Agent3_DataEngineering
  createdDate: 2025-01-22
  modifiedBy: Agent3_DataEngineering
  modifiedDate: 2025-01-22
  version: 1.0.0
  changeLog:
    - version: 1.0.0
      date: 2025-01-22
      author: Agent3_DataEngineering
      description: Initial creation of DIMBILLINGACCOUNT target dimension with SCD Type 1 logic based on SSIS package EDW_BC_Load_DimBillingAccount
          SRC_BC_CONTACT: 2l0n9o8p-3m4q-5n6o-7p8q-9l0m1n2o3p4q
          SRC_BC_ADDRESS: 3m1o0p9q-4n5r-6o7p-8q9r-0m1n2o3p4q5r
          SRC_BCTL_STATE: 4n2p1q0r-5o6s-7p8q-9r0s-1n2o3p4q5r6s
          SRC_DIMBILLINGACCOUNT: 5o3q2r1s-6p7t-8q9r-0s1t-2o3p4q5r6s7t
        customSQL:
          customSQL: |
            SELECT
              acct.ACCOUNTNUMBER,
              acct.ACCOUNTNAME,
              accttype.NAME AS ACCOUNTTYPE,
              parent.FOREIGNENTITYID AS PARENTACCOUNTID,
              blvl.NAME AS BILLINGLEVEL,
              tier.NAME AS SERVICETIER,
              sz.NAME AS SECURITYZONE,
              seg.NAME AS SEGMENT,
              acct.CLOSEDATE,
              acct.CREATETIME,
              dstat.NAME AS DELINQUENCYSTATUS,
              acct.FIRSTTWICEPERMTHINVOICEDOM,
              acct.SECONDTWICEPERMTHINVOICEDOM,
              acct.PUBLICID,
              acct.BEANVERSION,
              acct.RETIRED,
              acct.UPDATETIME,
              contact.FIRSTNAME AS INSUREDFIRSTNAME,
              contact.LASTNAME AS INSUREDLASTNAME,
              addr.ADDRESSLINE1,
              addr.ADDRESSLINE2,
              addr.ADDRESSLINE3,
              addr.CITY,
              state.NAME AS STATE,
              addr.POSTALCODE
            FROM {{ ref('SRC_BC_ACCOUNT') }} acct
            LEFT JOIN {{ ref('SRC_BCTL_ACCOUNTTYPE') }} accttype
              ON acct.ACCOUNTTYPE = accttype.ID
            LEFT JOIN {{ ref('SRC_BC_PARENTACCT') }} parent
              ON parent.OWNERID = acct.ID
            LEFT JOIN {{ ref('SRC_BCTL_BILLINGLEVEL') }} blvl
              ON acct.BILLINGLEVEL = blvl.ID
            LEFT JOIN {{ ref('SRC_BCTL_CUSTOMERSERVICETIER') }} tier
              ON acct.SERVICETIER = tier.ID
            LEFT JOIN {{ ref('SRC_BC_SECURITYZONE') }} sz
              ON acct.SECURITYZONEID = sz.ID
            LEFT JOIN {{ ref('SRC_BCTL_DELINQUENCYSTATUS') }} dstat
              ON acct.DELINQUENCYSTATUS = dstat.ID
            LEFT JOIN {{ ref('SRC_BCTL_ACCOUNTSEGMENT') }} seg
              ON acct.SEGMENT = seg.ID
            LEFT JOIN (
              SELECT DISTINCT
                ac.INSUREDACCOUNTID AS ACCOUNTID,
                ac.CONTACTID
              FROM {{ ref('SRC_BC_ACCOUNTCONTACT') }} ac
              INNER JOIN {{ ref('SRC_BC_ACCOUNTCONTACTROLE') }} acr
                ON acr.ACCOUNTCONTACTID = ac.ID
              INNER JOIN {{ ref('SRC_BCTL_ACCOUNTROLE') }} ar
                ON ar.ID = acr.ROLE
                AND ar.TYPECODE = 'insured'
            ) insured
              ON insured.ACCOUNTID = acct.ID
            LEFT JOIN {{ ref('SRC_BC_CONTACT') }} contact
              ON contact.ID = insured.CONTACTID
            LEFT JOIN {{ ref('SRC_BC_ADDRESS') }} addr
              ON addr.ID = contact.PRIMARYADDRESSID
            LEFT JOIN {{ ref('SRC_BCTL_STATE') }} state
              ON state.ID = addr.STATE
            WHERE NOT EXISTS (
              SELECT 1
              FROM {{ ref('SRC_DIMBILLINGACCOUNT') }} dim
              WHERE dim.PUBLICID = acct.PUBLICID
                AND dim.BEANVERSION = acct.BEANVERSION
            )

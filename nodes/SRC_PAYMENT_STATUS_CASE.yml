fileVersion: 1
id: payment_status_case_node
name: SRC_PAYMENT_STATUS_CASE
description: Conditional split transformation - Determines payment status based on amount_paid vs total_amount
type: sql
config:
  clusterKey: false
  downstreamOption: true
  groupByAll: false
  initialize: ON_CREATE
  insertStrategy: INSERT
  orderby: false
  postSQL: ''
  preSQL: ''
  testsEnabled: true
  truncateBefore: true
columns:
  - name: CUSTOMER_ID
    dataType: NUMBER
    description: Customer identifier
  - name: FIRST_NAME
    dataType: VARCHAR
    description: Customer first name
  - name: LAST_NAME
    dataType: VARCHAR
    description: Customer last name
  - name: EMAIL
    dataType: VARCHAR
    description: Customer email address
  - name: ORDER_ID
    dataType: NUMBER
    description: Order identifier
  - name: ORDER_DATE
    dataType: DATE
    description: Date when order was placed
  - name: TOTAL_AMOUNT
    dataType: NUMBER
    description: Total amount of the order
  - name: PRODUCT_NAME
    dataType: VARCHAR
    description: Product name
  - name: QUANTITY
    dataType: NUMBER
    description: Quantity of items ordered
  - name: PRICE
    dataType: NUMBER
    description: Price per item
  - name: AMOUNT_PAID
    dataType: NUMBER
    description: Amount paid
  - name: FULL_NAME
    dataType: VARCHAR
    description: Full name from previous transformation
  - name: ORDER_YEAR
    dataType: NUMBER
    description: Year extracted from order_date
  - name: ITEM_TOTAL
    dataType: NUMBER
    description: Total calculated as quantity * price
  - name: PAYMENT_STATUS
    dataType: VARCHAR
    description: Conditional split - Payment status (PAID, NOT PAID, or PARTIAL)
dependsOn:
  - type: transformation
    name: SRC_ITEM_TOTAL_DERIVED
sql: |
  -- Transformation 4: Conditional Split - payment_status
  -- CASE WHEN amount_paid >= total_amount THEN 'PAID'
  --      WHEN amount_paid IS NULL THEN 'NOT PAID'
  --      ELSE 'PARTIAL' END
  SELECT
    CUSTOMER_ID,
    FIRST_NAME,
    LAST_NAME,
    EMAIL,
    ORDER_ID,
    ORDER_DATE,
    TOTAL_AMOUNT,
    PRODUCT_NAME,
    QUANTITY,
    PRICE,
    AMOUNT_PAID,
    FULL_NAME,
    ORDER_YEAR,
    ITEM_TOTAL,
    CASE
      WHEN AMOUNT_PAID >= TOTAL_AMOUNT THEN 'PAID'
      WHEN AMOUNT_PAID IS NULL THEN 'NOT PAID'
      ELSE 'PARTIAL'
    END AS PAYMENT_STATUS
  FROM {{ ref('SRC_ITEM_TOTAL_DERIVED') }}
executionOrder: 5
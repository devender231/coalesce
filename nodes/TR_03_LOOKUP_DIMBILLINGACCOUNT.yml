name: TR_03_LOOKUP_DIMBILLINGACCOUNT
type: transformation
transformation_type: LOOKUP
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID to identify new vs existing records
config:
  materialized: view
  cache_mode: FULL
  
source:
  name: TR_02_DERIVED_BATCHID
  type: derived_column

lookup_config:
  lookup_table: SRC_DIMBILLINGACCOUNT
  lookup_type: LEFT_OUTER
  join_condition:
    - source_column: PUBLICID
      lookup_column: PUBLICID
      operator: "="
  
  columns_to_return:
    - column_name: BEANVERSION
      alias: EDWBeanVersion
      data_type: STRING
      description: Existing BeanVersion from dimension table

transformation_logic:
  operation: LOOKUP_JOIN
  description: |
    Performs lookup against DIMBILLINGACCOUNT dimension table
    to retrieve existing BeanVersion for comparison.
    SQL equivalent: SELECT Publicid, BeanVersion FROM DimBillingAccount
    Join condition: Source.PUBLICID = DIMBILLINGACCOUNT.PUBLICID
    
  match_behavior:
    on_match: Return EDWBeanVersion
    on_no_match: Return NULL for EDWBeanVersion

output_columns:
  # All columns from previous transformation
  - ACCOUNTNUMBER
  - ACCOUNTNAME
  - ACCOUNTTYPE
  - BILLINGLEVEL
  - SERVICETIER
  - SECURITYZONEID
  - SEGMENT
  - CLOSEDATE
  - CREATETIME
  - DELINQUENCYSTATUS
  - FIRSTTWICEPERMTHINVOICEDOM
  - SECONDTWICEPERMTHINVOICEDOM
  - PUBLICID
  - ACCOUNT_ID
  - BEANVERSION
  - RETIRED
  - UPDATETIME
  - ACCOUNTTYPE_NAME
  - PARENT_ACCOUNT_ID
  - BILLINGLEVEL_NAME
  - SERVICETIER_NAME
  - SECURITYZONE_NAME
  - DELINQUENCYSTATUS_NAME
  - ACCOUNTSEGMENT_NAME
  - INSURED_FIRSTNAME
  - INSURED_LASTNAME
  - INSURED_ADDRESS1
  - INSURED_ADDRESS2
  - INSURED_ADDRESS3
  - INSURED_CITY
  - INSURED_POSTALCODE
  - INSURED_STATE
  - BatchID
  # New lookup column
  - name: EDWBeanVersion
    data_type: STRING
    description: Existing BeanVersion from DimBillingAccount for SCD comparison

execution_order: 4
dependencies:
  - TR_02_DERIVED_BATCHID
  - SRC_DIMBILLINGACCOUNT

notes: |
  Third transformation in the pipeline.
  Performs lookup to determine if record exists in target dimension.
  EDWBeanVersion NULL = new record (INSERT)
  EDWBeanVersion matches BEANVERSION = unchanged record
  EDWBeanVersion differs from BEANVERSION = changed record (UPDATE)
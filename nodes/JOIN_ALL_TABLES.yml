            nodeName: BC_CONTACT
          - locationName: SOURCE
            nodeName: BC_ADDRESS
          - locationName: SOURCE
            nodeName: BCTL_STATE
        join:
          joinCondition: |
            FROM {{ ref('SOURCE', 'BC_ACCOUNT') }} BC_ACCOUNT
            LEFT JOIN {{ ref('SOURCE', 'BCTL_ACCOUNTTYPE') }} BCTL_ACCOUNTTYPE
              ON BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
            LEFT JOIN {{ ref('SOURCE', 'BC_PARENTACCT') }} BC_PARENTACCT
              ON BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
            LEFT JOIN {{ ref('SOURCE', 'BCTL_BILLINGLEVEL') }} BCTL_BILLINGLEVEL
              ON BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
            LEFT JOIN {{ ref('SOURCE', 'BCTL_CUSTOMERSERVICETIER') }} BCTL_CUSTOMERSERVICETIER
              ON BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
            LEFT JOIN {{ ref('SOURCE', 'BC_SECURITYZONE') }} BC_SECURITYZONE
              ON BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
            LEFT JOIN {{ ref('SOURCE', 'BCTL_DELINQUENCYSTATUS') }} BCTL_DELINQUENCYSTATUS
              ON BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
            LEFT JOIN {{ ref('SOURCE', 'BCTL_ACCOUNTSEGMENT') }} BCTL_ACCOUNTSEGMENT
              ON BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
            LEFT JOIN {{ ref('SOURCE', 'INSUREDINFO') }} INSUREDINFO
              ON INSUREDINFO.ACCOUNTID = BC_ACCOUNT.ID
            INNER JOIN {{ ref('SOURCE', 'BC_ACCOUNTCONTACT') }} BC_ACCOUNTCONTACT
              ON BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID
            INNER JOIN {{ ref('SOURCE', 'BC_ACCOUNTCONTACTROLE') }} BC_ACCOUNTCONTACTROLE
              ON BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
            INNER JOIN {{ ref('SOURCE', 'BCTL_ACCOUNTROLE') }} BCTL_ACCOUNTROLE
              ON BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE
              AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
            LEFT JOIN {{ ref('SOURCE', 'BC_CONTACT') }} BC_CONTACT
              ON BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
            LEFT JOIN {{ ref('SOURCE', 'BC_ADDRESS') }} BC_ADDRESS
              ON BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID
            LEFT JOIN {{ ref('SOURCE', 'BCTL_STATE') }} BCTL_STATE
              ON BCTL_STATE.ID = BC_ADDRESS.STATE
        name: JOIN_ALL_TABLES
        noLinkRefs: []

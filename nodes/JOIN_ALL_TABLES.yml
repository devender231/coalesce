    sourceMapping:
      - aliases:
          SRC_BC_ACCOUNT: JOIN_ALL_TABLES
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SOURCE
            nodeName: BC_ACCOUNT
          - locationName: SOURCE
            nodeName: BCTL_ACCOUNTTYPE
          - locationName: SOURCE

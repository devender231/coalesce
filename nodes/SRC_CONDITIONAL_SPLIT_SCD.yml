name: SRC_CONDITIONAL_SPLIT_SCD
type: Conditional Split
description: Routes rows based on whether BeanVersion matches EDWBeanVersion

transformation_type: CONDITIONAL_SPLIT
execution_order: 4

input:
  source: SRC_LOOKUP_BEANVERSION
  description: Dataset after BeanVersion lookup

split_conditions:
  - output_name: UNCHANGED_ROWS
    condition: "BeanVersion == EDWBeanVersion"
    description: Rows where source BeanVersion matches existing dimension BeanVersion
    priority: 1
    action: Route to UnChange Count
  
  - output_name: UPDATE_ROWS
    condition: "BeanVersion != EDWBeanVersion AND EDWBeanVersion IS NOT NULL"
    description: Rows where BeanVersion differs and record exists in dimension
    priority: 2
    action: Route to Update Count and then to target for UPDATE
  
  - output_name: INSERT_ROWS
    condition: "EDWBeanVersion IS NULL"
    description: Rows where no match found in lookup (new records)
    priority: 3
    action: Route to Insert Count and then to target for INSERT

logic:
  operation: SPLIT
  evaluation_order: Sequential (priority 1, 2, 3)
  default_output: INSERT_ROWS
  description: |
    Implements SCD Type 1 logic by comparing BeanVersion values:
    - Unchanged: BeanVersion matches EDWBeanVersion
    - Update: BeanVersion differs from EDWBeanVersion
    - Insert: EDWBeanVersion is NULL (no existing record)

output_paths:
  - path: UNCHANGED_ROWS
    destination: SRC_ROW_COUNT_UNCHANGED
    row_action: NO_LOAD
  
  - path: UPDATE_ROWS
    destination: SRC_ROW_COUNT_UPDATE
    row_action: UPDATE_TARGET
  
  - path: INSERT_ROWS
    destination: SRC_ROW_COUNT_INSERT
    row_action: INSERT_TARGET

upstream_dependencies:
  - SRC_LOOKUP_BEANVERSION.yml

metadata:
  purpose: SCD Type 1 routing logic for dimension table maintenance
  usage: Directs rows to appropriate paths based on change detection
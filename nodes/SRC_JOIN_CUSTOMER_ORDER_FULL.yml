fileVersion: 1
name: SRC_JOIN_CUSTOMER_ORDER_FULL
operation:
  config:
    insertStrategy: INSERT
    selectDistinct: false
  database: PC_COALESCE_DB
  deployEnabled: true
  locationName: TARGET
  metadata:
    columns:
      - name: CUSTOMER_ID
        dataType: NUMBER(38,0)
        nullable: false
        description: Customer identifier from CUSTOMERS table
      - name: FIRST_NAME
        dataType: VARCHAR(100)
        nullable: true
        description: Customer first name
      - name: LAST_NAME
        dataType: VARCHAR(100)
        nullable: true
        description: Customer last name
      - name: EMAIL
        dataType: VARCHAR(255)
        nullable: true
        description: Customer email
      - name: ORDER_ID
        dataType: NUMBER(38,0)
        nullable: false
        description: Order identifier from ORDERS table
      - name: ORDER_DATE
        dataType: DATE
        nullable: true
        description: Order date
      - name: TOTAL_AMOUNT
        dataType: NUMBER(18,2)
        nullable: true
        description: Total order amount
      - name: PRODUCT_NAME
        dataType: VARCHAR(255)
        nullable: true
        description: Product name from ORDER_ITEMS
      - name: QUANTITY
        dataType: NUMBER(10,0)
        nullable: true
        description: Quantity ordered
      - name: PRICE
        dataType: NUMBER(18,2)
        nullable: true
        description: Unit price
      - name: AMOUNT_PAID
        dataType: NUMBER(18,2)
        nullable: true
        description: Amount paid from PAYMENTS
  name: SRC_JOIN_CUSTOMER_ORDER_FULL
  schema: STAGE
  sources:
    - name: SRC_CUSTOMERS
      alias: c
      dependencies:
        - locationName: SOURCE
          nodeName: SRC_CUSTOMERS
    - name: SRC_ORDERS
      alias: o
      dependencies:
        - locationName: SOURCE
          nodeName: SRC_ORDERS
    - name: SRC_ORDER_ITEMS
      alias: oi
      dependencies:
        - locationName: SOURCE
          nodeName: SRC_ORDER_ITEMS
    - name: SRC_PAYMENTS
      alias: p
      dependencies:
        - locationName: SOURCE
          nodeName: SRC_PAYMENTS
  joins:
    - type: INNER
      left: c
      right: o
      condition: c.CUSTOMER_ID = o.CUSTOMER_ID
      description: Join customers with their orders
    - type: LEFT
      left: o
      right: oi
      condition: o.ORDER_ID = oi.ORDER_ID
      description: Join orders with order items
    - type: LEFT
      left: o
      right: p
      condition: o.ORDER_ID = p.ORDER_ID
      description: Join orders with payments
  sqlType: Stage
  type: sql
  version: 1
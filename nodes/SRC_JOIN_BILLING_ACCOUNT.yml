# Join Configuration for DimBillingAccount
name: SRC_JOIN_BILLING_ACCOUNT
type: JOIN
description: Joins BC_ACCOUNT with related lookup tables for billing account dimension

source_tables:
  - BC_ACCOUNT
  - BCTL_ACCOUNTTYPE
  - BC_PARENTACCT
  - BCTL_BILLINGLEVEL
  - BCTL_CUSTOMERSERVICETIER
  - BC_SECURITYZONE
  - BCTL_DELINQUENCYSTATUS
  - BCTL_ACCOUNTSEGMENT
  - BC_ACCOUNTCONTACT
  - BC_ACCOUNTCONTACTROLE
  - BCTL_ACCOUNTROLE
  - BC_CONTACT
  - BC_ADDRESS
  - BCTL_STATE
  - DIMBILLINGACCOUNT

joins:
  - join_order: 1
    left_table: BC_ACCOUNT
    right_table: BCTL_ACCOUNTTYPE
    join_type: LEFT
    join_condition: BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
    description: Join account with account type lookup

  - join_order: 2
    left_table: BC_ACCOUNT
    right_table: BC_PARENTACCT
    join_type: LEFT
    join_condition: BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
    description: Join account with parent account

  - join_order: 3
    left_table: BC_ACCOUNT
    right_table: BCTL_BILLINGLEVEL
    join_type: LEFT
    join_condition: BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
    description: Join account with billing level lookup

  - join_order: 4
    left_table: BC_ACCOUNT
    right_table: BCTL_CUSTOMERSERVICETIER
    join_type: LEFT
    join_condition: BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
    description: Join account with customer service tier lookup

  - join_order: 5
    left_table: BC_ACCOUNT
    right_table: BC_SECURITYZONE
    join_type: LEFT
    join_condition: BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
    description: Join account with security zone

  - join_order: 6
    left_table: BC_ACCOUNT
    right_table: BCTL_DELINQUENCYSTATUS
    join_type: LEFT
    join_condition: BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
    description: Join account with delinquency status lookup

  - join_order: 7
    left_table: BC_ACCOUNT
    right_table: BCTL_ACCOUNTSEGMENT
    join_type: LEFT
    join_condition: BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
    description: Join account with account segment lookup

  - join_order: 8
    left_table: BC_ACCOUNT
    right_table: INSUREDINFO
    join_type: LEFT
    join_condition: INSUREDINFO.ACCOUNTID = BC_ACCOUNT.ID
    description: Join account with insured information

  - join_order: 9
    left_table: INSUREDINFO
    right_table: BC_ACCOUNTCONTACT
    join_type: INNER
    join_condition: BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID
    description: Join insured info with account contact

  - join_order: 10
    left_table: INSUREDINFO
    right_table: BC_ACCOUNTCONTACTROLE
    join_type: INNER
    join_condition: BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
    description: Join insured info with account contact role

  - join_order: 11
    left_table: INSUREDINFO
    right_table: BCTL_ACCOUNTROLE
    join_type: INNER
    join_condition: BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
    description: Join insured info with account role lookup for insured type

  - join_order: 12
    left_table: INSUREDINFO
    right_table: BC_CONTACT
    join_type: LEFT
    join_condition: BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
    description: Join insured info with contact details

  - join_order: 13
    left_table: INSUREDINFO
    right_table: BC_ADDRESS
    join_type: LEFT
    join_condition: BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID
    description: Join insured info with primary address

  - join_order: 14
    left_table: INSUREDINFO
    right_table: BCTL_STATE
    join_type: LEFT
    join_condition: BCTL_STATE.ID = BC_ADDRESS.STATE
    description: Join insured info with state lookup

  - join_order: 15
    left_table: LOOKUP_INPUT
    right_table: DIMBILLINGACCOUNT
    join_type: INNER
    join_condition: LOOKUP_INPUT.PUBLICID = DIMBILLINGACCOUNT.PUBLICID
    description: Lookup join with existing dimension table for SCD logic

output:
  description: Joined dataset ready for transformations
  execution_order: 1
fileVersion: 1
id: SRC_TRANSFORM_DATA_CONVERSION
name: SRC_TRANSFORM_DATA_CONVERSION
operation:
  config:
    insertStrategy: INSERT
    selectDistinct: false
  database: ""
  deployEnabled: true
  description: Data Conversion Transformation - Converts data types and formats for final output
  isMultisource: false
  locationName: TGT
  materializationType: view
  metadata:
    appliedNodeTests: []
    columns:
      - columnReference:
          columnCounter: 1
          stepCounter: SRC_TRANSFORM_DATA_CONVERSION
        config: {}
        dataType: STRING
        description: "Split Category (Converted to String)"
        name: SPLIT_CATEGORY_STR
        nullable: false
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 1
                stepCounter: SRC_TRANSFORM_SORT
            transform: "CAST(SPLIT_CATEGORY AS STRING)"
      - columnReference:
          columnCounter: 2
          stepCounter: SRC_TRANSFORM_DATA_CONVERSION
        config: {}
        dataType: STRING
        description: "Account Status (Converted to String)"
        name: ACCOUNT_STATUS_STR
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 2
                stepCounter: SRC_TRANSFORM_SORT
            transform: "CAST(ACCOUNT_STATUS AS STRING)"
      - columnReference:
          columnCounter: 3
          stepCounter: SRC_TRANSFORM_DATA_CONVERSION
        config: {}
        dataType: STRING
        description: "Total Account Count (Converted to String)"
        name: TOTAL_ACCOUNT_COUNT_STR
        nullable: false
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 3
                stepCounter: SRC_TRANSFORM_SORT
            transform: "CAST(TOTAL_ACCOUNT_COUNT AS STRING)"
      - columnReference:
          columnCounter: 4
          stepCounter: SRC_TRANSFORM_DATA_CONVERSION
        config: {}
        dataType: DECIMAL
        description: "Valid Account Count (Converted to Decimal)"
        name: VALID_ACCOUNT_COUNT_DEC
        nullable: false
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 4
                stepCounter: SRC_TRANSFORM_SORT
            transform: "CAST(VALID_ACCOUNT_COUNT AS DECIMAL(18,2))"
      - columnReference:
          columnCounter: 5
          stepCounter: SRC_TRANSFORM_DATA_CONVERSION
        config: {}
        dataType: DECIMAL
        description: "Invalid Account Count (Converted to Decimal)"
        name: INVALID_ACCOUNT_COUNT_DEC
        nullable: false
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 5
                stepCounter: SRC_TRANSFORM_SORT
            transform: "CAST(INVALID_ACCOUNT_COUNT AS DECIMAL(18,2))"
      - columnReference:
          columnCounter: 6
          stepCounter: SRC_TRANSFORM_DATA_CONVERSION
        config: {}
        dataType: BIGINT
        description: "Distinct Account Count (Converted to BigInt)"
        name: DISTINCT_ACCOUNT_COUNT_BIGINT
        nullable: false
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 6
                stepCounter: SRC_TRANSFORM_SORT
            transform: "CAST(DISTINCT_ACCOUNT_COUNT AS BIGINT)"
      - columnReference:
          columnCounter: 7
          stepCounter: SRC_TRANSFORM_DATA_CONVERSION
        config: {}
        dataType: STRING
        description: "Aggregation Timestamp (Converted to String)"
        name: AGGREGATION_TIMESTAMP_STR
        nullable: false
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 7
                stepCounter: SRC_TRANSFORM_SORT
            transform: "CAST(AGGREGATION_TIMESTAMP AS STRING)"
      - columnReference:
          columnCounter: 8
          stepCounter: SRC_TRANSFORM_DATA_CONVERSION
        config: {}
        dataType: STRING
        description: "Sort Rank (Converted to String)"
        name: SORT_RANK_STR
        nullable: false
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 8
                stepCounter: SRC_TRANSFORM_SORT
            transform: "CAST(SORT_RANK AS STRING)"
      - columnReference:
          columnCounter: 9
          stepCounter: SRC_TRANSFORM_DATA_CONVERSION
        config: {}
        dataType: DECIMAL
        description: "Valid Account Percentage"
        name: VALID_ACCOUNT_PERCENTAGE
        nullable: false
        sourceColumnReferences:
          - columnReferences: []
            transform: |
              CASE 
                WHEN TOTAL_ACCOUNT_COUNT > 0 THEN 
                  CAST((VALID_ACCOUNT_COUNT * 100.0 / TOTAL_ACCOUNT_COUNT) AS DECIMAL(5,2))
                ELSE 0.00
              END
      - columnReference:
          columnCounter: 10
          stepCounter: SRC_TRANSFORM_DATA_CONVERSION
        config: {}
        dataType: STRING
        description: "Processing Date (Formatted)"
        name: PROCESSING_DATE
        nullable: false
        sourceColumnReferences:
          - columnReferences: []
            transform: "FORMAT_TIMESTAMP('%Y-%m-%d', CURRENT_TIMESTAMP())"
      - columnReference:
          columnCounter: 11
          stepCounter: SRC_TRANSFORM_DATA_CONVERSION
        config: {}
        dataType: STRING
        description: "Record Hash for Change Detection"
        name: RECORD_HASH
        nullable: false
        sourceColumnReferences:
          - columnReferences: []
            transform: "TO_HEX(MD5(CONCAT(CAST(SPLIT_CATEGORY AS STRING), '|', CAST(ACCOUNT_STATUS AS STRING), '|', CAST(TOTAL_ACCOUNT_COUNT AS STRING))))"
    cteString: ""
    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          SRC_TRANSFORM_SORT: SRC_TRANSFORM_SORT
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: TGT
            nodeName: SRC_TRANSFORM_SORT
        join:
          joinCondition: |
            FROM {{ ref('TGT', 'SRC_TRANSFORM_SORT') }} "SRC_TRANSFORM_SORT"
        name: SRC_TRANSFORM_SORT
        noLinkRefs: []
  name: SRC_TRANSFORM_DATA_CONVERSION
  overrideSQL: false
  schema: ""
  sqlType: Transform
  type: sql
  version: 1
type: Node
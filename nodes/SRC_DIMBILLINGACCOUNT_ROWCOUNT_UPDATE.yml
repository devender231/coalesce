name: SRC_DIMBILLINGACCOUNT_ROWCOUNT_UPDATE
type: transformation
transformation_type: ROW_COUNT
description: Counts update rows (BeanVersion different)
source:
  - SRC_DIMBILLINGACCOUNT_CONDITIONALSPLIT
  - output: UPDATE_ROWS
logic:
  operation: COUNT
  output_variable: User::UpdateCount
  description: Counts rows where BeanVersion differs from EDWBeanVersion (records to update)
output:
  row_count_variable: UpdateCount
  pass_through: true
  destination: UPDATE
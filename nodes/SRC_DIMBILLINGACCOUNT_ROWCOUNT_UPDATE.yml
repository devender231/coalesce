# Transformation YAML - Row Count Update
version: 1.0

name: SRC_DIMBILLINGACCOUNT_ROWCOUNT_UPDATE
description: Counts update rows (BeanVersion different)
transformation_type: ROW_COUNT

sources:
  - name: UPDATE_OUTPUT
    type: transformation
    source_ref: SRC_DIMBILLINGACCOUNT_CONDITIONALSPLIT
    output_path: UPDATE_OUTPUT

transformation:
  type: ROW_COUNT
  logic:
    description: Counts rows where BeanVersion differs from existing dimension record
    variable: User::UpdateCount
    operation: COUNT(*)
    filter: BEANVERSION != EDWBeanVersion AND EDWBeanVersion IS NOT NULL

output:
  name: ROWCOUNT_UPDATE_OUTPUT
  description: Pass-through update data with row count captured
  columns:
    - name: ALL_COLUMNS
      source: UPDATE_OUTPUT.*
      description: All columns from update rows passed through

metadata:
  row_count_variable: User::UpdateCount
  capture_point: After conditional split - update path
  action: UPDATE
  description: These rows will be updated in target dimension table

execution_order: 8
dependencies:
  - SRC_DIMBILLINGACCOUNT_CONDITIONALSPLIT
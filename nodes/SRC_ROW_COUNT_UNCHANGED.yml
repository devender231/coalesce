name: SRC_ROW_COUNT_UNCHANGED
type: Row Count
description: Counts unchanged rows (BeanVersion matches)

transformation_type: ROW_COUNT
execution_order: 5

input:
  source: SRC_CONDITIONAL_SPLIT_SCD
  output_path: UNCHANGED_ROWS
  description: Rows where BeanVersion matches EDWBeanVersion

logic:
  operation: COUNT
  target_variable: User::UnChangeCount
  description: Counts rows that have not changed and do not need update

output:
  row_count_variable: User::UnChangeCount
  pass_through: false
  description: Counts unchanged rows but does not pass them to target (no load needed)
  destination: AUDIT_LOG_ONLY

upstream_dependencies:
  - SRC_CONDITIONAL_SPLIT_SCD.yml

metadata:
  purpose: Audit and tracking of unchanged row counts
  usage: Variable User::UnChangeCount is used for ETL audit logging
  load_action: NO_LOAD
name: SRC_TR_ROW_COUNT_INSERT
type: row_count
description: Counts new insert rows (lookup no match)

input:
  source: SRC_TR_CONDITIONAL_SPLIT
  source_path: INSERT_ROWS
  
transformation:
  type: ROW_COUNT
  operation: COUNT_ROWS
  output_variable: User::InsertCount
  
logic:
  description: Counts rows with no match in lookup (new records to insert)
  variable_assignment: User::InsertCount = COUNT(*)
  condition: ISNULL(EDWBeanVersion)

output:
  pass_through: true
  row_count_variable: User::InsertCount
  destination: DIMBILLINGACCOUNT
  load_type: INSERT

execution_order: 7

dependencies:
  - SRC_TR_CONDITIONAL_SPLIT
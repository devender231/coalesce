name: SRC_TR_ROW_COUNT_INSERT
type: transformation
transformation_type: ROW_COUNT
description: Counts new insert rows (lookup no match)
execution_order: 6

input:
  source: SRC_TR_CONDITIONAL_SPLIT_BEANVERSION
  source_output: INSERT_OUTPUT
  description: Rows with no match in target table

transformation_logic:
  operation: COUNT_ROWS
  output_variable: User::InsertCount
  description: Counts new records to be inserted

output:
  name: INSERT_COUNTED
  pass_through: true
  metadata:
    row_count_variable: User::InsertCount
    action: INSERT_TO_TARGET
  target_destination: DIMBILLINGACCOUNT

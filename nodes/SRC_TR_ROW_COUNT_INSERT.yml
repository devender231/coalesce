fileVersion: 1.0
name: SRC_TR_ROW_COUNT_INSERT
type: RowCount
description: Counts new insert rows where lookup found no match (EDW_BEANVERSION IS NULL)

config:
  clusterKey: false
  downstreamOption: true
  groupByAll: false
  initialize: ON_CREATE
  insertStrategy: UNION
  orderby: false
  postSQL: ''
  preSQL: ''
  testsEnabled: true
  truncateBefore: true
  warehouseName: DEV_WH

transformation:
  type: ROW_COUNT
  logic: |
    -- Count rows from INSERT_ROWS output stream
    SELECT COUNT(*) AS InsertCount
    FROM {{ ref('SRC_TR_CONDITIONAL_SPLIT_BEANVERSION') }}
    WHERE EDW_BEANVERSION IS NULL
  
  variableMapping:
    targetVariable: User::InsertCount
    description: Stores the count of new insert rows for audit purposes
  
  inputStream: INSERT_ROWS


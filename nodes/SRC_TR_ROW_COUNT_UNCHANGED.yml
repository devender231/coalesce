name: SRC_TR_ROW_COUNT_UNCHANGED
type: row_count
description: Counts unchanged rows (BeanVersion matches)

input:
  source: SRC_TR_CONDITIONAL_SPLIT
  source_path: UNCHANGED_ROWS
  
transformation:
  type: ROW_COUNT
  operation: COUNT_ROWS
  output_variable: User::UnChangeCount
  
logic:
  description: Counts rows where BeanVersion matches EDWBeanVersion (no changes needed)
  variable_assignment: User::UnChangeCount = COUNT(*)
  condition: BEANVERSION == EDWBeanVersion

output:
  pass_through: false
  row_count_variable: User::UnChangeCount
  terminate_flow: true

execution_order: 6

dependencies:
  - SRC_TR_CONDITIONAL_SPLIT
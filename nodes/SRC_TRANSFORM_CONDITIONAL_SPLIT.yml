fileVersion: 1.0
name: SRC_TRANSFORM_CONDITIONAL_SPLIT
description: Routes rows based on whether BeanVersion matches EDWBeanVersion
type: ConditionalSplit
config:
  transformation_type: CONDITIONAL_SPLIT
  logic:
    description: Routes rows based on whether BeanVersion matches EDWBeanVersion
    conditions:
      - condition_name: UNCHANGED_ROWS
        expression: 'BeanVersion == EDWBeanVersion'
        output_name: UnchangedOutput
        description: Rows where BeanVersion matches (no update needed)
      - condition_name: UPDATE_ROWS
        expression: 'BeanVersion != EDWBeanVersion AND !ISNULL(EDWBeanVersion)'
        output_name: UpdateOutput
        description: Rows where BeanVersion differs (needs update)
      - condition_name: INSERT_ROWS
        expression: 'ISNULL(EDWBeanVersion)'
        output_name: InsertOutput
        description: Rows with no match in lookup (new inserts)
    default_output: DefaultOutput
  input:
    source: SRC_TRANSFORM_LOOKUP_BEANVERSION
    description: Dataset with looked up BeanVersion
  outputs:
    - name: UnchangedOutput
      description: Rows that don't need updates
    - name: UpdateOutput
      description: Rows that need updates
    - name: InsertOutput
      description: New rows for insert
    - name: DefaultOutput
      description: Default output for unmatched conditions

execution_order: 5
package: EDW_BC_Load_DimBillingAccount
dependencies:
  - SRC_TRANSFORM_LOOKUP_BEANVERSION
        description: "Account Name"
        name: ACCOUNTNAME
        nullable: false
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 2
                stepCounter: SRC_TRANSFORM_LOOKUP
            transform: "ACCOUNTNAME"
      - columnReference:
          columnCounter: 3
          stepCounter: SRC_TRANSFORM_CONDITIONAL_SPLIT
        config: {}
        dataType: STRING
        description: "Full Account Name"
        name: FULL_ACCOUNT_NAME
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 3
                stepCounter: SRC_TRANSFORM_LOOKUP
            transform: "FULL_ACCOUNT_NAME"
      - columnReference:
          columnCounter: 4
          stepCounter: SRC_TRANSFORM_CONDITIONAL_SPLIT
        config: {}
        dataType: INTEGER
        description: "Billing Account Key"
        name: BILLING_ACCOUNT_KEY
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 4
                stepCounter: SRC_TRANSFORM_LOOKUP
            transform: "BILLING_ACCOUNT_KEY"
      - columnReference:
          columnCounter: 5
          stepCounter: SRC_TRANSFORM_CONDITIONAL_SPLIT
        config: {}
        dataType: STRING
        description: "Account Status"
        name: ACCOUNT_STATUS
        nullable: true
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 5
                stepCounter: SRC_TRANSFORM_LOOKUP
            transform: "ACCOUNT_STATUS"
      - columnReference:
          columnCounter: 6
          stepCounter: SRC_TRANSFORM_CONDITIONAL_SPLIT
        config: {}
        dataType: STRING
        description: "Split Category - Active or Inactive"
        name: SPLIT_CATEGORY
        nullable: false
        sourceColumnReferences:
          - columnReferences: []
            transform: |
              CASE 
                WHEN ACCOUNT_STATUS = 'ACTIVE' THEN 'ACTIVE_ACCOUNTS'
                WHEN ACCOUNT_STATUS = 'INACTIVE' THEN 'INACTIVE_ACCOUNTS'
                WHEN ACCOUNT_STATUS = 'CLOSED' THEN 'CLOSED_ACCOUNTS'
                ELSE 'OTHER_ACCOUNTS'
              END
      - columnReference:
          columnCounter: 7
          stepCounter: SRC_TRANSFORM_CONDITIONAL_SPLIT
        config: {}
        dataType: BOOLEAN
        description: "Is Valid Account Flag"
        name: IS_VALID_ACCOUNT
        nullable: false
        sourceColumnReferences:
          - columnReferences: []
            transform: |
              CASE 
                WHEN BILLING_ACCOUNT_KEY IS NOT NULL AND BILLING_ACCOUNT_KEY > 0 THEN TRUE
                ELSE FALSE
              END
      - columnReference:
          columnCounter: 8
          stepCounter: SRC_TRANSFORM_CONDITIONAL_SPLIT
        config: {}
        dataType: DATETIME
        description: "Load Timestamp"
        name: LOAD_TIMESTAMP
        nullable: false
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 6
                stepCounter: SRC_TRANSFORM_LOOKUP
            transform: "LOAD_TIMESTAMP"

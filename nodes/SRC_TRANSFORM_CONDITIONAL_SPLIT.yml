  metadata:
    appliedNodeTests: []
    columns:
      - columnReference:
          columnCounter: 1
          stepCounter: SRC_TRANSFORM_CONDITIONAL_SPLIT
        config: {}
        dataType: INTEGER
        description: "Account Number"
        name: ACCOUNTNUMBER
        nullable: false
        sourceColumnReferences:
          - columnReferences:
              - columnCounter: 1
                stepCounter: SRC_TRANSFORM_LOOKUP
            transform: "ACCOUNTNUMBER"
      - columnReference:
          columnCounter: 2
          stepCounter: SRC_TRANSFORM_CONDITIONAL_SPLIT
        config: {}

name: TR_04_CONDITIONALSPLIT_SCD
type: transformation
transformation_type: CONDITIONAL_SPLIT
description: Routes rows based on BeanVersion comparison for SCD Type 1 logic
config:
  materialized: view
  
source:
  name: TR_03_LOOKUP_DIMBILLINGACCOUNT
  type: lookup

transformation_logic:
  operation: CONDITIONAL_ROUTING
  split_conditions:
    - output_name: UNCHANGED_ROWS
      condition: "BEANVERSION == EDWBeanVersion"
      description: Records where BeanVersion matches - no update needed
      priority: 1
      
    - output_name: NEW_ROWS
      condition: "EDWBeanVersion IS NULL"
      description: Records not found in dimension - INSERT required
      priority: 2
      
    - output_name: CHANGED_ROWS
      condition: "BEANVERSION != EDWBeanVersion AND EDWBeanVersion IS NOT NULL"
      description: Records with different BeanVersion - UPDATE required
      priority: 3
      
    - output_name: DEFAULT_OUTPUT
      condition: "DEFAULT"
      description: Catch-all for any unmatched rows
      priority: 4

output_paths:
  - path_name: UNCHANGED_ROWS
    destination: TR_05_ROWCOUNT_UNCHANGED
    description: Rows requiring no action
    
  - path_name: NEW_ROWS
    destination: TR_06_ROWCOUNT_INSERT
    description: Rows to be inserted into dimension
    
  - path_name: CHANGED_ROWS
    destination: TR_07_ROWCOUNT_UPDATE
    description: Rows to be updated in dimension

output_columns:
  # All columns pass through to respective outputs
  - ACCOUNTNUMBER
  - ACCOUNTNAME
  - ACCOUNTTYPE
  - BILLINGLEVEL
  - SERVICETIER
  - SECURITYZONEID
  - SEGMENT
  - CLOSEDATE
  - CREATETIME
  - DELINQUENCYSTATUS
  - FIRSTTWICEPERMTHINVOICEDOM
  - SECONDTWICEPERMTHINVOICEDOM
  - PUBLICID
  - ACCOUNT_ID
  - BEANVERSION
  - RETIRED
  - UPDATETIME
  - ACCOUNTTYPE_NAME
  - PARENT_ACCOUNT_ID
  - BILLINGLEVEL_NAME
  - SERVICETIER_NAME
  - SECURITYZONE_NAME
  - DELINQUENCYSTATUS_NAME
  - ACCOUNTSEGMENT_NAME
  - INSURED_FIRSTNAME
  - INSURED_LASTNAME
  - INSURED_ADDRESS1
  - INSURED_ADDRESS2
  - INSURED_ADDRESS3
  - INSURED_CITY
  - INSURED_POSTALCODE
  - INSURED_STATE
  - BatchID
  - EDWBeanVersion

execution_order: 5
dependencies:
  - TR_03_LOOKUP_DIMBILLINGACCOUNT

notes: |
  Fourth transformation in the pipeline.
  Implements SCD Type 1 routing logic:
  - UNCHANGED: BeanVersion == EDWBeanVersion (no action)
  - NEW: EDWBeanVersion IS NULL (insert)
  - CHANGED: BeanVersion != EDWBeanVersion (update)
  Each output path feeds into separate row count transformations for audit.
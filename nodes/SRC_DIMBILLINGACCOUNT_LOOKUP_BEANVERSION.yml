name: SRC_DIMBILLINGACCOUNT_LOOKUP_BEANVERSION
type: transformation
transformation_type: LOOKUP
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID
source:
  - SRC_DIMBILLINGACCOUNT_DERIVED_BATCHID
lookup_table:
  name: SRC_DIMBILLINGACCOUNT
  columns:
    - PUBLICID
    - BEANVERSION
logic:
  join_condition: SRC_DIMBILLINGACCOUNT_DERIVED_BATCHID.PUBLICID = SRC_DIMBILLINGACCOUNT.PUBLICID
  lookup_columns:
    - source_column: PUBLICID
      lookup_column: PUBLICID
      match_type: EXACT
  return_columns:
    - column_name: EDWBeanVersion
      source_column: BEANVERSION
      description: Existing BeanVersion from target table
  no_match_behavior: PASS_NULL
  description: Retrieves existing BeanVersion to compare with source BeanVersion
output:
  pass_through: true
  new_columns:
    - EDWBeanVersion
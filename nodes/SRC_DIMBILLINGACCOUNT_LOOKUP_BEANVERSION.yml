name: SRC_DIMBILLINGACCOUNT_LOOKUP_BEANVERSION
type: lookup
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID

lookup_table: DIMBILLINGACCOUNT
lookup_columns:
  - Publicid
  - BeanVersion

join_condition: PUBLICID = DIMBILLINGACCOUNT.PUBLICID

input_dependency: SRC_DIMBILLINGACCOUNT_DERIVED_BATCHID

execution_order: 4

transformation_logic:
  type: lookup
  operation: |
    Perform lookup operation to retrieve BeanVersion from DIMBILLINGACCOUNT table
    based on matching PUBLICID values.
    
    SQL Query:
    SELECT Publicid, BeanVersion 
    FROM DimBillingAccount
    
    Join Condition:
    Source.PUBLICID = DIMBILLINGACCOUNT.PUBLICID

output_columns:
  - name: Publicid
    type: string
    source: DIMBILLINGACCOUNT
    description: Public identifier for billing account
  - name: BeanVersion
    type: integer
    source: DIMBILLINGACCOUNT
    description: Version number of the bean object

error_handling:
  no_match_behavior: return_null
  multiple_match_behavior: return_first

metadata:
  source_system: SSIS
  transformation_type: LOOKUP
  created_date: 2024
  execution_sequence: 4
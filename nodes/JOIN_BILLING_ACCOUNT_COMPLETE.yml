          BC_SECURITYZONE: BCSZ
          BCTL_DELINQUENCYSTATUS: BCDS
          BCTL_ACCOUNTSEGMENT: BCAS
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: BC_ACCOUNT
          - locationName: SRC
            nodeName: BC_PARENTACCT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACTROLE

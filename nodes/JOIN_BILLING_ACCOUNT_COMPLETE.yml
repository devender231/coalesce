    sourceMapping:
      - aliases:
          BC_ACCOUNT: BCA
          BC_PARENTACCT: BCP
          BC_ACCOUNTCONTACT: BCAC
          BC_ACCOUNTCONTACTROLE: BCACR
          BCTL_ACCOUNTROLE: BCAR
          BC_CONTACT: BCO
          BC_ADDRESS: BCAD
          BCTL_STATE: BCST
          BCTL_ACCOUNTTYPE: BCAT
          BCTL_BILLINGLEVEL: BCB

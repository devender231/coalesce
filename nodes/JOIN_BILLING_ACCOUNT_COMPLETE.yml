          - locationName: SRC
            nodeName: BC_ADDRESS
          - locationName: SRC
            nodeName: BCTL_STATE
          - locationName: SRC
            nodeName: BCTL_ACCOUNTTYPE
          - locationName: SRC
            nodeName: BCTL_BILLINGLEVEL
          - locationName: SRC
            nodeName: BCTL_CUSTOMERSERVICETIER
          - locationName: SRC
            nodeName: BC_SECURITYZONE
          - locationName: SRC
            nodeName: BCTL_DELINQUENCYSTATUS
          - locationName: SRC
            nodeName: BCTL_ACCOUNTSEGMENT
        join:
          joinCondition: |
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} BCA
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} BCAT ON BCA.ACCOUNTTYPE = BCAT.ID
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} BCP ON BCP.OWNERID = BCA.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} BCB ON BCA.BILLINGLEVEL = BCB.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} BCS ON BCA.SERVICETIER = BCS.ID
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} BCSZ ON BCA.SECURITYZONEID = BCSZ.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} BCDS ON BCA.DELINQUENCYSTATUS = BCDS.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} BCAS ON BCA.SEGMENT = BCAS.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} BCAC ON BCAC.INSUREDACCOUNTID = BCA.ID
            INNER JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} BCACR ON BCACR.ACCOUNTCONTACTID = BCAC.ID
            INNER JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} BCAR ON BCAR.ID = BCACR.ROLE AND BCAR.TYPECODE = 'insured'
            LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} BCO ON BCO.ID = BCAC.CONTACTID
            LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} BCAD ON BCAD.ID = BCO.PRIMARYADDRESSID
            LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} BCST ON BCST.ID = BCAD.STATE
        name: JOIN_BILLING_ACCOUNT_COMPLETE

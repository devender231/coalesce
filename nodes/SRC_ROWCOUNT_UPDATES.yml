name: SRC_ROWCOUNT_UPDATES
type: transformation
config:
  transformation_type: row_count
  description: "Counts update rows (BeanVersion different)"
  execution_order: 7
dependencies:
  - SRC_CONDITIONALSPLIT_BEANVERSION
logic:
  operation: count_rows
  variable_name: "User::UpdateCount"
  input_branch: UpdateRows
  description: "Captures count of rows where BeanVersion differs from EDWBeanVersion"
output:
  row_count_variable: "User::UpdateCount"
  pass_through_data: true
  description: "Counts rows and passes data to target for UPDATE operation"
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACTROLE
          - locationName: SRC
            nodeName: BCTL_ACCOUNTROLE
          - locationName: SRC
            nodeName: BC_CONTACT
          - locationName: SRC
            nodeName: BC_ADDRESS
          - locationName: SRC
            nodeName: BCTL_STATE
        join:
          joinCondition: |
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} acct
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} accttype
              ON acct.ACCOUNTTYPE = accttype.ID
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} parent
              ON parent.OWNERID = acct.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} blvl
              ON acct.BILLINGLEVEL = blvl.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} cst
              ON acct.SERVICETIER = cst.ID
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} sz
              ON acct.SECURITYZONEID = sz.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} ds
              ON acct.DELINQUENCYSTATUS = ds.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} seg
              ON acct.SEGMENT = seg.ID
            LEFT JOIN INSUREDINFO insured
              ON insured.ACCOUNTID = acct.ID

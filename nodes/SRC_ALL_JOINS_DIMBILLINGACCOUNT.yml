    sourceMapping:
      - aliases:
          SRC_BC_ACCOUNT: acct
          SRC_BCTL_ACCOUNTTYPE: accttype
          SRC_BC_PARENTACCT: parent
          SRC_BCTL_BILLINGLEVEL: blvl
          SRC_BCTL_CUSTOMERSERVICETIER: cst
          SRC_BC_SECURITYZONE: sz
          SRC_BCTL_DELINQUENCYSTATUS: ds
          SRC_BCTL_ACCOUNTSEGMENT: seg
          SRC_BC_ACCOUNTCONTACT: acctcontact
          SRC_BC_ACCOUNTCONTACTROLE: acctcontactrole
          SRC_BCTL_ACCOUNTROLE: acctRole
          SRC_BC_CONTACT: contact
          SRC_BC_ADDRESS: addr
          SRC_BCTL_STATE: state
        customSQL:
          customSQL: |
            WITH INSUREDINFO AS (
              SELECT 
                acctcontact.INSUREDACCOUNTID as ACCOUNTID,
                contact.FIRSTNAME,
                contact.LASTNAME,
                addr.ADDRESSLINE1,
                addr.ADDRESSLINE2,
                addr.ADDRESSLINE3,
                addr.CITY,
                addr.POSTALCODE,
                state.NAME as STATE_NAME
              FROM {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} acctcontact
              INNER JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} acctcontactrole
                ON acctcontactrole.ACCOUNTCONTACTID = acctcontact.ID
              INNER JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} acctRole
                ON acctRole.ID = acctcontactrole.ROLE
                AND acctRole.TYPECODE = 'insured'
              LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} contact
                ON contact.ID = acctcontact.CONTACTID
              LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} addr
                ON addr.ID = contact.PRIMARYADDRESSID
              LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} state
                ON state.ID = addr.STATE
            )
            SELECT 
              acct.ACCOUNTNUMBER,
              acct.ACCOUNTNAME,
              accttype.NAME as ACCOUNTTYPE_NAME,
              parent.FOREIGNENTITYID as PARENTACCT_FOREIGNENTITYID,
              blvl.NAME as BILLINGLEVEL_NAME,
              cst.NAME as SERVICETIER_NAME,
              sz.NAME as SECURITYZONE_NAME,
              ds.NAME as DELINQUENCYSTATUS_NAME,
              seg.NAME as SEGMENT_NAME,
              insured.FIRSTNAME as INSURED_FIRSTNAME,
              insured.LASTNAME as INSURED_LASTNAME,
              insured.ADDRESSLINE1 as ADDRESS_LINE1,
              insured.ADDRESSLINE2 as ADDRESS_LINE2,
              insured.CITY,
              insured.STATE_NAME,
              insured.POSTALCODE,
              acct.CLOSEDATE,
              acct.CREATETIME,
              acct.FIRSTTWICEPERMTHINVOICEDOM,
              acct.SECONDTWICEPERMTHINVOICEDOM,
              acct.PUBLICID,
              acct.ID,
              acct.BEANVERSION,
              acct.RETIRED,
              acct.UPDATETIME
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} acct
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} accttype
              ON acct.ACCOUNTTYPE = accttype.ID
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} parent
              ON parent.OWNERID = acct.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} blvl
              ON acct.BILLINGLEVEL = blvl.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} cst
              ON acct.SERVICETIER = cst.ID
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} sz
              ON acct.SECURITYZONEID = sz.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} ds
              ON acct.DELINQUENCYSTATUS = ds.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} seg
              ON acct.SEGMENT = seg.ID
            LEFT JOIN INSUREDINFO insured
              ON insured.ACCOUNTID = acct.ID
        dependencies:
          - locationName: SRC
            nodeName: BC_ACCOUNT
          - locationName: SRC
            nodeName: BCTL_ACCOUNTTYPE
          - locationName: SRC
            nodeName: BC_PARENTACCT
          - locationName: SRC

# Conditional Split Transformation
# Routes rows based on whether BeanVersion matches EDWBeanVersion

name: SRC_DIMBILLINGACCOUNT_CONDITIONALSPLIT
type: transformation
transformation_type: CONDITIONAL_SPLIT
description: Routes rows based on BeanVersion comparison - unchanged, new inserts, or updates

source:
  name: SRC_DIMBILLINGACCOUNT_LOOKUP_BEANVERSION
  type: transformation

transformation:
  operation: CONDITIONAL_SPLIT
  conditions:
    - output_name: UnchangedRows
      condition: "BEANVERSION == EDWBeanVersion"
      description: Records where BeanVersion matches EDW - no changes needed
      priority: 1
      
    - output_name: UpdateRows
      condition: "BEANVERSION != EDWBeanVersion AND EDWBeanVersion IS NOT NULL"
      description: Records where BeanVersion differs - updates needed
      priority: 2
      
    - output_name: InsertRows
      condition: "EDWBeanVersion IS NULL"
      description: Records with no match in EDW - new inserts
      priority: 3
      default: true
      
logic: |
  -- Split rows based on BeanVersion comparison
  CASE
    WHEN BEANVERSION = EDWBeanVersion THEN 'UnchangedRows'
    WHEN BEANVERSION != EDWBeanVersion AND EDWBeanVersion IS NOT NULL THEN 'UpdateRows'
    WHEN EDWBeanVersion IS NULL THEN 'InsertRows'
  END AS RowDestination
  
outputs:
  - name: UnchangedRows
    description: Rows with matching BeanVersion
    row_count_variable: User::UnChangeCount
    
  - name: UpdateRows
    description: Rows requiring updates
    row_count_variable: User::UpdateCount
    
  - name: InsertRows
    description: New rows for insertion
    row_count_variable: User::InsertCount
    default_output: true

execution_order: 5
dependencies:
  - SRC_DIMBILLINGACCOUNT_LOOKUP_BEANVERSION

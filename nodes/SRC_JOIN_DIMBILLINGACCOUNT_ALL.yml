name: SRC_JOIN_DIMBILLINGACCOUNT_ALL
type: join
config:
  join_type: multi_join
  description: "Comprehensive join logic for DimBillingAccount - combines BC_ACCOUNT with all lookup and reference tables"
sources:
  - SRC_BC_ACCOUNT
  - SRC_BCTL_ACCOUNTTYPE
  - SRC_BC_PARENTACCT
  - SRC_BCTL_BILLINGLEVEL
  - SRC_BCTL_CUSTOMERSERVICETIER
  - SRC_BC_SECURITYZONE
  - SRC_BCTL_DELINQUENCYSTATUS
  - SRC_BCTL_ACCOUNTSEGMENT
  - SRC_BC_ACCOUNTCONTACT
  - SRC_BC_ACCOUNTCONTACTROLE_v2
  - SRC_BCTL_ACCOUNTROLE
  - SRC_BC_CONTACT
  - SRC_BC_ADDRESS
  - SRC_BCTL_STATE
  - SRC_DIMBILLINGACCOUNT
joins:
  - join_sequence: 1
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_ACCOUNTTYPE
    join_type: LEFT
    join_condition: "SRC_BC_ACCOUNT.ACCOUNTTYPE = SRC_BCTL_ACCOUNTTYPE.ID"
    description: "Join BC_ACCOUNT with Account Type lookup"
  
  - join_sequence: 2
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BC_PARENTACCT
    join_type: LEFT
    join_condition: "SRC_BC_PARENTACCT.OWNERID = SRC_BC_ACCOUNT.ID"
    description: "Join BC_ACCOUNT with Parent Account relationship"
  
  - join_sequence: 3
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_BILLINGLEVEL
    join_type: LEFT
    join_condition: "SRC_BC_ACCOUNT.BILLINGLEVEL = SRC_BCTL_BILLINGLEVEL.ID"
    description: "Join BC_ACCOUNT with Billing Level lookup"
  
  - join_sequence: 4
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_CUSTOMERSERVICETIER
    join_type: LEFT
    join_condition: "SRC_BC_ACCOUNT.SERVICETIER = SRC_BCTL_CUSTOMERSERVICETIER.ID"
    description: "Join BC_ACCOUNT with Customer Service Tier lookup"
  
  - join_sequence: 5
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BC_SECURITYZONE
    join_type: LEFT
    join_condition: "SRC_BC_ACCOUNT.SECURITYZONEID = SRC_BC_SECURITYZONE.ID"
    description: "Join BC_ACCOUNT with Security Zone"
  
  - join_sequence: 6
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_DELINQUENCYSTATUS
    join_type: LEFT
    join_condition: "SRC_BC_ACCOUNT.DELINQUENCYSTATUS = SRC_BCTL_DELINQUENCYSTATUS.ID"
    description: "Join BC_ACCOUNT with Delinquency Status lookup"
  
  - join_sequence: 7
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_ACCOUNTSEGMENT
    join_type: LEFT
    join_condition: "SRC_BC_ACCOUNT.SEGMENT = SRC_BCTL_ACCOUNTSEGMENT.ID"
    description: "Join BC_ACCOUNT with Account Segment lookup"
  
  - join_sequence: 8
    left_source: SRC_BC_ACCOUNT
    right_source: INSUREDINFO
    join_type: LEFT
    join_condition: "INSUREDINFO.ACCOUNTID = SRC_BC_ACCOUNT.ID"
    description: "Join BC_ACCOUNT with Insured Info (derived from account contact relationships)"
    note: "INSUREDINFO is a logical construct representing insured contact relationships"
  
  - join_sequence: 9
    left_source: INSUREDINFO
    right_source: SRC_BC_ACCOUNTCONTACT
    join_type: INNER
    join_condition: "SRC_BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID"
    description: "Join Insured Info with Account Contact"
  
  - join_sequence: 10
    left_source: INSUREDINFO
    right_source: SRC_BC_ACCOUNTCONTACTROLE_v2
    join_type: INNER
    join_condition: "SRC_BC_ACCOUNTCONTACTROLE_v2.ACCOUNTCONTACTID = SRC_BC_ACCOUNTCONTACT.ID"
    description: "Join Account Contact with Account Contact Role"
  
  - join_sequence: 11
    left_source: INSUREDINFO
    right_source: SRC_BCTL_ACCOUNTROLE
    join_type: INNER
    join_condition: "SRC_BCTL_ACCOUNTROLE.ID = SRC_BC_ACCOUNTCONTACTROLE_v2.ROLE AND SRC_BCTL_ACCOUNTROLE.TYPECODE = 'insured'"
    description: "Join Account Contact Role with Account Role Type (filter for 'insured' role)"
  
  - join_sequence: 12
    left_source: INSUREDINFO
    right_source: SRC_BC_CONTACT
    join_type: LEFT
    join_condition: "SRC_BC_CONTACT.ID = SRC_BC_ACCOUNTCONTACT.CONTACTID"
    description: "Join Account Contact with Contact details"
  
  - join_sequence: 13
    left_source: INSUREDINFO
    right_source: SRC_BC_ADDRESS
    join_type: LEFT
    join_condition: "SRC_BC_ADDRESS.ID = SRC_BC_CONTACT.PRIMARYADDRESSID"
    description: "Join Contact with Primary Address"
  
  - join_sequence: 14
    left_source: INSUREDINFO
    right_source: SRC_BCTL_STATE
    join_type: LEFT
    join_condition: "SRC_BCTL_STATE.ID = SRC_BC_ADDRESS.STATE"
    description: "Join Address with State lookup"
  
  - join_sequence: 15
    left_source: LOOKUP_INPUT
    right_source: SRC_DIMBILLINGACCOUNT
    join_type: INNER
    join_condition: "LOOKUP_INPUT.PUBLICID = SRC_DIMBILLINGACCOUNT.PUBLICID"
    description: "Lookup join with existing DimBillingAccount for SCD logic"
    note: "This join is used in the LOOKUP transformation to identify existing records"
output_columns:
  - ACCOUNTNUMBER
  - ACCOUNTNAME
  - ACCOUNTTYPE
  - ACCOUNTTYPE_NAME
  - BILLINGLEVEL
  - BILLINGLEVEL_NAME
  - SERVICETIER
  - SERVICETIER_NAME
  - SECURITYZONEID
  - SECURITYZONE_NAME
  - SEGMENT
  - SEGMENT_NAME
  - CLOSEDATE
  - CREATETIME
  - DELINQUENCYSTATUS
  - DELINQUENCYSTATUS_NAME
  - FIRSTTWICEPERMTHINVOICEDOM
  - SECONDTWICEPERMTHINVOICEDOM
  - PUBLICID
  - ACCOUNT_ID
  - BEANVERSION
  - RETIRED
  - UPDATETIME
  - PARENTACCT_OWNERID
  - PARENTACCT_FOREIGNENTITYID
  - INSURED_FIRSTNAME
  - INSURED_LASTNAME
  - INSURED_ADDRESSLINE1
  - INSURED_ADDRESSLINE2
  - INSURED_ADDRESSLINE3
  - INSURED_CITY
  - INSURED_POSTALCODE
  - INSURED_STATE
  - INSURED_STATE_NAME
execution_order: 1
dependencies:
  upstream:
    - SRC_BC_ACCOUNT
    - SRC_BCTL_ACCOUNTTYPE
    - SRC_BC_PARENTACCT
    - SRC_BCTL_BILLINGLEVEL
    - SRC_BCTL_CUSTOMERSERVICETIER
    - SRC_BC_SECURITYZONE
    - SRC_BCTL_DELINQUENCYSTATUS
    - SRC_BCTL_ACCOUNTSEGMENT
    - SRC_BC_ACCOUNTCONTACT
    - SRC_BC_ACCOUNTCONTACTROLE_v2
    - SRC_BCTL_ACCOUNTROLE
    - SRC_BC_CONTACT
    - SRC_BC_ADDRESS
    - SRC_BCTL_STATE
    - SRC_DIMBILLINGACCOUNT
  downstream:
    - SRC_TR_ROWCOUNT_SOURCE
metadata:
  created_from: "SSIS Package: EDW_BC_Load_DimBillingAccount"
  join_strategy: "Multi-table LEFT and INNER joins preserving SSIS execution order"
  scd_support: true
  audit_enabled: true
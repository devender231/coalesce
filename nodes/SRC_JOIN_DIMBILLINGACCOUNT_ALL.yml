    sourceMapping:
      - customSQL:
          customSQL: |
            -- Join 1: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTTYPE
            SELECT 
              BC_ACCOUNT.ACCOUNTNUMBER,
              BC_ACCOUNT.ACCOUNTNAME,
              BC_ACCOUNT.ACCOUNTTYPE,
              BCTL_ACCOUNTTYPE.NAME AS ACCOUNTTYPE_NAME,
              BC_ACCOUNT.BILLINGLEVEL,
              BC_ACCOUNT.SERVICETIER,
              BC_ACCOUNT.SECURITYZONEID,
              BC_ACCOUNT.SEGMENT,
              BC_ACCOUNT.CLOSEDATE,
              BC_ACCOUNT.CREATETIME,
              BC_ACCOUNT.DELINQUENCYSTATUS,
              BC_ACCOUNT.FIRSTTWICEPERMTHINVOICEDOM,
              BC_ACCOUNT.SECONDTWICEPERMTHINVOICEDOM,
              BC_ACCOUNT.PUBLICID,
              BC_ACCOUNT.ID AS ACCOUNT_ID,
              BC_ACCOUNT.BEANVERSION,
              BC_ACCOUNT.RETIRED,
              BC_ACCOUNT.UPDATETIME,
              -- Join 2: BC_ACCOUNT LEFT JOIN BC_PARENTACCT
              BC_PARENTACCT.FOREIGNENTITYID AS PARENTACCT_FOREIGNENTITYID,
              -- Join 3: BC_ACCOUNT LEFT JOIN BCTL_BILLINGLEVEL
              BCTL_BILLINGLEVEL.NAME AS BILLINGLEVEL_NAME,
              -- Join 4: BC_ACCOUNT LEFT JOIN BCTL_CUSTOMERSERVICETIER
              BCTL_CUSTOMERSERVICETIER.NAME AS SERVICETIER_NAME,
              -- Join 5: BC_ACCOUNT LEFT JOIN BC_SECURITYZONE
              BC_SECURITYZONE.NAME AS SECURITYZONE_NAME,
              -- Join 6: BC_ACCOUNT LEFT JOIN BCTL_DELINQUENCYSTATUS
              BCTL_DELINQUENCYSTATUS.NAME AS DELINQUENCYSTATUS_NAME,
              -- Join 7: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTSEGMENT
              BCTL_ACCOUNTSEGMENT.NAME AS SEGMENT_NAME,
              -- Joins 8-14: Insured information chain
              BC_CONTACT.FIRSTNAME AS INSURED_FIRSTNAME,
              BC_CONTACT.LASTNAME AS INSURED_LASTNAME,
              BC_ADDRESS.ADDRESSLINE1 AS ADDRESS_LINE1,
              BC_ADDRESS.ADDRESSLINE2 AS ADDRESS_LINE2,
              BC_ADDRESS.ADDRESSLINE3 AS ADDRESS_LINE3,
              BC_ADDRESS.CITY,
              BCTL_STATE.NAME AS STATE_NAME,
              BC_ADDRESS.POSTALCODE
            FROM {{ ref('SRC_BC_ACCOUNT') }} BC_ACCOUNT
            -- Join 1
            LEFT JOIN {{ ref('SRC_BCTL_ACCOUNTTYPE') }} BCTL_ACCOUNTTYPE
              ON BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
            -- Join 2
            LEFT JOIN {{ ref('SRC_BC_PARENTACCT') }} BC_PARENTACCT
              ON BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
            -- Join 3
            LEFT JOIN {{ ref('SRC_BCTL_BILLINGLEVEL') }} BCTL_BILLINGLEVEL
              ON BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
            -- Join 4
            LEFT JOIN {{ ref('SRC_BCTL_CUSTOMERSERVICETIER') }} BCTL_CUSTOMERSERVICETIER
              ON BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
            -- Join 5
            LEFT JOIN {{ ref('SRC_BC_SECURITYZONE') }} BC_SECURITYZONE
              ON BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
            -- Join 6
            LEFT JOIN {{ ref('SRC_BCTL_DELINQUENCYSTATUS') }} BCTL_DELINQUENCYSTATUS
              ON BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
            -- Join 7
            LEFT JOIN {{ ref('SRC_BCTL_ACCOUNTSEGMENT') }} BCTL_ACCOUNTSEGMENT
              ON BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
            -- Join 8: Create INSUREDINFO subquery (LEFT JOIN to account)
            LEFT JOIN (
              SELECT DISTINCT
                BC_ACCOUNTCONTACT.INSUREDACCOUNTID AS ACCOUNTID,
                BC_CONTACT.FIRSTNAME,
                BC_CONTACT.LASTNAME,
                BC_CONTACT.PRIMARYADDRESSID
              FROM {{ ref('SRC_BC_ACCOUNTCONTACT') }} BC_ACCOUNTCONTACT
              -- Join 9 & 10: INNER JOIN to get account contact and role
              INNER JOIN {{ ref('SRC_BC_ACCOUNTCONTACTROLE') }} BC_ACCOUNTCONTACTROLE
                ON BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
              -- Join 11: INNER JOIN to filter for 'insured' role
              INNER JOIN {{ ref('SRC_BCTL_ACCOUNTROLE') }} BCTL_ACCOUNTROLE
                ON BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE
                AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
              -- Join 12: LEFT JOIN to get contact details
              LEFT JOIN {{ ref('SRC_BC_CONTACT') }} BC_CONTACT
                ON BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
            ) INSUREDINFO
              ON INSUREDINFO.ACCOUNTID = BC_ACCOUNT.ID
            -- Join 13: LEFT JOIN to get address from insured contact
            LEFT JOIN {{ ref('SRC_BC_ADDRESS') }} BC_ADDRESS
              ON BC_ADDRESS.ID = INSUREDINFO.PRIMARYADDRESSID
            -- Join 14: LEFT JOIN to get state name
            LEFT JOIN {{ ref('SRC_BCTL_STATE') }} BCTL_STATE
              ON BCTL_STATE.ID = BC_ADDRESS.STATE
        dependencies:
          - locationName: SRC
            nodeName: BC_ACCOUNT
          - locationName: SRC

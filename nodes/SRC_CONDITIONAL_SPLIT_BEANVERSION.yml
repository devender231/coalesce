name: SRC_CONDITIONAL_SPLIT_BEANVERSION
type: transformation
transformation_type: CONDITIONAL_SPLIT
description: Routes rows based on whether BeanVersion matches EDWBeanVersion
execution_order: 5

source:
  - SRC_LOOKUP_BEANVERSION

split_conditions:
  - condition_name: UNCHANGED_ROWS
    condition_order: 1
    expression: "BEANVERSION == EDWBeanVersion"
    description: Rows where source BeanVersion matches existing dimension BeanVersion
    output_destination: SRC_ROWCOUNT_UNCHANGED
    
  - condition_name: UPDATE_ROWS
    condition_order: 2
    expression: "BEANVERSION != EDWBeanVersion AND EDWBeanVersion IS NOT NULL"
    description: Rows where BeanVersion differs (requires update)
    output_destination: SRC_ROWCOUNT_UPDATE
    
  - condition_name: INSERT_ROWS
    condition_order: 3
    expression: "EDWBeanVersion IS NULL"
    description: Rows with no lookup match (new inserts)
    output_destination: SRC_ROWCOUNT_INSERT

default_output:
  name: DEFAULT_OUTPUT
  description: Rows that don't match any condition (should not occur)
  destination: ERROR_HANDLER

output:
  split_outputs:
    - name: UNCHANGED_ROWS
      row_count_tracking: true
    - name: UPDATE_ROWS
      row_count_tracking: true
    - name: INSERT_ROWS
      row_count_tracking: true
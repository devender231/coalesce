transformation_logic:
  operation: CONDITIONAL_SPLIT
  split_type: MULTI_OUTPUT
  description: |
    Routes rows based on BeanVersion comparison:
    - UNCHANGED: BeanVersion == EDWBeanVersion (no action needed)
    - INSERT: EDWBeanVersion IS NULL (new record)
    - UPDATE: BeanVersion != EDWBeanVersion (existing record needs update)
  
  conditions:
    - condition_name: UNCHANGED
      expression: "BEANVERSION = EDWBEANVERSION"
      description: "Records where BeanVersion matches EDW - no changes needed"
      output_name: UNCHANGED_ROWS
      
    - condition_name: INSERT
      expression: "EDWBEANVERSION IS NULL"
      description: "New records not found in EDW - will be inserted"
      output_name: INSERT_ROWS
      
    - condition_name: UPDATE
      expression: "BEANVERSION != EDWBEANVERSION AND EDWBEANVERSION IS NOT NULL"
      description: "Existing records with different BeanVersion - will be updated"
      output_name: UPDATE_ROWS
      
    - condition_name: DEFAULT
      expression: "TRUE"
      description: "Default output for any unmatched conditions"
      output_name: DEFAULT_ROWS


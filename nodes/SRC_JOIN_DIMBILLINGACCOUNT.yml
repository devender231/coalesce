name: SRC_JOIN_DIMBILLINGACCOUNT
type: join
description: Comprehensive join operations for DimBillingAccount transformation
sources:
  - SRC_BC_ACCOUNT
  - SRC_BC_PARENTACCT
  - SRC_BC_ACCOUNTCONTACT
  - SRC_BC_ACCOUNTCONTACTROLE
  - SRC_BCTL_ACCOUNTROLE
  - SRC_BC_CONTACT
  - SRC_BC_ADDRESS
  - SRC_BCTL_STATE
  - SRC_BCTL_ACCOUNTTYPE
  - SRC_BCTL_BILLINGLEVEL
  - SRC_BCTL_CUSTOMERSERVICETIER
  - SRC_BC_SECURITYZONE
  - SRC_BCTL_DELINQUENCYSTATUS
  - SRC_BCTL_ACCOUNTSEGMENT
  - SRC_DIMBILLINGACCOUNT

joins:
  # Join 1: BC_ACCOUNT with BCTL_ACCOUNTTYPE
  - join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_ACCOUNTTYPE
    join_condition:
      - left_column: ACCOUNTTYPE
        right_column: ID
    description: Join BC_ACCOUNT with BCTL_ACCOUNTTYPE to get account type details

  # Join 2: BC_ACCOUNT with BC_PARENTACCT
  - join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BC_PARENTACCT
    join_condition:
      - left_column: ID
        right_column: OWNERID
    description: Join BC_ACCOUNT with BC_PARENTACCT to get parent account information

  # Join 3: BC_ACCOUNT with BCTL_BILLINGLEVEL
  - join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_BILLINGLEVEL
    join_condition:
      - left_column: BILLINGLEVEL
        right_column: ID
    description: Join BC_ACCOUNT with BCTL_BILLINGLEVEL to get billing level details

  # Join 4: BC_ACCOUNT with BCTL_CUSTOMERSERVICETIER
  - join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_CUSTOMERSERVICETIER
    join_condition:
      - left_column: SERVICETIER
        right_column: ID
    description: Join BC_ACCOUNT with BCTL_CUSTOMERSERVICETIER to get service tier information

  # Join 5: BC_ACCOUNT with BC_SECURITYZONE
  - join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BC_SECURITYZONE
    join_condition:
      - left_column: SECURITYZONEID
        right_column: ID
    description: Join BC_ACCOUNT with BC_SECURITYZONE to get security zone details

  # Join 6: BC_ACCOUNT with BCTL_DELINQUENCYSTATUS
  - join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_DELINQUENCYSTATUS
    join_condition:
      - left_column: DELINQUENCYSTATUS
        right_column: ID
    description: Join BC_ACCOUNT with BCTL_DELINQUENCYSTATUS to get delinquency status

  # Join 7: BC_ACCOUNT with BCTL_ACCOUNTSEGMENT
  - join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_ACCOUNTSEGMENT
    join_condition:
      - left_column: SEGMENT
        right_column: ID
    description: Join BC_ACCOUNT with BCTL_ACCOUNTSEGMENT to get account segment information

  # Join 8: BC_ACCOUNT with INSUREDINFO (derived from subsequent joins)
  - join_type: LEFT
    left_source: SRC_BC_ACCOUNT
    right_source: INSUREDINFO
    join_condition:
      - left_column: ID
        right_column: ACCOUNTID
    description: Join BC_ACCOUNT with INSUREDINFO to get insured information

  # Join 9: INSUREDINFO with BC_ACCOUNTCONTACT
  - join_type: INNER
    left_source: INSUREDINFO
    right_source: SRC_BC_ACCOUNTCONTACT
    join_condition:
      - left_column: ACCOUNTID
        right_column: ID
    description: Join INSUREDINFO with BC_ACCOUNTCONTACT to get account contact details

  # Join 10: INSUREDINFO with BC_ACCOUNTCONTACTROLE
  - join_type: INNER
    left_source: INSUREDINFO
    right_source: SRC_BC_ACCOUNTCONTACTROLE
    join_condition:
      - left_column: BC_ACCOUNTCONTACT.ID
        right_column: ACCOUNTCONTACTID
    description: Join INSUREDINFO with BC_ACCOUNTCONTACTROLE to get contact role information

  # Join 11: INSUREDINFO with BCTL_ACCOUNTROLE
  - join_type: INNER
    left_source: INSUREDINFO
    right_source: SRC_BCTL_ACCOUNTROLE
    join_condition:
      - left_column: BC_ACCOUNTCONTACTROLE.ROLE
        right_column: ID
      - left_column: TYPECODE
        right_column: "'insured'"
    description: Join INSUREDINFO with BCTL_ACCOUNTROLE filtering for insured role type

  # Join 12: INSUREDINFO with BC_CONTACT
  - join_type: LEFT
    left_source: INSUREDINFO
    right_source: SRC_BC_CONTACT
    join_condition:
      - left_column: BC_ACCOUNTCONTACT.CONTACTID
        right_column: ID
    description: Join INSUREDINFO with BC_CONTACT to get contact details

  # Join 13: INSUREDINFO with BC_ADDRESS
  - join_type: LEFT
    left_source: INSUREDINFO
    right_source: SRC_BC_ADDRESS
    join_condition:
      - left_column: BC_CONTACT.PRIMARYADDRESSID
        right_column: ID
    description: Join INSUREDINFO with BC_ADDRESS to get primary address information

  # Join 14: INSUREDINFO with BCTL_STATE
  - join_type: LEFT
    left_source: INSUREDINFO
    right_source: SRC_BCTL_STATE
    join_condition:
      - left_column: BC_ADDRESS.STATE
        right_column: ID
    description: Join INSUREDINFO with BCTL_STATE to get state information

  # Join 15: LOOKUP_INPUT with DIMBILLINGACCOUNT
  - join_type: INNER
    left_source: LOOKUP_INPUT
    right_source: SRC_DIMBILLINGACCOUNT
    join_condition:
      - left_column: PUBLICID
        right_column: PUBLICID
    description: Final lookup join with DIMBILLINGACCOUNT for BeanVersion matching

output_columns:
  - BC_ACCOUNT.*
  - BCTL_ACCOUNTTYPE.NAME as AccountTypeName
  - BC_PARENTACCT.ACCOUNTNUMBER as ParentAccountNumber
  - BCTL_BILLINGLEVEL.NAME as BillingLevelName
  - BCTL_CUSTOMERSERVICETIER.NAME as ServiceTierName
  - BC_SECURITYZONE.NAME as SecurityZoneName
  - BCTL_DELINQUENCYSTATUS.NAME as DelinquencyStatusName
  - BCTL_ACCOUNTSEGMENT.NAME as AccountSegmentName
  - BC_CONTACT.FIRSTNAME
  - BC_CONTACT.LASTNAME
  - BC_ADDRESS.*
  - BCTL_STATE.NAME as StateName
  - DIMBILLINGACCOUNT.BEANVERSION
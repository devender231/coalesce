name: SRC_JOIN_DIMBILLINGACCOUNT
type: join
description: Joins all source tables for DimBillingAccount ETL pipeline
sources:
  - SRC_BC_ACCOUNT
  - SRC_BCTL_ACCOUNTTYPE
  - SRC_BC_PARENTACCT
  - SRC_BCTL_BILLINGLEVEL
  - SRC_BCTL_CUSTOMERSERVICETIER
  - SRC_BC_SECURITYZONE
  - SRC_BCTL_DELINQUENCYSTATUS
  - SRC_BCTL_ACCOUNTSEGMENT
  - SRC_BC_ACCOUNTCONTACT
  - SRC_BC_ACCOUNTCONTACTROLE
  - SRC_BCTL_ACCOUNTROLE
  - SRC_BC_CONTACT
  - SRC_BC_ADDRESS
  - SRC_BCTL_STATE
  - SRC_DIMBILLINGACCOUNT

joins:
  - join_sequence: 1
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BCTL_ACCOUNTTYPE
    join_type: LEFT
    condition: SRC_BC_ACCOUNT.ACCOUNTTYPE = SRC_BCTL_ACCOUNTTYPE.ID
    
  - join_sequence: 2
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BC_PARENTACCT
    join_type: LEFT
    condition: SRC_BC_PARENTACCT.OWNERID = SRC_BC_ACCOUNT.ID
    
  - join_sequence: 3
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BCTL_BILLINGLEVEL
    join_type: LEFT
    condition: SRC_BC_ACCOUNT.BILLINGLEVEL = SRC_BCTL_BILLINGLEVEL.ID
    
  - join_sequence: 4
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BCTL_CUSTOMERSERVICETIER
    join_type: LEFT
    condition: SRC_BC_ACCOUNT.SERVICETIER = SRC_BCTL_CUSTOMERSERVICETIER.ID
    
  - join_sequence: 5
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BC_SECURITYZONE
    join_type: LEFT
    condition: SRC_BC_ACCOUNT.SECURITYZONEID = SRC_BC_SECURITYZONE.ID
    
  - join_sequence: 6
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BCTL_DELINQUENCYSTATUS
    join_type: LEFT
    condition: SRC_BC_ACCOUNT.DELINQUENCYSTATUS = SRC_BCTL_DELINQUENCYSTATUS.ID
    
  - join_sequence: 7
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BCTL_ACCOUNTSEGMENT
    join_type: LEFT
    condition: SRC_BC_ACCOUNT.SEGMENT = SRC_BCTL_ACCOUNTSEGMENT.ID
    
  - join_sequence: 8
    left_table: SRC_BC_ACCOUNT
    right_table: INSUREDINFO
    join_type: LEFT
    condition: INSUREDINFO.ACCOUNTID = SRC_BC_ACCOUNT.ID
    description: Creates INSUREDINFO intermediate dataset
    
  - join_sequence: 9
    left_table: INSUREDINFO
    right_table: SRC_BC_ACCOUNTCONTACT
    join_type: INNER
    condition: SRC_BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID
    
  - join_sequence: 10
    left_table: INSUREDINFO
    right_table: SRC_BC_ACCOUNTCONTACTROLE
    join_type: INNER
    condition: SRC_BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = SRC_BC_ACCOUNTCONTACT.ID
    
  - join_sequence: 11
    left_table: INSUREDINFO
    right_table: SRC_BCTL_ACCOUNTROLE
    join_type: INNER
    condition: SRC_BCTL_ACCOUNTROLE.ID = SRC_BC_ACCOUNTCONTACTROLE.ROLE AND SRC_BCTL_ACCOUNTROLE.TYPECODE = 'insured'
    
  - join_sequence: 12
    left_table: INSUREDINFO
    right_table: SRC_BC_CONTACT
    join_type: LEFT
    condition: SRC_BC_CONTACT.ID = SRC_BC_ACCOUNTCONTACT.CONTACTID
    
  - join_sequence: 13
    left_table: INSUREDINFO
    right_table: SRC_BC_ADDRESS
    join_type: LEFT
    condition: SRC_BC_ADDRESS.ID = SRC_BC_CONTACT.PRIMARYADDRESSID
    
  - join_sequence: 14
    left_table: INSUREDINFO
    right_table: SRC_BCTL_STATE
    join_type: LEFT
    condition: SRC_BCTL_STATE.ID = SRC_BC_ADDRESS.STATE
    
  - join_sequence: 15
    left_table: LOOKUP_INPUT
    right_table: SRC_DIMBILLINGACCOUNT
    join_type: INNER
    condition: LOOKUP_INPUT.PUBLICID = SRC_DIMBILLINGACCOUNT.PUBLICID
    description: Lookup join for existing records

output:
  name: JOINED_DATASET
  description: All tables joined as per SSIS execution order
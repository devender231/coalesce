name: SRC_JOIN_DIMBILLINGACCOUNT
type: join
config:
  join_type: multi_join
  description: "Comprehensive join logic for DimBillingAccount ETL - 15 joins in execution order"
dependencies:
  - SRC_BC_ACCOUNT
  - SRC_BCTL_ACCOUNTTYPE
  - SRC_BC_PARENTACCT
  - SRC_BCTL_BILLINGLEVEL
  - SRC_BCTL_CUSTOMERSERVICETIER
  - SRC_BC_SECURITYZONE
  - SRC_BCTL_DELINQUENCYSTATUS
  - SRC_BCTL_ACCOUNTSEGMENT
  - SRC_BC_ACCOUNTCONTACT
  - SRC_BC_ACCOUNTCONTACTROLE
  - SRC_BCTL_ACCOUNTROLE
  - SRC_BC_CONTACT
  - SRC_BC_ADDRESS
  - SRC_BCTL_STATE
  - SRC_DIMBILLINGACCOUNT
joins:
  - join_number: 1
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_ACCOUNTTYPE
    join_type: LEFT
    join_condition: "BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID"
    description: "Join BC_ACCOUNT with BCTL_ACCOUNTTYPE to get account type name"
  
  - join_number: 2
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BC_PARENTACCT
    join_type: LEFT
    join_condition: "BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID"
    description: "Join BC_ACCOUNT with BC_PARENTACCT to get parent account information"
  
  - join_number: 3
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_BILLINGLEVEL
    join_type: LEFT
    join_condition: "BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID"
    description: "Join BC_ACCOUNT with BCTL_BILLINGLEVEL to get billing level name"
  
  - join_number: 4
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_CUSTOMERSERVICETIER
    join_type: LEFT
    join_condition: "BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID"
    description: "Join BC_ACCOUNT with BCTL_CUSTOMERSERVICETIER to get service tier name"
  
  - join_number: 5
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BC_SECURITYZONE
    join_type: LEFT
    join_condition: "BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID"
    description: "Join BC_ACCOUNT with BC_SECURITYZONE to get security zone name"
  
  - join_number: 6
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_DELINQUENCYSTATUS
    join_type: LEFT
    join_condition: "BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID"
    description: "Join BC_ACCOUNT with BCTL_DELINQUENCYSTATUS to get delinquency status name"
  
  - join_number: 7
    left_source: SRC_BC_ACCOUNT
    right_source: SRC_BCTL_ACCOUNTSEGMENT
    join_type: LEFT
    join_condition: "BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID"
    description: "Join BC_ACCOUNT with BCTL_ACCOUNTSEGMENT to get account segment name"
  
  - join_number: 8
    left_source: SRC_BC_ACCOUNT
    right_source: INSUREDINFO
    join_type: LEFT
    join_condition: "INSUREDINFO.ACCOUNTID = BC_ACCOUNT.ID"
    description: "Join BC_ACCOUNT with INSUREDINFO derived table"
  
  - join_number: 9
    left_source: INSUREDINFO
    right_source: SRC_BC_ACCOUNTCONTACT
    join_type: INNER
    join_condition: "BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID"
    description: "Join INSUREDINFO with BC_ACCOUNTCONTACT to get account contact details"
  
  - join_number: 10
    left_source: INSUREDINFO
    right_source: SRC_BC_ACCOUNTCONTACTROLE
    join_type: INNER
    join_condition: "BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID"
    description: "Join INSUREDINFO with BC_ACCOUNTCONTACTROLE to get contact role"
  
  - join_number: 11
    left_source: INSUREDINFO
    right_source: SRC_BCTL_ACCOUNTROLE
    join_type: INNER
    join_condition: "BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'"
    description: "Join INSUREDINFO with BCTL_ACCOUNTROLE to filter insured role type"
  
  - join_number: 12
    left_source: INSUREDINFO
    right_source: SRC_BC_CONTACT
    join_type: LEFT
    join_condition: "BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID"
    description: "Join INSUREDINFO with BC_CONTACT to get contact details"
  
  - join_number: 13
    left_source: INSUREDINFO
    right_source: SRC_BC_ADDRESS
    join_type: LEFT
    join_condition: "BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID"
    description: "Join INSUREDINFO with BC_ADDRESS to get primary address"
  
  - join_number: 14
    left_source: INSUREDINFO
    right_source: SRC_BCTL_STATE
    join_type: LEFT
    join_condition: "BCTL_STATE.ID = BC_ADDRESS.STATE"
    description: "Join INSUREDINFO with BCTL_STATE to get state name"
  
  - join_number: 15
    left_source: LOOKUP_INPUT
    right_source: SRC_DIMBILLINGACCOUNT
    join_type: INNER
    join_condition: "LOOKUP_INPUT.PUBLICID = DIMBILLINGACCOUNT.PUBLICID"
    description: "Join LOOKUP_INPUT with DIMBILLINGACCOUNT for lookup validation"
output_columns:
  - ACCOUNTNUMBER
  - ACCOUNTNAME
  - ACCOUNTTYPE
  - ACCOUNTTYPE_NAME
  - BILLINGLEVEL
  - BILLINGLEVEL_NAME
  - SERVICETIER
  - SERVICETIER_NAME
  - SECURITYZONEID
  - SECURITYZONE_NAME
  - SEGMENT
  - SEGMENT_NAME
  - CLOSEDATE
  - CREATETIME
  - DELINQUENCYSTATUS
  - DELINQUENCYSTATUS_NAME
  - FIRSTTWICEPERMTHINVOICEDOM
  - SECONDTWICEPERMTHINVOICEDOM
  - PUBLICID
  - ID
  - BEANVERSION
  - RETIRED
  - UPDATETIME
  - PARENT_ACCOUNT_ID
  - CONTACT_FIRSTNAME
  - CONTACT_LASTNAME
  - ADDRESS_LINE1
  - ADDRESS_LINE2
  - ADDRESS_LINE3
  - CITY
  - POSTALCODE
  - STATE_NAME
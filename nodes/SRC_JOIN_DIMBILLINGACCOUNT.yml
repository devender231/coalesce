    cteString: ""
    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          BC_ACCOUNT: SRC.SRC.BC_ACCOUNT
          BCTL_ACCOUNTTYPE: SRC.SRC.BCTL_ACCOUNTTYPE
          BC_PARENTACCT: SRC.SRC.BC_PARENTACCT
          BCTL_BILLINGLEVEL: SRC.SRC.BCTL_BILLINGLEVEL
          BCTL_CUSTOMERSERVICETIER: SRC.SRC.BCTL_CUSTOMERSERVICETIER
          BC_SECURITYZONE: SRC.SRC.BC_SECURITYZONE
          BCTL_DELINQUENCYSTATUS: SRC.SRC.BCTL_DELINQUENCYSTATUS
          BCTL_ACCOUNTSEGMENT: SRC.SRC.BCTL_ACCOUNTSEGMENT
          BC_ACCOUNTCONTACT: SRC.SRC.BC_ACCOUNTCONTACT
          BC_ACCOUNTCONTACTROLE: SRC.SRC.BC_ACCOUNTCONTACTROLE
          BCTL_ACCOUNTROLE: SRC.SRC.BCTL_ACCOUNTROLE
          BC_CONTACT: SRC.SRC.BC_CONTACT
          BC_ADDRESS: SRC.SRC.BC_ADDRESS
          BCTL_STATE: SRC.SRC.BCTL_STATE
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: BC_ACCOUNT
          - locationName: SRC
            nodeName: BCTL_ACCOUNTTYPE
          - locationName: SRC
            nodeName: BC_PARENTACCT
          - locationName: SRC
            nodeName: BCTL_BILLINGLEVEL
          - locationName: SRC
            nodeName: BCTL_CUSTOMERSERVICETIER
          - locationName: SRC
            nodeName: BC_SECURITYZONE
          - locationName: SRC
            nodeName: BCTL_DELINQUENCYSTATUS
          - locationName: SRC
            nodeName: BCTL_ACCOUNTSEGMENT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACTROLE
          - locationName: SRC
            nodeName: BCTL_ACCOUNTROLE
          - locationName: SRC
            nodeName: BC_CONTACT
          - locationName: SRC
            nodeName: BC_ADDRESS
          - locationName: SRC
            nodeName: BCTL_STATE
        join:
          joinCondition: |
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} BC_ACCOUNT
            -- Join 1: BC_ACCOUNT to BCTL_ACCOUNTTYPE
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} BCTL_ACCOUNTTYPE
              ON BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
            -- Join 2: BC_ACCOUNT to BC_PARENTACCT
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} BC_PARENTACCT
              ON BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
            -- Join 3: BC_ACCOUNT to BCTL_BILLINGLEVEL
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} BCTL_BILLINGLEVEL
              ON BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
            -- Join 4: BC_ACCOUNT to BCTL_CUSTOMERSERVICETIER
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} BCTL_CUSTOMERSERVICETIER
              ON BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
            -- Join 5: BC_ACCOUNT to BC_SECURITYZONE
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} BC_SECURITYZONE
              ON BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
            -- Join 6: BC_ACCOUNT to BCTL_DELINQUENCYSTATUS
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} BCTL_DELINQUENCYSTATUS
              ON BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
            -- Join 7: BC_ACCOUNT to BCTL_ACCOUNTSEGMENT
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} BCTL_ACCOUNTSEGMENT
              ON BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
            -- Join 8: BC_ACCOUNT to INSUREDINFO (derived from BC_ACCOUNTCONTACT)
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} BC_ACCOUNTCONTACT
              ON BC_ACCOUNTCONTACT.INSUREDACCOUNTID = BC_ACCOUNT.ID
            -- Join 9: INSUREDINFO to BC_ACCOUNTCONTACTROLE
            INNER JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} BC_ACCOUNTCONTACTROLE
              ON BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
            -- Join 10: INSUREDINFO to BCTL_ACCOUNTROLE
            INNER JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} BCTL_ACCOUNTROLE
              ON BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE
              AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
            -- Join 11: INSUREDINFO to BC_CONTACT
            LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} BC_CONTACT
              ON BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
            -- Join 12: INSUREDINFO to BC_ADDRESS
            LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} BC_ADDRESS
              ON BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID
            -- Join 13: INSUREDINFO to BCTL_STATE
            LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} BCTL_STATE
              ON BCTL_STATE.ID = BC_ADDRESS.STATE
        name: SRC_JOIN_DIMBILLINGACCOUNT
        noLinkRefs: []
  name: SRC_JOIN_DIMBILLINGACCOUNT
  overrideSQL: false
  schema: SRC
  sqlType: Transform
  type: sql
  version: 1
  description: "Comprehensive join of all source tables for DimBillingAccount ETL. Includes 13 joins preserving SSIS execution order: BC_ACCOUNT as base, LEFT joins to lookup tables (ACCOUNTTYPE, PARENTACCT, BILLINGLEVEL, CUSTOMERSERVICETIER, SECURITYZONE, DELINQUENCYSTATUS, ACCOUNTSEGMENT), and INNER/LEFT joins for insured contact information chain (ACCOUNTCONTACT, ACCOUNTCONTACTROLE, ACCOUNTROLE, CONTACT, ADDRESS, STATE). Note: Join 14 (LOOKUP_INPUT to DIMBILLINGACCOUNT) is handled separately in the LOOKUP transformation component."

fileVersion: 1.0.0
id: join_dimbillingaccount
name: SRC_JOIN_DIMBILLINGACCOUNT
description: Join operations for DimBillingAccount package
type: Join

sources:
  - name: BC_ACCOUNT
    alias: BC_ACCOUNT
  - name: BCTL_ACCOUNTTYPE
    alias: BCTL_ACCOUNTTYPE
  - name: BC_PARENTACCT
    alias: BC_PARENTACCT
  - name: BCTL_BILLINGLEVEL
    alias: BCTL_BILLINGLEVEL
  - name: BCTL_CUSTOMERSERVICETIER
    alias: BCTL_CUSTOMERSERVICETIER
  - name: BC_SECURITYZONE
    alias: BC_SECURITYZONE
  - name: BCTL_DELINQUENCYSTATUS
    alias: BCTL_DELINQUENCYSTATUS
  - name: BCTL_ACCOUNTSEGMENT
    alias: BCTL_ACCOUNTSEGMENT
  - name: BC_ACCOUNTCONTACT
    alias: BC_ACCOUNTCONTACT
  - name: BC_ACCOUNTCONTACTROLE
    alias: BC_ACCOUNTCONTACTROLE
  - name: BCTL_ACCOUNTROLE
    alias: BCTL_ACCOUNTROLE
  - name: BC_CONTACT
    alias: BC_CONTACT
  - name: BC_ADDRESS
    alias: BC_ADDRESS
  - name: BCTL_STATE
    alias: BCTL_STATE
  - name: DIMBILLINGACCOUNT
    alias: DIMBILLINGACCOUNT

joins:
  - join_sequence: 1
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BCTL_ACCOUNTTYPE
    join_condition: BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
    description: Join BC_ACCOUNT with BCTL_ACCOUNTTYPE

  - join_sequence: 2
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BC_PARENTACCT
    join_condition: BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
    description: Join BC_ACCOUNT with BC_PARENTACCT

  - join_sequence: 3
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BCTL_BILLINGLEVEL
    join_condition: BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
    description: Join BC_ACCOUNT with BCTL_BILLINGLEVEL

  - join_sequence: 4
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BCTL_CUSTOMERSERVICETIER
    join_condition: BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
    description: Join BC_ACCOUNT with BCTL_CUSTOMERSERVICETIER

  - join_sequence: 5
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BC_SECURITYZONE
    join_condition: BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
    description: Join BC_ACCOUNT with BC_SECURITYZONE

  - join_sequence: 6
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BCTL_DELINQUENCYSTATUS
    join_condition: BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
    description: Join BC_ACCOUNT with BCTL_DELINQUENCYSTATUS

  - join_sequence: 7
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BCTL_ACCOUNTSEGMENT
    join_condition: BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
    description: Join BC_ACCOUNT with BCTL_ACCOUNTSEGMENT

  - join_sequence: 8
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: INSUREDINFO
    join_condition: INSUREDINFO.ACCOUNTID = BC_ACCOUNT.ID
    description: Join BC_ACCOUNT with INSUREDINFO (derived table)

  - join_sequence: 9
    join_type: INNER
    left_table: INSUREDINFO
    right_table: BC_ACCOUNTCONTACT
    join_condition: BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID
    description: Join INSUREDINFO with BC_ACCOUNTCONTACT

  - join_sequence: 10
    join_type: INNER
    left_table: INSUREDINFO
    right_table: BC_ACCOUNTCONTACTROLE
    join_condition: BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
    description: Join INSUREDINFO with BC_ACCOUNTCONTACTROLE

  - join_sequence: 11
    join_type: INNER
    left_table: INSUREDINFO
    right_table: BCTL_ACCOUNTROLE
    join_condition: BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
    description: Join INSUREDINFO with BCTL_ACCOUNTROLE with filter

  - join_sequence: 12
    join_type: LEFT
    left_table: INSUREDINFO
    right_table: BC_CONTACT
    join_condition: BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
    description: Join INSUREDINFO with BC_CONTACT

  - join_sequence: 13
    join_type: LEFT
    left_table: INSUREDINFO
    right_table: BC_ADDRESS
    join_condition: BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID
    description: Join INSUREDINFO with BC_ADDRESS

  - join_sequence: 14
    join_type: LEFT
    left_table: INSUREDINFO
    right_table: BCTL_STATE
    join_condition: BCTL_STATE.ID = BC_ADDRESS.STATE
    description: Join INSUREDINFO with BCTL_STATE

  - join_sequence: 15
    join_type: INNER
    left_table: LOOKUP_INPUT
    right_table: DIMBILLINGACCOUNT
    join_condition: LOOKUP_INPUT.PUBLICID = DIMBILLINGACCOUNT.PUBLICID
    description: Lookup join with DIMBILLINGACCOUNT

output:
  name: JOINED_DIMBILLINGACCOUNT
  description: Combined result of all join operations for DimBillingAccount

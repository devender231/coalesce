          - locationName: SRC
            nodeName: SRC_BC_ADDRESS
          - locationName: SRC
            nodeName: SRC_BCTL_STATE
        join:
          joinCondition: |
            FROM {{ ref('SRC', 'SRC_BC_ACCOUNT') }} SRC_BC_ACCOUNT
            LEFT JOIN {{ ref('SRC', 'SRC_BCTL_ACCOUNTTYPE') }} SRC_BCTL_ACCOUNTTYPE
              ON SRC_BC_ACCOUNT.ACCOUNTTYPE = SRC_BCTL_ACCOUNTTYPE.ID
            LEFT JOIN {{ ref('SRC', 'SRC_BC_PARENTACCT') }} SRC_BC_PARENTACCT
              ON SRC_BC_PARENTACCT.OWNERID = SRC_BC_ACCOUNT.ID
            LEFT JOIN {{ ref('SRC', 'SRC_BCTL_BILLINGLEVEL') }} SRC_BCTL_BILLINGLEVEL
              ON SRC_BC_ACCOUNT.BILLINGLEVEL = SRC_BCTL_BILLINGLEVEL.ID
            LEFT JOIN {{ ref('SRC', 'SRC_BCTL_CUSTOMERSERVICETIER') }} SRC_BCTL_CUSTOMERSERVICETIER
              ON SRC_BC_ACCOUNT.SERVICETIER = SRC_BCTL_CUSTOMERSERVICETIER.ID
            LEFT JOIN {{ ref('SRC', 'SRC_BC_SECURITYZONE') }} SRC_BC_SECURITYZONE
              ON SRC_BC_ACCOUNT.SECURITYZONEID = SRC_BC_SECURITYZONE.ID
            LEFT JOIN {{ ref('SRC', 'SRC_BCTL_DELINQUENCYSTATUS') }} SRC_BCTL_DELINQUENCYSTATUS
              ON SRC_BC_ACCOUNT.DELINQUENCYSTATUS = SRC_BCTL_DELINQUENCYSTATUS.ID
            LEFT JOIN {{ ref('SRC', 'SRC_BCTL_ACCOUNTSEGMENT') }} SRC_BCTL_ACCOUNTSEGMENT
              ON SRC_BC_ACCOUNT.SEGMENT = SRC_BCTL_ACCOUNTSEGMENT.ID
            LEFT JOIN (
              SELECT 
                BC_ACCOUNTCONTACT.ID as ACCOUNTID,
                BC_ACCOUNTCONTACT.INSUREDACCOUNTID,
                BC_ACCOUNTCONTACT.CONTACTID
              FROM {{ ref('SRC', 'SRC_BC_ACCOUNTCONTACT') }} BC_ACCOUNTCONTACT
              INNER JOIN {{ ref('SRC', 'SRC_BC_ACCOUNTCONTACTROLE') }} BC_ACCOUNTCONTACTROLE
                ON BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
              INNER JOIN {{ ref('SRC', 'SRC_BCTL_ACCOUNTROLE') }} BCTL_ACCOUNTROLE
                ON BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE 
                AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
            ) INSUREDINFO
              ON INSUREDINFO.ACCOUNTID = SRC_BC_ACCOUNT.ID
            LEFT JOIN {{ ref('SRC', 'SRC_BC_CONTACT') }} SRC_BC_CONTACT
              ON SRC_BC_CONTACT.ID = INSUREDINFO.CONTACTID
            LEFT JOIN {{ ref('SRC', 'SRC_BC_ADDRESS') }} SRC_BC_ADDRESS
              ON SRC_BC_ADDRESS.ID = SRC_BC_CONTACT.PRIMARYADDRESSID
            LEFT JOIN {{ ref('SRC', 'SRC_BCTL_STATE') }} SRC_BCTL_STATE
              ON SRC_BCTL_STATE.ID = SRC_BC_ADDRESS.STATE
        name: SRC_JOIN_DIMBILLINGACCOUNT
        noLinkRefs: []

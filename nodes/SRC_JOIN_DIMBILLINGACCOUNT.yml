name: SRC_JOIN_DIMBILLINGACCOUNT
type: join
config:
  description: "Joins all source tables for DimBillingAccount ETL process"
  joins:
    # Join 1: BC_ACCOUNT to BCTL_ACCOUNTTYPE
    - join_id: "JOIN_001"
      left_source: "SRC_BC_ACCOUNT"
      right_source: "SRC_BCTL_ACCOUNTTYPE"
      join_type: "LEFT"
      join_condition: "SRC_BC_ACCOUNT.ACCOUNTTYPE = SRC_BCTL_ACCOUNTTYPE.ID"
      output_columns:
        - "SRC_BC_ACCOUNT.*"
        - "SRC_BCTL_ACCOUNTTYPE.NAME AS ACCOUNTTYPE_NAME"
    
    # Join 2: BC_ACCOUNT to BC_PARENTACCT
    - join_id: "JOIN_002"
      left_source: "JOIN_001"
      right_source: "SRC_BC_PARENTACCT"
      join_type: "LEFT"
      join_condition: "SRC_BC_PARENTACCT.OWNERID = SRC_BC_ACCOUNT.ID"
      output_columns:
        - "JOIN_001.*"
        - "SRC_BC_PARENTACCT.FOREIGNENTITYID"
        - "SRC_BC_PARENTACCT.BEANVERSION AS PARENTACCT_BEANVERSION"
        - "SRC_BC_PARENTACCT.UPDATETIME AS PARENTACCT_UPDATETIME"
    
    # Join 3: BC_ACCOUNT to BCTL_BILLINGLEVEL
    - join_id: "JOIN_003"
      left_source: "JOIN_002"
      right_source: "SRC_BCTL_BILLINGLEVEL"
      join_type: "LEFT"
      join_condition: "SRC_BC_ACCOUNT.BILLINGLEVEL = SRC_BCTL_BILLINGLEVEL.ID"
      output_columns:
        - "JOIN_002.*"
        - "SRC_BCTL_BILLINGLEVEL.NAME AS BILLINGLEVEL_NAME"
    
    # Join 4: BC_ACCOUNT to BCTL_CUSTOMERSERVICETIER
    - join_id: "JOIN_004"
      left_source: "JOIN_003"
      right_source: "SRC_BCTL_CUSTOMERSERVICETIER"
      join_type: "LEFT"
      join_condition: "SRC_BC_ACCOUNT.SERVICETIER = SRC_BCTL_CUSTOMERSERVICETIER.ID"
      output_columns:
        - "JOIN_003.*"
        - "SRC_BCTL_CUSTOMERSERVICETIER.NAME AS SERVICETIER_NAME"
    
    # Join 5: BC_ACCOUNT to BC_SECURITYZONE
    - join_id: "JOIN_005"
      left_source: "JOIN_004"
      right_source: "SRC_BC_SECURITYZONE"
      join_type: "LEFT"
      join_condition: "SRC_BC_ACCOUNT.SECURITYZONEID = SRC_BC_SECURITYZONE.ID"
      output_columns:
        - "JOIN_004.*"
        - "SRC_BC_SECURITYZONE.NAME AS SECURITYZONE_NAME"
        - "SRC_BC_SECURITYZONE.BEANVERSION AS SECURITYZONE_BEANVERSION"
        - "SRC_BC_SECURITYZONE.UPDATETIME AS SECURITYZONE_UPDATETIME"
    
    # Join 6: BC_ACCOUNT to BCTL_DELINQUENCYSTATUS
    - join_id: "JOIN_006"
      left_source: "JOIN_005"
      right_source: "SRC_BCTL_DELINQUENCYSTATUS"
      join_type: "LEFT"
      join_condition: "SRC_BC_ACCOUNT.DELINQUENCYSTATUS = SRC_BCTL_DELINQUENCYSTATUS.ID"
      output_columns:
        - "JOIN_005.*"
        - "SRC_BCTL_DELINQUENCYSTATUS.NAME AS DELINQUENCYSTATUS_NAME"
    
    # Join 7: BC_ACCOUNT to BCTL_ACCOUNTSEGMENT
    - join_id: "JOIN_007"
      left_source: "JOIN_006"
      right_source: "SRC_BCTL_ACCOUNTSEGMENT"
      join_type: "LEFT"
      join_condition: "SRC_BC_ACCOUNT.SEGMENT = SRC_BCTL_ACCOUNTSEGMENT.ID"
      output_columns:
        - "JOIN_006.*"
        - "SRC_BCTL_ACCOUNTSEGMENT.NAME AS ACCOUNTSEGMENT_NAME"
    
    # Join 8: BC_ACCOUNT to INSUREDINFO (derived from BC_ACCOUNTCONTACT)
    - join_id: "JOIN_008"
      left_source: "JOIN_007"
      right_source: "SRC_BC_ACCOUNTCONTACT"
      join_type: "LEFT"
      join_condition: "SRC_BC_ACCOUNTCONTACT.INSUREDACCOUNTID = SRC_BC_ACCOUNT.ID"
      output_columns:
        - "JOIN_007.*"
        - "SRC_BC_ACCOUNTCONTACT.CONTACTID"
        - "SRC_BC_ACCOUNTCONTACT.ID AS ACCOUNTCONTACT_ID"
        - "SRC_BC_ACCOUNTCONTACT.BEANVERSION AS ACCOUNTCONTACT_BEANVERSION"
        - "SRC_BC_ACCOUNTCONTACT.UPDATETIME AS ACCOUNTCONTACT_UPDATETIME"
    
    # Join 9: INSUREDINFO to BC_ACCOUNTCONTACTROLE
    - join_id: "JOIN_009"
      left_source: "JOIN_008"
      right_source: "SRC_BC_ACCOUNTCONTACTROLE"
      join_type: "INNER"
      join_condition: "SRC_BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = SRC_BC_ACCOUNTCONTACT.ID"
      output_columns:
        - "JOIN_008.*"
        - "SRC_BC_ACCOUNTCONTACTROLE.ROLE"
        - "SRC_BC_ACCOUNTCONTACTROLE.ID AS ACCOUNTCONTACTROLE_ID"
        - "SRC_BC_ACCOUNTCONTACTROLE.BEANVERSION AS ACCOUNTCONTACTROLE_BEANVERSION"
        - "SRC_BC_ACCOUNTCONTACTROLE.UPDATETIME AS ACCOUNTCONTACTROLE_UPDATETIME"
    
    # Join 10: INSUREDINFO to BCTL_ACCOUNTROLE
    - join_id: "JOIN_010"
      left_source: "JOIN_009"
      right_source: "SRC_BCTL_ACCOUNTROLE"
      join_type: "INNER"
      join_condition: "SRC_BCTL_ACCOUNTROLE.ID = SRC_BC_ACCOUNTCONTACTROLE.ROLE AND SRC_BCTL_ACCOUNTROLE.TYPECODE = 'insured'"
      output_columns:
        - "JOIN_009.*"
        - "SRC_BCTL_ACCOUNTROLE.TYPECODE"
    
    # Join 11: INSUREDINFO to BC_CONTACT
    - join_id: "JOIN_011"
      left_source: "JOIN_010"
      right_source: "SRC_BC_CONTACT"
      join_type: "LEFT"
      join_condition: "SRC_BC_CONTACT.ID = SRC_BC_ACCOUNTCONTACT.CONTACTID"
      output_columns:
        - "JOIN_010.*"
        - "SRC_BC_CONTACT.FIRSTNAME"
        - "SRC_BC_CONTACT.LASTNAME"
        - "SRC_BC_CONTACT.PRIMARYADDRESSID"
        - "SRC_BC_CONTACT.BEANVERSION AS CONTACT_BEANVERSION"
        - "SRC_BC_CONTACT.UPDATETIME AS CONTACT_UPDATETIME"
    
    # Join 12: INSUREDINFO to BC_ADDRESS
    - join_id: "JOIN_012"
      left_source: "JOIN_011"
      right_source: "SRC_BC_ADDRESS"
      join_type: "LEFT"
      join_condition: "SRC_BC_ADDRESS.ID = SRC_BC_CONTACT.PRIMARYADDRESSID"
      output_columns:
        - "JOIN_011.*"
        - "SRC_BC_ADDRESS.ADDRESSLINE1"
        - "SRC_BC_ADDRESS.ADDRESSLINE2"
        - "SRC_BC_ADDRESS.ADDRESSLINE3"
        - "SRC_BC_ADDRESS.CITY"
        - "SRC_BC_ADDRESS.POSTALCODE"
        - "SRC_BC_ADDRESS.STATE"
        - "SRC_BC_ADDRESS.BEANVERSION AS ADDRESS_BEANVERSION"
        - "SRC_BC_ADDRESS.UPDATETIME AS ADDRESS_UPDATETIME"
    
    # Join 13: INSUREDINFO to BCTL_STATE
    - join_id: "JOIN_013"
      left_source: "JOIN_012"
      right_source: "SRC_BCTL_STATE"
      join_type: "LEFT"
      join_condition: "SRC_BCTL_STATE.ID = SRC_BC_ADDRESS.STATE"
      output_columns:
        - "JOIN_012.*"
        - "SRC_BCTL_STATE.NAME AS STATE_NAME"
    
    # Join 14: Final output becomes LOOKUP_INPUT
    - join_id: "JOIN_014_LOOKUP_INPUT"
      left_source: "JOIN_013"
      right_source: "DERIVED_COLUMN_OUTPUT"
      join_type: "PASSTHROUGH"
      join_condition: "N/A"
      output_columns:
        - "JOIN_013.*"
      description: "This output feeds into the LOOKUP transformation"
    
    # Join 15: LOOKUP_INPUT to DIMBILLINGACCOUNT (for lookup match)
    - join_id: "JOIN_015_LOOKUP"
      left_source: "LOOKUP_INPUT"
      right_source: "SRC_DIMBILLINGACCOUNT"
      join_type: "INNER"
      join_condition: "LOOKUP_INPUT.PUBLICID = SRC_DIMBILLINGACCOUNT.PUBLICID"
      output_columns:
        - "LOOKUP_INPUT.*"
        - "SRC_DIMBILLINGACCOUNT.BEANVERSION AS EDWBeanVersion"
      description: "Lookup join to retrieve existing BeanVersion from target table"

execution_order:
  - "JOIN_001"
  - "JOIN_002"
  - "JOIN_003"
  - "JOIN_004"
  - "JOIN_005"
  - "JOIN_006"
  - "JOIN_007"
  - "JOIN_008"
  - "JOIN_009"
  - "JOIN_010"
  - "JOIN_011"
  - "JOIN_012"
  - "JOIN_013"
  - "JOIN_014_LOOKUP_INPUT"
  - "JOIN_015_LOOKUP"

dependencies:
  - "SRC_BC_ACCOUNT"
  - "SRC_BCTL_ACCOUNTTYPE"
  - "SRC_BC_PARENTACCT"
  - "SRC_BCTL_BILLINGLEVEL"
  - "SRC_BCTL_CUSTOMERSERVICETIER"
  - "SRC_BC_SECURITYZONE"
  - "SRC_BCTL_DELINQUENCYSTATUS"
  - "SRC_BCTL_ACCOUNTSEGMENT"
  - "SRC_BC_ACCOUNTCONTACT"
  - "SRC_BC_ACCOUNTCONTACTROLE"
  - "SRC_BCTL_ACCOUNTROLE"
  - "SRC_BC_CONTACT"
  - "SRC_BC_ADDRESS"
  - "SRC_BCTL_STATE"
  - "SRC_DIMBILLINGACCOUNT"
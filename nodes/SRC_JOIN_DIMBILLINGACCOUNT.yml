fileVersion: 1
id: "SRC_JOIN_DIMBILLINGACCOUNT"
name: "SRC_JOIN_DIMBILLINGACCOUNT"
description: "Join all source tables for DimBillingAccount ETL"
type: "Join"
config:
  database: "${database}"
  schema: "${schema}"
  tags:
    - "SSIS_MIGRATION"
    - "JOIN"
    - "DIMBILLINGACCOUNT"
sources:
  - name: "BC_ACCOUNT"
    type: "source"
  - name: "BCTL_ACCOUNTTYPE"
    type: "source"
  - name: "BC_PARENTACCT"
    type: "source"
  - name: "BCTL_BILLINGLEVEL"
    type: "source"
  - name: "BCTL_CUSTOMERSERVICETIER"
    type: "source"
  - name: "BC_SECURITYZONE"
    type: "source"
  - name: "BCTL_DELINQUENCYSTATUS"
    type: "source"
  - name: "BCTL_ACCOUNTSEGMENT"
    type: "source"
  - name: "BC_ACCOUNTCONTACT"
    type: "source"
  - name: "BC_ACCOUNTCONTACTROLE"
    type: "source"
  - name: "BCTL_ACCOUNTROLE"
    type: "source"
  - name: "BC_CONTACT"
    type: "source"
  - name: "BC_ADDRESS"
    type: "source"
  - name: "BCTL_STATE"
    type: "source"
  - name: "DIMBILLINGACCOUNT"
    type: "source"
joinLogic: |
  -- Join 1: BC_ACCOUNT with BCTL_ACCOUNTTYPE
  SELECT
    BC_ACCOUNT.*,
    BCTL_ACCOUNTTYPE.NAME AS ACCOUNTTYPE_NAME
  FROM BC_ACCOUNT
  LEFT JOIN BCTL_ACCOUNTTYPE
    ON BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
  
  -- Join 2: BC_ACCOUNT with BC_PARENTACCT
  LEFT JOIN BC_PARENTACCT
    ON BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
  
  -- Join 3: BC_ACCOUNT with BCTL_BILLINGLEVEL
  LEFT JOIN BCTL_BILLINGLEVEL
    ON BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
  
  -- Join 4: BC_ACCOUNT with BCTL_CUSTOMERSERVICETIER
  LEFT JOIN BCTL_CUSTOMERSERVICETIER
    ON BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
  
  -- Join 5: BC_ACCOUNT with BC_SECURITYZONE
  LEFT JOIN BC_SECURITYZONE
    ON BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
  
  -- Join 6: BC_ACCOUNT with BCTL_DELINQUENCYSTATUS
  LEFT JOIN BCTL_DELINQUENCYSTATUS
    ON BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
  
  -- Join 7: BC_ACCOUNT with BCTL_ACCOUNTSEGMENT
  LEFT JOIN BCTL_ACCOUNTSEGMENT
    ON BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
  
  -- Join 8: BC_ACCOUNT with INSUREDINFO (derived from BC_ACCOUNTCONTACT)
  LEFT JOIN (
    SELECT
      BC_ACCOUNTCONTACT.INSUREDACCOUNTID AS ACCOUNTID,
      BC_ACCOUNTCONTACT.ID AS ACCOUNTCONTACT_ID,
      BC_ACCOUNTCONTACT.CONTACTID
    FROM BC_ACCOUNTCONTACT
  ) AS INSUREDINFO
    ON INSUREDINFO.ACCOUNTID = BC_ACCOUNT.ID
  
  -- Join 9: INSUREDINFO with BC_ACCOUNTCONTACT (INNER)
  INNER JOIN BC_ACCOUNTCONTACT
    ON BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID
  
  -- Join 10: INSUREDINFO with BC_ACCOUNTCONTACTROLE (INNER)
  INNER JOIN BC_ACCOUNTCONTACTROLE
    ON BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
  
  -- Join 11: INSUREDINFO with BCTL_ACCOUNTROLE (INNER)
  INNER JOIN BCTL_ACCOUNTROLE
    ON BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE
    AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
  
  -- Join 12: INSUREDINFO with BC_CONTACT (LEFT)
  LEFT JOIN BC_CONTACT
    ON BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
  
  -- Join 13: INSUREDINFO with BC_ADDRESS (LEFT)
  LEFT JOIN BC_ADDRESS
    ON BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID
  
  -- Join 14: INSUREDINFO with BCTL_STATE (LEFT)
  LEFT JOIN BCTL_STATE
    ON BCTL_STATE.ID = BC_ADDRESS.STATE
columns:

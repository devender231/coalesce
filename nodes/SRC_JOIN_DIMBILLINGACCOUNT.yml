name: SRC_JOIN_DIMBILLINGACCOUNT
type: join
description: Joins all source tables for DimBillingAccount ETL process
sources:
  - SRC_BC_ACCOUNT
  - SRC_BCTL_ACCOUNTTYPE
  - SRC_BC_PARENTACCT
  - SRC_BCTL_BILLINGLEVEL
  - SRC_BCTL_CUSTOMERSERVICETIER
  - SRC_BC_SECURITYZONE
  - SRC_BCTL_DELINQUENCYSTATUS
  - SRC_BCTL_ACCOUNTSEGMENT
  - SRC_BC_ACCOUNTCONTACT
  - SRC_BC_ACCOUNTCONTACTROLE
  - SRC_BCTL_ACCOUNTROLE
  - SRC_BC_CONTACT
  - SRC_BC_ADDRESS
  - SRC_BCTL_STATE
  - SRC_DIMBILLINGACCOUNT

joins:
  - join_order: 1
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BCTL_ACCOUNTTYPE
    join_type: LEFT
    condition: BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
    description: Join BC_ACCOUNT with BCTL_ACCOUNTTYPE to get account type name

  - join_order: 2
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BC_PARENTACCT
    join_type: LEFT
    condition: BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
    description: Join BC_ACCOUNT with BC_PARENTACCT to get parent account information

  - join_order: 3
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BCTL_BILLINGLEVEL
    join_type: LEFT
    condition: BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
    description: Join BC_ACCOUNT with BCTL_BILLINGLEVEL to get billing level name

  - join_order: 4
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BCTL_CUSTOMERSERVICETIER
    join_type: LEFT
    condition: BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
    description: Join BC_ACCOUNT with BCTL_CUSTOMERSERVICETIER to get service tier name

  - join_order: 5
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BC_SECURITYZONE
    join_type: LEFT
    condition: BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
    description: Join BC_ACCOUNT with BC_SECURITYZONE to get security zone name

  - join_order: 6
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BCTL_DELINQUENCYSTATUS
    join_type: LEFT
    condition: BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
    description: Join BC_ACCOUNT with BCTL_DELINQUENCYSTATUS to get delinquency status name

  - join_order: 7
    left_table: SRC_BC_ACCOUNT
    right_table: SRC_BCTL_ACCOUNTSEGMENT
    join_type: LEFT
    condition: BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
    description: Join BC_ACCOUNT with BCTL_ACCOUNTSEGMENT to get account segment name

  - join_order: 8
    left_table: SRC_BC_ACCOUNT
    right_table: INSUREDINFO
    join_type: LEFT
    condition: INSUREDINFO.ACCOUNTID = BC_ACCOUNT.ID
    description: Join BC_ACCOUNT with INSUREDINFO subquery to get insured information

  - join_order: 9
    left_table: INSUREDINFO
    right_table: SRC_BC_ACCOUNTCONTACT
    join_type: INNER
    condition: BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID
    description: Join INSUREDINFO with BC_ACCOUNTCONTACT to get account contact details

  - join_order: 10
    left_table: INSUREDINFO
    right_table: SRC_BC_ACCOUNTCONTACTROLE
    join_type: INNER
    condition: BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
    description: Join INSUREDINFO with BC_ACCOUNTCONTACTROLE to get contact role information

  - join_order: 11
    left_table: INSUREDINFO
    right_table: SRC_BCTL_ACCOUNTROLE
    join_type: INNER
    condition: BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
    description: Join INSUREDINFO with BCTL_ACCOUNTROLE to filter insured role type

  - join_order: 12
    left_table: INSUREDINFO
    right_table: SRC_BC_CONTACT
    join_type: LEFT
    condition: BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
    description: Join INSUREDINFO with BC_CONTACT to get contact details

  - join_order: 13
    left_table: INSUREDINFO
    right_table: SRC_BC_ADDRESS
    join_type: LEFT
    condition: BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID
    description: Join INSUREDINFO with BC_ADDRESS to get primary address details

  - join_order: 14
    left_table: INSUREDINFO
    right_table: SRC_BCTL_STATE
    join_type: LEFT
    condition: BCTL_STATE.ID = BC_ADDRESS.STATE
    description: Join INSUREDINFO with BCTL_STATE to get state name

  - join_order: 15
    left_table: LOOKUP_INPUT
    right_table: SRC_DIMBILLINGACCOUNT
    join_type: INNER
    condition: LOOKUP_INPUT.PUBLICID = DIMBILLINGACCOUNT.PUBLICID
    description: Join lookup input with DIMBILLINGACCOUNT for lookup transformation

output_columns:
  - BC_ACCOUNT.ACCOUNTNUMBER
  - BC_ACCOUNT.ACCOUNTNAME
  - BC_ACCOUNT.PUBLICID
  - BC_ACCOUNT.ID
  - BC_ACCOUNT.BEANVERSION
  - BC_ACCOUNT.RETIRED
  - BC_ACCOUNT.CREATETIME
  - BC_ACCOUNT.UPDATETIME
  - BC_ACCOUNT.CLOSEDATE
  - BC_ACCOUNT.FIRSTTWICEPERMTHINVOICEDOM
  - BC_ACCOUNT.SECONDTWICEPERMTHINVOICEDOM
  - BCTL_ACCOUNTTYPE.NAME as ACCOUNTTYPE_NAME
  - BCTL_BILLINGLEVEL.NAME as BILLINGLEVEL_NAME
  - BCTL_CUSTOMERSERVICETIER.NAME as SERVICETIER_NAME
  - BC_SECURITYZONE.NAME as SECURITYZONE_NAME
  - BCTL_DELINQUENCYSTATUS.NAME as DELINQUENCYSTATUS_NAME
  - BCTL_ACCOUNTSEGMENT.NAME as SEGMENT_NAME
  - BC_CONTACT.FIRSTNAME
  - BC_CONTACT.LASTNAME
  - BC_ADDRESS.ADDRESSLINE1
  - BC_ADDRESS.ADDRESSLINE2
  - BC_ADDRESS.ADDRESSLINE3
  - BC_ADDRESS.CITY
  - BC_ADDRESS.POSTALCODE
  - BCTL_STATE.NAME as STATE_NAME
  - BC_PARENTACCT.FOREIGNENTITYID as PARENT_ACCOUNT_ID
fileVersion: 1
id: J1
name: SRC_JOIN_DIMBILLINGACCOUNT
operation:
  config:
    insertStrategy: INSERT
    postSQL: ""
    preSQL: ""
    testsEnabled: true
    truncateBefore: true
  database: ""
  deployEnabled: true
  description: "Joins all source tables for DimBillingAccount ETL"
  isMultisource: true
  locationName: SRC
  materializationType: view
  metadata:
    appliedNodeTests: []
    columns: []
    cteString: ""
    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          BC_ACCOUNT: S1
          BCTL_ACCOUNTTYPE: S2
          BC_PARENTACCT: S3
          BCTL_BILLINGLEVEL: S4
          BCTL_CUSTOMERSERVICETIER: S5
          BC_SECURITYZONE: S6
          BCTL_DELINQUENCYSTATUS: S7
          BCTL_ACCOUNTSEGMENT: S8
          BC_ACCOUNTCONTACT: S9
          BC_ACCOUNTCONTACTROLE: S10
          BCTL_ACCOUNTROLE: S11
          BC_CONTACT: S12
          BC_ADDRESS: S13
          BCTL_STATE: S14
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SRC_BC_ACCOUNT
          - locationName: SRC
            nodeName: SRC_BCTL_ACCOUNTTYPE
          - locationName: SRC
            nodeName: SRC_BC_PARENTACCT
          - locationName: SRC
            nodeName: SRC_BCTL_BILLINGLEVEL
          - locationName: SRC
            nodeName: SRC_BCTL_CUSTOMERSERVICETIER
          - locationName: SRC
            nodeName: SRC_BC_SECURITYZONE
          - locationName: SRC
            nodeName: SRC_BCTL_DELINQUENCYSTATUS
          - locationName: SRC
            nodeName: SRC_BCTL_ACCOUNTSEGMENT
          - locationName: SRC
            nodeName: SRC_BC_ACCOUNTCONTACT
          - locationName: SRC
            nodeName: SRC_BC_ACCOUNTCONTACTROLE
          - locationName: SRC
            nodeName: SRC_BCTL_ACCOUNTROLE
          - locationName: SRC
            nodeName: SRC_BC_CONTACT
          - locationName: SRC
            nodeName: SRC_BC_ADDRESS
          - locationName: SRC
            nodeName: SRC_BCTL_STATE
        join: |
          FROM {{ ref('SRC', 'SRC_BC_ACCOUNT') }} BC_ACCOUNT
          LEFT JOIN {{ ref('SRC', 'SRC_BCTL_ACCOUNTTYPE') }} BCTL_ACCOUNTTYPE
            ON BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
          LEFT JOIN {{ ref('SRC', 'SRC_BC_PARENTACCT') }} BC_PARENTACCT
            ON BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
          LEFT JOIN {{ ref('SRC', 'SRC_BCTL_BILLINGLEVEL') }} BCTL_BILLINGLEVEL
            ON BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
          LEFT JOIN {{ ref('SRC', 'SRC_BCTL_CUSTOMERSERVICETIER') }} BCTL_CUSTOMERSERVICETIER
            ON BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
          LEFT JOIN {{ ref('SRC', 'SRC_BC_SECURITYZONE') }} BC_SECURITYZONE
            ON BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
          LEFT JOIN {{ ref('SRC', 'SRC_BCTL_DELINQUENCYSTATUS') }} BCTL_DELINQUENCYSTATUS
            ON BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
          LEFT JOIN {{ ref('SRC', 'SRC_BCTL_ACCOUNTSEGMENT') }} BCTL_ACCOUNTSEGMENT
            ON BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
          LEFT JOIN (
            SELECT 
              BC_ACCOUNTCONTACT.INSUREDACCOUNTID AS ACCOUNTID,
              BC_ACCOUNTCONTACT.ID AS ACCOUNTCONTACTID,
              BC_ACCOUNTCONTACT.CONTACTID,
              BC_ACCOUNTCONTACTROLE.ROLE,
              BCTL_ACCOUNTROLE.TYPECODE
            FROM {{ ref('SRC', 'SRC_BC_ACCOUNTCONTACT') }} BC_ACCOUNTCONTACT
            INNER JOIN {{ ref('SRC', 'SRC_BC_ACCOUNTCONTACTROLE') }} BC_ACCOUNTCONTACTROLE
              ON BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
            INNER JOIN {{ ref('SRC', 'SRC_BCTL_ACCOUNTROLE') }} BCTL_ACCOUNTROLE
              ON BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE
              AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
          ) INSUREDINFO
            ON INSUREDINFO.ACCOUNTID = BC_ACCOUNT.ID
          LEFT JOIN {{ ref('SRC', 'SRC_BC_CONTACT') }} BC_CONTACT
            ON BC_CONTACT.ID = INSUREDINFO.CONTACTID
          LEFT JOIN {{ ref('SRC', 'SRC_BC_ADDRESS') }} BC_ADDRESS
            ON BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID
          LEFT JOIN {{ ref('SRC', 'SRC_BCTL_STATE') }} BCTL_STATE
            ON BCTL_STATE.ID = BC_ADDRESS.STATE
        name: SRC_JOIN_DIMBILLINGACCOUNT
        noLinkRefs: []
  name: SRC_JOIN_DIMBILLINGACCOUNT
  overrideSQL: false
  schema: ""
  sqlType: Stage
  type: sql
  version: 1
type: Node
    cteString: ""
    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          SRC_BC_ACCOUNT: ACC
          SRC_BCTL_ACCOUNTTYPE: ACCT
          SRC_BC_PARENTACCT: PARENT
          SRC_BCTL_BILLINGLEVEL: BILL
          SRC_BCTL_CUSTOMERSERVICETIER: CST
          SRC_BC_SECURITYZONE: SZ
          SRC_BCTL_DELINQUENCYSTATUS: DS
          SRC_BCTL_ACCOUNTSEGMENT: ASEG
          SRC_BC_ACCOUNTCONTACT: ACCTC
          SRC_BC_ACCOUNTCONTACTROLE: ACCTR
          SRC_BCTL_ACCOUNTROLE: AR
          SRC_BC_CONTACT: CONT
          SRC_BC_ADDRESS: ADDR
          SRC_BCTL_STATE: ST
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: BC_ACCOUNT
          - locationName: SRC
            nodeName: BCTL_ACCOUNTTYPE
          - locationName: SRC
            nodeName: BC_PARENTACCT
          - locationName: SRC
            nodeName: BCTL_BILLINGLEVEL
          - locationName: SRC
            nodeName: BCTL_CUSTOMERSERVICETIER
          - locationName: SRC
            nodeName: BC_SECURITYZONE
          - locationName: SRC
            nodeName: BCTL_DELINQUENCYSTATUS
          - locationName: SRC
            nodeName: BCTL_ACCOUNTSEGMENT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACTROLE
          - locationName: SRC
            nodeName: BCTL_ACCOUNTROLE
          - locationName: SRC
            nodeName: BC_CONTACT
          - locationName: SRC
            nodeName: BC_ADDRESS
          - locationName: SRC
            nodeName: BCTL_STATE
        join:
          joinCondition: |-
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} ACC
            -- Join 1: BC_ACCOUNT to BCTL_ACCOUNTTYPE (LEFT)
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} ACCT
              ON ACC.ACCOUNTTYPEID = ACCT.ID
            -- Join 2: BC_ACCOUNT to BC_PARENTACCT (LEFT)
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} PARENT
              ON PARENT.ACCOUNTID = ACC.ACCOUNTID
            -- Join 3: BC_ACCOUNT to BCTL_BILLINGLEVEL (LEFT)
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} BILL
              ON ACC.BILLINGLEVELID = BILL.ID
            -- Join 4: BC_ACCOUNT to BCTL_CUSTOMERSERVICETIER (LEFT)
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} CST
              ON ACC.CUSTOMERSERVICETIERID = CST.ID
            -- Join 5: BC_ACCOUNT to BC_SECURITYZONE (LEFT)
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} SZ
              ON ACC.SECURITYZONEID = SZ.ID
            -- Join 6: BC_ACCOUNT to BCTL_DELINQUENCYSTATUS (LEFT)
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} DS
              ON ACC.DELINQUENCYSTATUSID = DS.ID
            -- Join 7: BC_ACCOUNT to BCTL_ACCOUNTSEGMENT (LEFT)
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} ASEG
              ON ACC.ACCOUNTSEGMENTID = ASEG.ID
            -- Join 8-14: INSUREDINFO subquery joins (LEFT JOIN to get insured contact info)
            LEFT JOIN (
              SELECT 
                ACCTC.INSUREDACCOUNTID,
                CONT.FIRSTNAME,
                CONT.LASTNAME,
                ADDR.ADDRESSLINE1,
                ADDR.ADDRESSLINE2,
                ADDR.CITY,
                ADDR.POSTALCODE,
                ST.NAME AS STATE
              FROM {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} ACCTC
              -- Join 9: BC_ACCOUNTCONTACT to BC_ACCOUNTCONTACTROLE (INNER)
              INNER JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} ACCTR
                ON ACCTR.ACCOUNTCONTACTID = ACCTC.ID
              -- Join 10: BC_ACCOUNTCONTACTROLE to BCTL_ACCOUNTROLE (INNER)
              INNER JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} AR
                ON AR.ID = ACCTR.ROLE
                AND AR.TYPECODE = 'insured'
              -- Join 11: BC_ACCOUNTCONTACT to BC_CONTACT (LEFT)
              LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} CONT
                ON CONT.ID = ACCTC.CONTACTID
              -- Join 12: BC_CONTACT to BC_ADDRESS (LEFT)
              LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} ADDR
                ON ADDR.ID = CONT.PRIMARYADDRESSID
              -- Join 13: BC_ADDRESS to BCTL_STATE (LEFT)
              LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} ST
                ON ST.ID = ADDR.STATE
            ) INSUREDINFO
              ON INSUREDINFO.INSUREDACCOUNTID = ACC.ACCOUNTID
        name: SRC_JOIN_DIMBILLINGACCOUNT
        noLinkRefs: []
  name: SRC_JOIN_DIMBILLINGACCOUNT
  overrideSQL: false
  schema: ""
  sqlType: Transform
  type: sql
  version: 1
---
name: SRC_TRANSFORMATION_04_CONDITIONAL_SPLIT
type: transformation
transformation_type: CONDITIONAL_SPLIT
execution_order: 4
description: Routes rows based on whether BeanVersion matches EDWBeanVersion

source:
  type: upstream_transformation
  name: SRC_TRANSFORMATION_03_LOOKUP_BEANVERSION
  description: Output from lookup transformation with EDWBeanVersion

transformation_logic:
  operation: SPLIT_ROWS_BY_CONDITION
  split_conditions:
    - output_name: UNCHANGED_ROWS
      condition: BeanVersion == EDWBeanVersion
      description: Rows where BeanVersion matches - no changes needed
      order: 1
    
    - output_name: UPDATE_ROWS
      condition: BeanVersion != EDWBeanVersion AND EDWBeanVersion IS NOT NULL
      description: Rows where BeanVersion differs - needs update
      order: 2
    
    - output_name: INSERT_ROWS
      condition: EDWBeanVersion IS NULL
      description: Rows with no match in lookup - new inserts
      order: 3
      default_output: true

output:
  split_outputs:
    - name: UNCHANGED_ROWS
      condition: BeanVersion == EDWBeanVersion
      row_disposition: NO_ACTION
    
    - name: UPDATE_ROWS
      condition: BeanVersion != EDWBeanVersion
      row_disposition: UPDATE_DIMENSION
    
    - name: INSERT_ROWS
      condition: LOOKUP_NO_MATCH
      row_disposition: INSERT_DIMENSION

upstream_dependencies:
  - SRC_TRANSFORMATION_03_LOOKUP_BEANVERSION

metadata:
  package_name: EDW_BC_Load_DimBillingAccount
  component_type: Conditional Split
  execution_sequence: 4
  purpose: Route rows to appropriate processing path based on change detection
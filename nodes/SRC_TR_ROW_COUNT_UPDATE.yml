name: SRC_TR_ROW_COUNT_UPDATE
type: transformation
transformation_type: ROW_COUNT
execution_order: 7
description: Counts update rows where BeanVersion differs from EDWBeanVersion

input:
  source: SRC_TR_CONDITIONAL_SPLIT
  output_path: UPDATE_ROWS
  description: Input from conditional split - update rows path

transformation_logic:
  operation: COUNT_ROWS
  variable_name: User::UpdateCount
  description: Stores the count of rows to be updated (BeanVersion different from EDWBeanVersion)
  filter_condition: "!ISNULL(EDWBeanVersion) && BeanVersion != EDWBeanVersion"
  
output:
  type: pass_through_to_target
  description: All changed rows are passed to target for UPDATE operation
  row_count_variable: User::UpdateCount
  destination: DIMBILLINGACCOUNT
  load_action: UPDATE
  
metadata:
  purpose: Audit and tracking of update row count
  variable_scope: Package
  variable_type: Integer
  scd_action: UPDATE
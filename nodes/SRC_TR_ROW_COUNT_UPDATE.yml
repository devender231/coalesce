# Transformation: Row Count Update Records
name: SRC_TR_ROW_COUNT_UPDATE
type: ROW_COUNT
description: Counts update rows where BeanVersion is different from EDWBeanVersion
execution_order: 8

input:
  source: SRC_TR_CONDITIONAL_SPLIT_SCD
  source_output: UPDATE_ROWS
  description: Records where BeanVersion differs - changes detected

transformation_logic:
  operation: COUNT_ROWS
  count_variable: User::UpdateCount
  description: Captures count of records requiring updates for audit reporting

output:
  pass_through: true
  audit_variable: User::UpdateCount
  description: Update rows counted and ready for load
  destination: UPDATE_TO_DIMBILLINGACCOUNT

metadata:
  ssis_component: Row Count
  purpose: Audit count of update records for ETL monitoring
  scd_action: UPDATE
name: SRC_TR_ROW_COUNT_UPDATE
type: transformation
config:
  transformation_type: row_count
  description: Counts update rows (BeanVersion different)
  execution_order: 7
input:
  source: SRC_TR_CONDITIONAL_SPLIT_BEANVERSION
  path: update
  description: Input from conditional split update path
logic:
  operation: COUNT
  variable_name: User::UpdateCount
  count_type: update_rows
  filter: "BEANVERSION != EDWBeanVersion AND EDWBeanVersion IS NOT NULL"
output:
  variable: UpdateCount
  data_type: INTEGER
  description: Count of rows requiring update due to BeanVersion change
dependencies:
  - SRC_TR_CONDITIONAL_SPLIT_BEANVERSION
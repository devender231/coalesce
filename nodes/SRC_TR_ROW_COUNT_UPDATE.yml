name: SRC_TR_ROW_COUNT_UPDATE
type: row_count
description: Counts update rows (BeanVersion different)

input:
  source: SRC_TR_CONDITIONAL_SPLIT
  source_path: UPDATE_ROWS
  
transformation:
  type: ROW_COUNT
  operation: COUNT_ROWS
  output_variable: User::UpdateCount
  
logic:
  description: Counts rows where BeanVersion differs from EDWBeanVersion (updates needed)
  variable_assignment: User::UpdateCount = COUNT(*)
  condition: BEANVERSION != EDWBeanVersion AND !ISNULL(EDWBeanVersion)

output:
  pass_through: true
  row_count_variable: User::UpdateCount
  destination: DIMBILLINGACCOUNT
  load_type: UPDATE

execution_order: 8

dependencies:
  - SRC_TR_CONDITIONAL_SPLIT
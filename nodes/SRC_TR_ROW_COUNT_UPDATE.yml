name: SRC_TR_ROW_COUNT_UPDATE
type: ROW_COUNT
execution_order: 7
description: Counts update rows where BeanVersion differs from EDW BeanVersion

input:
  source: SRC_TR_CONDITIONAL_SPLIT
  source_output: UPDATE_ROWS
  description: Rows routed to update path from conditional split

transformation_logic:
  operation: COUNT_ROWS
  variable_name: User::UpdateCount
  description: Stores count of existing rows requiring updates in DIMBILLINGACCOUNT

output:
  name: UPDATE_ROW_COUNT
  variable: User::UpdateCount
  pass_through: true
  description: Counts and passes update rows to target for loading
  target_table: DIMBILLINGACCOUNT
  load_type: UPDATE
name: SRC_TR_ROW_COUNT_UPDATE
type: transformation
transformation_type: ROW_COUNT
description: Counts update rows (BeanVersion different)
execution_order: 7

input:
  source: SRC_TR_CONDITIONAL_SPLIT_BEANVERSION
  source_output: UPDATE_OUTPUT
  description: Rows where BeanVersion differs from target

transformation_logic:
  operation: COUNT_ROWS
  output_variable: User::UpdateCount
  description: Counts records that need to be updated

output:
  name: UPDATE_COUNTED
  pass_through: true
  metadata:
    row_count_variable: User::UpdateCount
    action: UPDATE_TARGET
  target_destination: DIMBILLINGACCOUNT

          SRC_BCTL_BILLINGLEVEL: billing
          SRC_BCTL_CUSTOMERSERVICETIER: tier
          SRC_BC_SECURITYZONE: seczone
          SRC_BCTL_DELINQUENCYSTATUS: delinq
          SRC_BCTL_ACCOUNTSEGMENT: segment
          SRC_BC_ACCOUNTCONTACT: acctcontact
          SRC_BC_ACCOUNTCONTACTROLE: contactrole
          SRC_BCTL_ACCOUNTROLE: role
          SRC_BC_CONTACT: contact
          SRC_BC_ADDRESS: address
          SRC_BCTL_STATE: state
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: BC_ACCOUNT
          - locationName: SRC
            nodeName: BCTL_ACCOUNTTYPE
          - locationName: SRC
            nodeName: BC_PARENTACCT
          - locationName: SRC
            nodeName: BCTL_BILLINGLEVEL
          - locationName: SRC
            nodeName: BCTL_CUSTOMERSERVICETIER
          - locationName: SRC
            nodeName: BC_SECURITYZONE
          - locationName: SRC
            nodeName: BCTL_DELINQUENCYSTATUS
          - locationName: SRC
            nodeName: BCTL_ACCOUNTSEGMENT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACTROLE
          - locationName: SRC
            nodeName: BCTL_ACCOUNTROLE
          - locationName: SRC
            nodeName: BC_CONTACT
          - locationName: SRC
            nodeName: BC_ADDRESS
          - locationName: SRC
            nodeName: BCTL_STATE
        join:
          joinCondition: |
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} acct
            -- Join 1: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTTYPE
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} accttype
              ON acct.ACCOUNTTYPE = accttype.ID
            -- Join 2: BC_ACCOUNT LEFT JOIN BC_PARENTACCT
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} parent
              ON parent.OWNERID = acct.ID
            -- Join 3: BC_ACCOUNT LEFT JOIN BCTL_BILLINGLEVEL
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} billing
              ON acct.BILLINGLEVEL = billing.ID
            -- Join 4: BC_ACCOUNT LEFT JOIN BCTL_CUSTOMERSERVICETIER
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} tier
              ON acct.SERVICETIER = tier.ID
            -- Join 5: BC_ACCOUNT LEFT JOIN BC_SECURITYZONE
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} seczone
              ON acct.SECURITYZONEID = seczone.ID
            -- Join 6: BC_ACCOUNT LEFT JOIN BCTL_DELINQUENCYSTATUS
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} delinq
              ON acct.DELINQUENCYSTATUS = delinq.ID
            -- Join 7: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTSEGMENT
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} segment
              ON acct.SEGMENT = segment.ID
            -- Join 8: BC_ACCOUNT LEFT JOIN INSUREDINFO (derived from BC_ACCOUNTCONTACT)
            -- Join 9: INSUREDINFO INNER JOIN BC_ACCOUNTCONTACT
            INNER JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} acctcontact
              ON acctcontact.INSUREDACCOUNTID = acct.ID
            -- Join 10: INSUREDINFO INNER JOIN BC_ACCOUNTCONTACTROLE
            INNER JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} contactrole
              ON contactrole.ACCOUNTCONTACTID = acctcontact.ID
            -- Join 11: INSUREDINFO INNER JOIN BCTL_ACCOUNTROLE
            INNER JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} role
              ON role.ID = contactrole.ROLE
              AND role.TYPECODE = 'insured'
            -- Join 12: INSUREDINFO LEFT JOIN BC_CONTACT
            LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} contact
              ON contact.ID = acctcontact.CONTACTID
            -- Join 13: INSUREDINFO LEFT JOIN BC_ADDRESS
            LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} address
              ON address.ID = contact.PRIMARYADDRESSID
            -- Join 14: INSUREDINFO LEFT JOIN BCTL_STATE
            LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} state
              ON state.ID = address.STATE
        name: SRC_JOIN_ALL_TABLES
        noLinkRefs: []

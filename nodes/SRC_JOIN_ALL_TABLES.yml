            LEFT JOIN {{ ref('WORK', 'SRC_BCTL_ACCOUNTSEGMENT') }} "AS"
              ON "ACC"."SEGMENT" = "AS"."ID"
            LEFT JOIN {{ ref('WORK', 'SRC_BC_ACCOUNTCONTACT') }} "ACCT"
              ON "ACCT"."INSUREDACCOUNTID" = "ACC"."ID"
            INNER JOIN {{ ref('WORK', 'SRC_BC_ACCOUNTCONTACTROLE') }} "ACR"
              ON "ACR"."ACCOUNTCONTACTID" = "ACCT"."ID"
            INNER JOIN {{ ref('WORK', 'SRC_BCTL_ACCOUNTROLE') }} "AR"
              ON "AR"."ID" = "ACR"."ROLE" AND "AR"."TYPECODE" = 'insured'
            LEFT JOIN {{ ref('WORK', 'SRC_BC_CONTACT') }} "CNT"
              ON "CNT"."ID" = "ACCT"."CONTACTID"
            LEFT JOIN {{ ref('WORK', 'SRC_BC_ADDRESS') }} "ADDR"
              ON "ADDR"."ID" = "CNT"."PRIMARYADDRESSID"
            LEFT JOIN {{ ref('WORK', 'SRC_BCTL_STATE') }} "ST"
              ON "ST"."ID" = "ADDR"."STATE"

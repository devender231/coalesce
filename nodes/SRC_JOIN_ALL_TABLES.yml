          SRC_DIMBILLINGACCOUNT: DIMBILLINGACCOUNT
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: BC_ACCOUNT
          - locationName: SRC
            nodeName: BCTL_ACCOUNTTYPE
          - locationName: SRC
            nodeName: BC_PARENTACCT
          - locationName: SRC
            nodeName: BCTL_BILLINGLEVEL
          - locationName: SRC
            nodeName: BCTL_CUSTOMERSERVICETIER
          - locationName: SRC
            nodeName: BC_SECURITYZONE
          - locationName: SRC
            nodeName: BCTL_DELINQUENCYSTATUS
          - locationName: SRC
            nodeName: BCTL_ACCOUNTSEGMENT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACTROLE
          - locationName: SRC
            nodeName: BCTL_ACCOUNTROLE
          - locationName: SRC
            nodeName: BC_CONTACT
          - locationName: SRC
            nodeName: BC_ADDRESS
          - locationName: SRC
            nodeName: BCTL_STATE
          - locationName: SRC
            nodeName: DIMBILLINGACCOUNT
        join:
          joinCondition: |
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} "SRC_BC_ACCOUNT"
            -- Join 1: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTTYPE
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} "SRC_BCTL_ACCOUNTTYPE"
              ON "SRC_BC_ACCOUNT".ACCOUNTTYPE = "SRC_BCTL_ACCOUNTTYPE".ID
            -- Join 2: BC_ACCOUNT LEFT JOIN BC_PARENTACCT
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} "SRC_BC_PARENTACCT"
              ON "SRC_BC_PARENTACCT".OWNERID = "SRC_BC_ACCOUNT".ID
            -- Join 3: BC_ACCOUNT LEFT JOIN BCTL_BILLINGLEVEL
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} "SRC_BCTL_BILLINGLEVEL"
              ON "SRC_BC_ACCOUNT".BILLINGLEVEL = "SRC_BCTL_BILLINGLEVEL".ID
            -- Join 4: BC_ACCOUNT LEFT JOIN BCTL_CUSTOMERSERVICETIER
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} "SRC_BCTL_CUSTOMERSERVICETIER"
              ON "SRC_BC_ACCOUNT".SERVICETIER = "SRC_BCTL_CUSTOMERSERVICETIER".ID
            -- Join 5: BC_ACCOUNT LEFT JOIN BC_SECURITYZONE
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} "SRC_BC_SECURITYZONE"
              ON "SRC_BC_ACCOUNT".SECURITYZONEID = "SRC_BC_SECURITYZONE".ID
            -- Join 6: BC_ACCOUNT LEFT JOIN BCTL_DELINQUENCYSTATUS
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} "SRC_BCTL_DELINQUENCYSTATUS"
              ON "SRC_BC_ACCOUNT".DELINQUENCYSTATUS = "SRC_BCTL_DELINQUENCYSTATUS".ID
            -- Join 7: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTSEGMENT
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} "SRC_BCTL_ACCOUNTSEGMENT"
              ON "SRC_BC_ACCOUNT".SEGMENT = "SRC_BCTL_ACCOUNTSEGMENT".ID
            -- Join 8: BC_ACCOUNT LEFT JOIN INSUREDINFO (derived from subsequent joins)
            LEFT JOIN (
              SELECT 
                "BC_ACCOUNTCONTACT".ACCOUNTID,
                "BC_CONTACT".ID AS CONTACT_ID,
                "BC_ADDRESS".ID AS ADDRESS_ID,
                "BCTL_STATE".ID AS STATE_ID
              FROM {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} "BC_ACCOUNTCONTACT"
              -- Join 9: INSUREDINFO INNER JOIN BC_ACCOUNTCONTACT (already in subquery)
              -- Join 10: INSUREDINFO INNER JOIN BC_ACCOUNTCONTACTROLE
              INNER JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} "BC_ACCOUNTCONTACTROLE"
                ON "BC_ACCOUNTCONTACTROLE".ACCOUNTCONTACTID = "BC_ACCOUNTCONTACT".ID
              -- Join 11: INSUREDINFO INNER JOIN BCTL_ACCOUNTROLE
              INNER JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} "BCTL_ACCOUNTROLE"
                ON "BCTL_ACCOUNTROLE".ID = "BC_ACCOUNTCONTACTROLE".ROLE
                AND "BCTL_ACCOUNTROLE".TYPECODE = 'insured'
              -- Join 12: INSUREDINFO LEFT JOIN BC_CONTACT
              LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} "BC_CONTACT"
                ON "BC_CONTACT".ID = "BC_ACCOUNTCONTACT".CONTACTID
              -- Join 13: INSUREDINFO LEFT JOIN BC_ADDRESS
              LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} "BC_ADDRESS"
                ON "BC_ADDRESS".ID = "BC_CONTACT".PRIMARYADDRESSID
              -- Join 14: INSUREDINFO LEFT JOIN BCTL_STATE
              LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} "BCTL_STATE"
                ON "BCTL_STATE".ID = "BC_ADDRESS".STATE
            ) "INSUREDINFO"
              ON "INSUREDINFO".ACCOUNTID = "SRC_BC_ACCOUNT".ID
            -- Join 15: LOOKUP_INPUT INNER JOIN DIMBILLINGACCOUNT (handled in lookup transformation)
        name: SRC_JOIN_ALL_TABLES
        noLinkRefs: []
  name: SRC_JOIN_ALL_TABLES
  overrideSQL: false
  schema: ""

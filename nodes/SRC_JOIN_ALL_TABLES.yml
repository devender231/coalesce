    cteString: ""
    enabledColumnTestIDs: []
    sourceMapping:
      # Main table BC_ACCOUNT
      - aliases:
          SRC_BC_ACCOUNT: BC_ACCOUNT
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: BC_ACCOUNT
        join:
          joinCondition: |
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} "BC_ACCOUNT"
        name: SRC_BC_ACCOUNT
        noLinkRefs: []
      # Join 1: BC_ACCOUNT LEFT JOIN BCTL_ACCOUNTTYPE
      - aliases:
          SRC_BCTL_ACCOUNTTYPE: BCTL_ACCOUNTTYPE
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: BCTL_ACCOUNTTYPE
        join:
          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} "BCTL_ACCOUNTTYPE"
            ON "BC_ACCOUNT"."ACCOUNTTYPE" = "BCTL_ACCOUNTTYPE"."ID"
        name: SRC_BCTL_ACCOUNTTYPE
        noLinkRefs: []
      # Join 2: BC_ACCOUNT LEFT JOIN BC_PARENTACCT
      - aliases:
          SRC_BC_PARENTACCT: BC_PARENTACCT
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: BC_PARENTACCT
        join:
          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} "BC_PARENTACCT"
            ON "BC_PARENTACCT"."OWNERID" = "BC_ACCOUNT"."ID"
        name: SRC_BC_PARENTACCT
        noLinkRefs: []
      # Join 3: BC_ACCOUNT LEFT JOIN BCTL_BILLINGLEVEL
      - aliases:
          SRC_BCTL_BILLINGLEVEL: BCTL_BILLINGLEVEL
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: BCTL_BILLINGLEVEL
        join:
          joinCondition: |
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} "BCTL_BILLINGLEVEL"
            ON "BC_ACCOUNT"."BILLINGLEVEL" = "BCTL_BILLINGLEVEL"."ID"
        name: SRC_BCTL_BILLINGLEVEL
        noLinkRefs: []
      # Join 4: BC_ACCOUNT LEFT JOIN BCTL_CUSTOMERSERVICETIER
      - aliases:
          SRC_BCTL_CUSTOMERSERVICETIER: BCTL_CUSTOMERSERVICETIER
        customSQL:
          customSQL: ""

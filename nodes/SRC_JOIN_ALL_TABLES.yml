              ON "ACC"."ACCOUNTTYPE" = "AT"."ID"
            LEFT JOIN {{ ref('WORK', 'SRC_BC_PARENTACCT') }} "PA"
              ON "PA"."OWNERID" = "ACC"."ID"
            LEFT JOIN {{ ref('WORK', 'SRC_BCTL_BILLINGLEVEL') }} "BL"
              ON "ACC"."BILLINGLEVEL" = "BL"."ID"
            LEFT JOIN {{ ref('WORK', 'SRC_BCTL_CUSTOMERSERVICETIER') }} "CST"
              ON "ACC"."SERVICETIER" = "CST"."ID"
            LEFT JOIN {{ ref('WORK', 'SRC_BC_SECURITYZONE') }} "SZ"
              ON "ACC"."SECURITYZONEID" = "SZ"."ID"
            LEFT JOIN {{ ref('WORK', 'SRC_BCTL_DELINQUENCYSTATUS') }} "DS"

          - locationName: SRC
            nodeName: BC_SECURITYZONE
          - locationName: SRC
            nodeName: BCTL_DELINQUENCYSTATUS
          - locationName: SRC
            nodeName: BCTL_ACCOUNTSEGMENT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACT
          - locationName: SRC
            nodeName: BC_ACCOUNTCONTACTROLE
          - locationName: SRC
            nodeName: BCTL_ACCOUNTROLE
          - locationName: SRC
            nodeName: BC_CONTACT
          - locationName: SRC
            nodeName: BC_ADDRESS
          - locationName: SRC
            nodeName: BCTL_STATE
        join:
          joinCondition: |
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} bc_acct
            
            -- Join 1: BC_ACCOUNT to BCTL_ACCOUNTTYPE (LEFT)
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} acct_type
              ON bc_acct.ACCOUNTTYPE = acct_type.ID
            
            -- Join 2: BC_ACCOUNT to BC_PARENTACCT (LEFT)
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} parent_acct
              ON parent_acct.OWNERID = bc_acct.ID
            
            -- Join 3: BC_ACCOUNT to BCTL_BILLINGLEVEL (LEFT)
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} bill_level
              ON bc_acct.BILLINGLEVEL = bill_level.ID
            
            -- Join 4: BC_ACCOUNT to BCTL_CUSTOMERSERVICETIER (LEFT)
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} svc_tier
              ON bc_acct.SERVICETIER = svc_tier.ID
            
            -- Join 5: BC_ACCOUNT to BC_SECURITYZONE (LEFT)
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} sec_zone
              ON bc_acct.SECURITYZONEID = sec_zone.ID
            
            -- Join 6: BC_ACCOUNT to BCTL_DELINQUENCYSTATUS (LEFT)
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} delinq_status
              ON bc_acct.DELINQUENCYSTATUS = delinq_status.ID
            
            -- Join 7: BC_ACCOUNT to BCTL_ACCOUNTSEGMENT (LEFT)
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} acct_segment
              ON bc_acct.SEGMENT = acct_segment.ID
            
            -- Join 8: BC_ACCOUNT to INSUREDINFO subquery (LEFT)
            LEFT JOIN (
              SELECT 
                acct_contact.INSUREDACCOUNTID as ACCOUNTID,
                contact.FIRSTNAME,
                contact.LASTNAME,
                address.ADDRESSLINE1,
                address.CITY,
                state.NAME as STATE_NAME
              FROM {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} acct_contact
              
              -- Join 9: INSUREDINFO to BC_ACCOUNTCONTACTROLE (INNER)
              INNER JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} acct_contact_role
                ON acct_contact_role.ACCOUNTCONTACTID = acct_contact.ID
              
              -- Join 10: INSUREDINFO to BCTL_ACCOUNTROLE (INNER)
              INNER JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} acct_role
                ON acct_role.ID = acct_contact_role.ROLE
                AND acct_role.TYPECODE = 'insured'
              
              -- Join 11: INSUREDINFO to BC_CONTACT (LEFT)
              LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} contact
                ON contact.ID = acct_contact.CONTACTID
              
              -- Join 12: INSUREDINFO to BC_ADDRESS (LEFT)
              LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} address
                ON address.ID = contact.PRIMARYADDRESSID
              
              -- Join 13: INSUREDINFO to BCTL_STATE (LEFT)
              LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} state
                ON state.ID = address.STATE
            ) insured_info
              ON insured_info.ACCOUNTID = bc_acct.ID
        name: JOIN_DimBillingAccount_All_Tables
        noLinkRefs: []

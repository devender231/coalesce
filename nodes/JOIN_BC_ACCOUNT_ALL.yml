    cteString: ""
    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          BC_ACCOUNT: BA
          BC_PARENTACCT: PA
          BCTL_ACCOUNTTYPE: ATY
          BCTL_BILLINGLEVEL: BL
          BCTL_CUSTOMERSERVICETIER: CST
          BC_SECURITYZONE: SZ
          BCTL_DELINQUENCYSTATUS: DS
          BCTL_ACCOUNTSEGMENT: ACSG
          BC_ACCOUNTCONTACT: ACC
          BC_ACCOUNTCONTACTROLE: ACR
          BCTL_ACCOUNTROLE: AR
          BC_CONTACT: CON
          BC_ADDRESS: ADDR
          BCTL_STATE: ST
        customSQL:
          customSQL: |
            SELECT
              CAST(BA.ACCOUNTNUMBER AS STRING) AS ACCOUNTNUMBER,
              BA.ACCOUNTNAME,
              BA.ACCOUNTTYPE,
              ATY.NAME AS ACCOUNTTYPE_NAME,
              BA.BILLINGLEVEL,
              BL.NAME AS BILLINGLEVEL_NAME,
              BA.SERVICETIER,
              CST.NAME AS SERVICETIER_NAME,
              BA.SECURITYZONEID,
              SZ.NAME AS SECURITYZONE_NAME,
              BA.SEGMENT,
              ACSG.NAME AS SEGMENT_NAME,
              BA.CLOSEDATE,
              BA.CREATETIME,
              BA.DELINQUENCYSTATUS,
              DS.NAME AS DELINQUENCYSTATUS_NAME,
              BA.FIRSTTWICEPERMTHINVOICEDOM,
              BA.SECONDTWICEPERMTHINVOICEDOM,
              BA.PUBLICID,
              BA.ID,
              BA.BEANVERSION,
              BA.RETIRED,
              BA.UPDATETIME,
              PA.FOREIGNENTITYID AS PARENTACCT_FOREIGNENTITYID,
              CON.FIRSTNAME AS INSURED_FIRSTNAME,
              CON.LASTNAME AS INSURED_LASTNAME,
              ADDR.ADDRESSLINE1 AS ADDRESS_LINE1,
              ADDR.ADDRESSLINE2 AS ADDRESS_LINE2,
              ADDR.ADDRESSLINE3 AS ADDRESS_LINE3,
              ADDR.CITY,
              ADDR.POSTALCODE,
              ADDR.STATE,
              ST.NAME AS STATE_NAME
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} BA
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} ATY
              ON BA.ACCOUNTTYPE = ATY.ID
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} PA
              ON PA.OWNERID = BA.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} BL
              ON BA.BILLINGLEVEL = BL.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} CST
              ON BA.SERVICETIER = CST.ID
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} SZ
              ON BA.SECURITYZONEID = SZ.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} DS
              ON BA.DELINQUENCYSTATUS = DS.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} ACSG
              ON BA.SEGMENT = ACSG.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} ACC
              ON ACC.INSUREDACCOUNTID = BA.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} ACR
              ON ACR.ACCOUNTCONTACTID = ACC.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} AR
              ON AR.ID = ACR.ROLE AND AR.TYPECODE = 'insured'
            LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} CON
              ON CON.ID = ACC.CONTACTID
            LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} ADDR
              ON ADDR.ID = CON.PRIMARYADDRESSID
            LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} ST
              ON ST.ID = ADDR.STATE

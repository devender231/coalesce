        join:
          joinCondition: |
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} BA
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} ATY
              ON BA.ACCOUNTTYPE = ATY.ID
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} PA
              ON PA.OWNERID = BA.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} BL
              ON BA.BILLINGLEVEL = BL.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} CST
              ON BA.SERVICETIER = CST.ID
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} SZ
              ON BA.SECURITYZONEID = SZ.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} DS
              ON BA.DELINQUENCYSTATUS = DS.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} ACSG
              ON BA.SEGMENT = ACSG.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} ACC
              ON ACC.INSUREDACCOUNTID = BA.ID
            LEFT JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} ACR
              ON ACR.ACCOUNTCONTACTID = ACC.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} AR
              ON AR.ID = ACR.ROLE AND AR.TYPECODE = 'insured'
            LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} CON
              ON CON.ID = ACC.CONTACTID
            LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} ADDR
              ON ADDR.ID = CON.PRIMARYADDRESSID
            LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} ST
              ON ST.ID = ADDR.STATE

fileVersion: 1
name: SRC_TR_PAYMENT_STATUS
operation:
  config:
    insertStrategy: INSERT
    selectDistinct: false
  database: PC_COALESCE_DB
  deployEnabled: true
  locationName: TARGET
  metadata:
    columns:
      - name: CUSTOMER_ID
        dataType: NUMBER(38,0)
        nullable: false
        description: Customer identifier
      - name: FULL_NAME
        dataType: VARCHAR(201)
        nullable: true
        description: Concatenated first and last name
      - name: EMAIL
        dataType: VARCHAR(255)
        nullable: true
        description: Customer email
      - name: ORDER_ID
        dataType: NUMBER(38,0)
        nullable: false
        description: Order identifier
      - name: ORDER_DATE
        dataType: DATE
        nullable: true
        description: Order date
      - name: ORDER_YEAR
        dataType: NUMBER(4,0)
        nullable: true
        description: Year extracted from order date
      - name: PRODUCT_NAME
        dataType: VARCHAR(255)
        nullable: true
        description: Product name
      - name: QUANTITY
        dataType: NUMBER(10,0)
        nullable: true
        description: Quantity ordered
      - name: PRICE
        dataType: NUMBER(18,2)
        nullable: true
        description: Unit price
      - name: ITEM_TOTAL
        dataType: NUMBER(28,2)
        nullable: true
        description: Calculated total for line item
      - name: TOTAL_AMOUNT
        dataType: NUMBER(18,2)
        nullable: true
        description: Total order amount
      - name: AMOUNT_PAID
        dataType: NUMBER(18,2)

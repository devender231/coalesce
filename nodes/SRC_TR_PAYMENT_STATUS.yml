  transformations:
    - columnName: PAYMENT_STATUS
      expression: "CASE WHEN AMOUNT_PAID >= TOTAL_AMOUNT THEN 'PAID' WHEN AMOUNT_PAID IS NULL THEN 'NOT PAID' ELSE 'PARTIAL' END"
      description: Determine payment status based on amount paid vs total amount
  sqlType: Stage
  type: sql

    sourceMapping:
      - aliases:
          BC_ACCOUNT: BA
          BCTL_ACCOUNTTYPE: ATY
          BC_PARENTACCT: PA
          BCTL_BILLINGLEVEL: BL
          BCTL_CUSTOMERSERVICETIER: CST
          BC_SECURITYZONE: SZN
          BCTL_DELINQUENCYSTATUS: DS
          BCTL_ACCOUNTSEGMENT: ACSG
          BC_ACCOUNTCONTACT: ACC
          BC_ACCOUNTCONTACTROLE: ACR
          BCTL_ACCOUNTROLE: ARO
          BC_CONTACT: CON
          BC_ADDRESS: ADR
          BCTL_STATE: STT
        customSQL:
          customSQL: |
            SELECT
              BA.ACCOUNTNUMBER,
              BA.ACCOUNTNAME,
              BA.ACCOUNTTYPE,
              ATY.NAME AS ACCOUNTTYPE_NAME,
              BA.BILLINGLEVEL,
              BL.NAME AS BILLINGLEVEL_NAME,
              BA.SERVICETIER,
              CST.NAME AS SERVICETIER_NAME,
              BA.SECURITYZONEID,
              BA.SEGMENT,
              ACSG.NAME AS SEGMENT_NAME,
              BA.CLOSEDATE,
              BA.CREATETIME,
              BA.DELINQUENCYSTATUS,
              DS.NAME AS DELINQUENCYSTATUS_NAME,
              BA.PUBLICID,
              BA.ID,
              BA.BEANVERSION,
              BA.RETIRED,
              BA.UPDATETIME,
              PA.FOREIGNENTITYID AS PARENTACCT_FOREIGNENTITYID,
              INS.CONTACT_ID,
              INS.FIRSTNAME,
              INS.LASTNAME,
              INS.ADDRESSLINE1,
              INS.ADDRESSLINE2,
              INS.ADDRESSLINE3,
              INS.CITY,
              INS.POSTALCODE,
              INS.STATE,
              INS.STATE_NAME
            FROM {{ ref('SRC', 'BC_ACCOUNT') }} BA
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTTYPE') }} ATY ON BA.ACCOUNTTYPE = ATY.ID
            LEFT JOIN {{ ref('SRC', 'BC_PARENTACCT') }} PA ON PA.OWNERID = BA.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_BILLINGLEVEL') }} BL ON BA.BILLINGLEVEL = BL.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_CUSTOMERSERVICETIER') }} CST ON BA.SERVICETIER = CST.ID
            LEFT JOIN {{ ref('SRC', 'BC_SECURITYZONE') }} SZN ON BA.SECURITYZONEID = SZN.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_DELINQUENCYSTATUS') }} DS ON BA.DELINQUENCYSTATUS = DS.ID
            LEFT JOIN {{ ref('SRC', 'BCTL_ACCOUNTSEGMENT') }} ACSG ON BA.SEGMENT = ACSG.ID
            LEFT JOIN (
              SELECT ACC.INSUREDACCOUNTID AS ACCOUNTID,
                     CON.ID AS CONTACT_ID,
                     CON.FIRSTNAME,
                     CON.LASTNAME,
                     ADR.ADDRESSLINE1,
                     ADR.ADDRESSLINE2,
                     ADR.ADDRESSLINE3,
                     ADR.CITY,
                     ADR.POSTALCODE,
                     ADR.STATE,
                     STT.NAME AS STATE_NAME
              FROM {{ ref('SRC', 'BC_ACCOUNTCONTACT') }} ACC
              INNER JOIN {{ ref('SRC', 'BC_ACCOUNTCONTACTROLE') }} ACR ON ACR.ACCOUNTCONTACTID = ACC.ID
              INNER JOIN {{ ref('SRC', 'BCTL_ACCOUNTROLE') }} ARO ON ARO.ID = ACR.ROLE AND ARO.TYPECODE = 'insured'
              LEFT JOIN {{ ref('SRC', 'BC_CONTACT') }} CON ON CON.ID = ACC.CONTACTID
              LEFT JOIN {{ ref('SRC', 'BC_ADDRESS') }} ADR ON ADR.ID = CON.PRIMARYADDRESSID
              LEFT JOIN {{ ref('SRC', 'BCTL_STATE') }} STT ON STT.ID = ADR.STATE
            ) INS ON INS.ACCOUNTID = BA.ID

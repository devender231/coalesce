fileVersion: 1
id: TR_CONDITIONAL_SPLIT_BEANVERSION
name: TR_CONDITIONAL_SPLIT_BEANVERSION
operation:
  config:
    insertStrategy: INSERT
    selectDistinct: false
  database: ""
  deployEnabled: true
  description: "Routes rows based on BeanVersion match with three outputs: MATCHED, UNMATCHED, NO_MATCH"
  isMultisource: false
  locationName: TRANSFORM
  materializationType: view
  metadata:
    columns:
      - name: PUBLICID
        dataType: STRING
        nullable: true
      - name: BEANVERSION
        dataType: INTEGER
        nullable: true
      - name: ACCOUNTNUMBER
        dataType: STRING
        nullable: true
      - name: ACCOUNTHOLDERNAME
        dataType: STRING
        nullable: true
      - name: BILLINGMETHOD
        dataType: STRING
        nullable: true
      - name: CREATETIME
        dataType: TIMESTAMP
        nullable: true
      - name: UPDATETIME
        dataType: TIMESTAMP
        nullable: true
      - name: BATCHID
        dataType: INTEGER
        nullable: false
      - name: EDWBEANVERSION
        dataType: STRING
        nullable: true
    sourceMapping:
      - dependencies:
          - locationName: TRANSFORM
            nodeName: TR_LOOKUP_BEANVERSION
        join:
          joinCondition: ""
  name: TR_CONDITIONAL_SPLIT_BEANVERSION
  conditionalSplit:
    enabled: true
    outputs:
      - name: MATCHED
        condition: "BEANVERSION == EDWBEANVERSION"
        description: "BeanVersion matches EDWBeanVersion"
      - name: UNMATCHED
        condition: "BEANVERSION != EDWBEANVERSION"
        description: "BeanVersion different from EDWBeanVersion"
      - name: NO_MATCH
        condition: "EDWBEANVERSION IS NULL"
        description: "No match found in lookup"
  sqlType: View
  type: sql
  version: 1
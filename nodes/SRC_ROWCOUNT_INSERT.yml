name: SRC_ROWCOUNT_INSERT
type: transformation
config:
  transformation_type: ROW_COUNT
  description: "Counts new insert rows (lookup no match)"
  input_source: SRC_CONDITIONALSPLIT_BEANVERSION
  input_branch: INSERT_ROWS
  logic:
    operation: COUNT
    variable_name: "User::InsertCount"
    count_type: "INSERT_ROWS"
    description: "Tracks number of new records to be inserted"
  execution_order: 6
  output:
    pass_through: true
    add_columns:
      - name: INSERT_ROW_COUNT
        dataType: INTEGER
        expression: "COUNT(*)"

name: SRC_ROWCOUNT_INSERT
type: source
config:
  source_type: transformation
  transformation_type: ROW_COUNT
  description: "Counts new insert rows (lookup no match)"
  execution_order: 6
  depends_on:
    - SRC_CONDITIONALSPLIT_BEANVERSION
transformation_logic:
  operation: COUNT_ROWS
  input_stream: INSERT_ROWS
  variable_assignment:
    variable_name: "User::InsertCount"
    variable_type: INTEGER
    description: "Count of new rows to be inserted (no match in lookup)"
input_source:
  - SRC_CONDITIONALSPLIT_BEANVERSION.INSERT_ROWS
output:
  pass_through: true
  add_columns:
    - name: INSERT_ROW_COUNT
      data_type: INTEGER
      expression: "COUNT(*)"
      nullable: false
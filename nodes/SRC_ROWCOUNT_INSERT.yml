name: SRC_ROWCOUNT_INSERT
type: transformation
config:
  transformation_type: row_count
  description: "Counts new insert rows (lookup no match)"
  execution_order: 6
dependencies:
  - SRC_CONDITIONALSPLIT_BEANVERSION
logic:
  operation: count_rows
  variable_name: "User::InsertCount"
  input_branch: InsertRows
  description: "Captures count of rows where EDWBeanVersion is NULL (new records)"
output:
  row_count_variable: "User::InsertCount"
  pass_through_data: true
  description: "Counts rows and passes data to target for INSERT operation"
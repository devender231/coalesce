name: SRC_ROWCOUNT_INSERT
type: transformation
transformation_type: ROW_COUNT
description: Counts new insert rows where lookup returned no match
execution_order: 6

source:
  upstream_component: SRC_CONDITIONAL_SPLIT_SCD
  output_path: INSERT_RECORDS
  description: Receives records with no match in EDW (EDWBeanVersion IS NULL)

logic:
  operation: COUNT
  variable_name: User::InsertCount
  count_type: ALL_ROWS
  description: Captures count of new records to be inserted into EDW

output:
  variable: User::InsertCount
  data_type: INTEGER
  description: Total count of new records for insertion
  action: INSERT_TO_TARGET
  target_table: DIMBILLINGACCOUNT

validation:
  - rule: COUNT_NON_NEGATIVE
    condition: User::InsertCount >= 0
    error_message: Insert count cannot be negative
  
  - rule: PUBLICID_UNIQUE
    condition: COUNT(DISTINCT PUBLICID) == User::InsertCount
    error_message: Duplicate PUBLICID values detected in insert records

dependencies:
  - SRC_CONDITIONAL_SPLIT_SCD
  - Variable: User::InsertCount

next_component: TARGET_DIMBILLINGACCOUNT_INSERT
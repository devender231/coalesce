# Row Count Transformation - Insert Rows
# Package: EDW_BC_Load_DimBillingAccount
# Description: Counts new insert rows (lookup no match)

name: SRC_ROWCOUNT_INSERT
type: TRANSFORMATION
transformation_type: ROW_COUNT
version: 1.0

source:
  name: INSERT_OUTPUT
  description: New rows with no match in lookup from conditional split
  upstream_dependency: SRC_CONDITIONALSPLIT_SCD

transformation_logic:
  operation: COUNT_ROWS
  description: Counts rows where EDWBeanVersion is NULL - new records to insert
  variable_assignment:
    variable_name: User::InsertCount
    variable_type: INTEGER
    scope: PACKAGE
    description: Stores count of new insert records

output:
  name: INSERT_COUNTED
  description: Dataset ready for insert with count captured
  row_count_variable: User::InsertCount
  disposition: LOAD_TO_TARGET
  target_table: DIMBILLINGACCOUNT
  load_type: INSERT

execution_order: 6

metadata:
  created_from: SSIS_Documentation/EDW_BC_Load_DimBillingAccount.json
  transformation_sequence: 6
  purpose: Audit and monitoring - track insert row count
  load_action: INSERT
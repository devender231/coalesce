name: SRC_ROWCOUNT_INSERT
type: transformation
transformation_type: ROW_COUNT
description: Counts new insert rows (lookup no match)
execution_order: 7

source:
  - SRC_CONDITIONAL_SPLIT_BEANVERSION
  source_output: INSERT_ROWS

transformation_logic:
  operation: COUNT_ROWS
  output_variable: User::InsertCount
  description: Counts rows with no lookup match (new records to insert)

output:
  columns:
    - name: ROW_COUNT
      dataType: INTEGER
      description: Count of new insert rows
  variable_assignment:
    variable_name: User::InsertCount
    variable_type: INTEGER
    description: Stores the count of new insert rows for audit purposes
  action: LOAD_TO_TARGET
  target_table: DIMBILLINGACCOUNT
  load_type: INSERT
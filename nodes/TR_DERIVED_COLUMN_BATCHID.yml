name: TR_DERIVED_COLUMN_BATCHID
type: derived_column
description: Adds BatchID column derived from system variable
source: TR_ROW_COUNT_SOURCE
transformation_logic: |
  Add new column BatchID
  BatchID = System::PackageName + '_' + GETDATE()
  This creates a unique batch identifier for tracking data lineage
derived_columns:
  - column_name: BatchID
    expression: "CONCAT(SYSTEM::PACKAGENAME, '_', CONVERT(VARCHAR, GETDATE(), 120))"
    data_type: VARCHAR(100)
    description: Unique batch identifier combining package name and timestamp

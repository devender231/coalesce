name: JOIN_DIMBILLINGACCOUNT_ALL
type: join
description: Comprehensive join logic for DimBillingAccount ETL - combines all source tables with proper join order and conditions
config:
  materialized: view
  
sources:
  - name: SRC_BC_ACCOUNT
    alias: BC_ACCOUNT
  - name: SRC_BCTL_ACCOUNTTYPE
    alias: BCTL_ACCOUNTTYPE
  - name: SRC_BC_PARENTACCT
    alias: BC_PARENTACCT
  - name: SRC_BCTL_BILLINGLEVEL
    alias: BCTL_BILLINGLEVEL
  - name: SRC_BCTL_CUSTOMERSERVICETIER
    alias: BCTL_CUSTOMERSERVICETIER
  - name: SRC_BC_SECURITYZONE
    alias: BC_SECURITYZONE
  - name: SRC_BCTL_DELINQUENCYSTATUS
    alias: BCTL_DELINQUENCYSTATUS
  - name: SRC_BCTL_ACCOUNTSEGMENT
    alias: BCTL_ACCOUNTSEGMENT
  - name: SRC_BC_ACCOUNTCONTACT
    alias: BC_ACCOUNTCONTACT
  - name: SRC_BC_ACCOUNTCONTACTROLE
    alias: BC_ACCOUNTCONTACTROLE
  - name: SRC_BCTL_ACCOUNTROLE
    alias: BCTL_ACCOUNTROLE
  - name: SRC_BC_CONTACT
    alias: BC_CONTACT
  - name: SRC_BC_ADDRESS
    alias: BC_ADDRESS
  - name: SRC_BCTL_STATE
    alias: BCTL_STATE

joins:
  # Join 1: BC_ACCOUNT with BCTL_ACCOUNTTYPE
  - type: LEFT
    left_source: BC_ACCOUNT
    right_source: BCTL_ACCOUNTTYPE
    condition: BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
    description: Join account with account type lookup
    
  # Join 2: BC_ACCOUNT with BC_PARENTACCT
  - type: LEFT
    left_source: BC_ACCOUNT
    right_source: BC_PARENTACCT
    condition: BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
    description: Join account with parent account relationship
    
  # Join 3: BC_ACCOUNT with BCTL_BILLINGLEVEL
  - type: LEFT
    left_source: BC_ACCOUNT
    right_source: BCTL_BILLINGLEVEL
    condition: BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
    description: Join account with billing level lookup
    
  # Join 4: BC_ACCOUNT with BCTL_CUSTOMERSERVICETIER
  - type: LEFT
    left_source: BC_ACCOUNT
    right_source: BCTL_CUSTOMERSERVICETIER
    condition: BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
    description: Join account with customer service tier lookup
    
  # Join 5: BC_ACCOUNT with BC_SECURITYZONE
  - type: LEFT
    left_source: BC_ACCOUNT
    right_source: BC_SECURITYZONE
    condition: BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
    description: Join account with security zone
    
  # Join 6: BC_ACCOUNT with BCTL_DELINQUENCYSTATUS
  - type: LEFT
    left_source: BC_ACCOUNT
    right_source: BCTL_DELINQUENCYSTATUS
    condition: BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
    description: Join account with delinquency status lookup
    
  # Join 7: BC_ACCOUNT with BCTL_ACCOUNTSEGMENT
  - type: LEFT
    left_source: BC_ACCOUNT
    right_source: BCTL_ACCOUNTSEGMENT
    condition: BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
    description: Join account with account segment lookup
    
  # Join 8: Create INSUREDINFO intermediate result - BC_ACCOUNT with BC_ACCOUNTCONTACT
  - type: LEFT
    left_source: BC_ACCOUNT
    right_source: BC_ACCOUNTCONTACT
    condition: BC_ACCOUNTCONTACT.INSUREDACCOUNTID = BC_ACCOUNT.ID
    description: Join account with account contact for insured information
    output_alias: INSUREDINFO_BASE
    
  # Join 9: INSUREDINFO with BC_ACCOUNTCONTACTROLE
  - type: INNER
    left_source: INSUREDINFO_BASE
    right_source: BC_ACCOUNTCONTACTROLE
    condition: BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
    description: Join insured info with account contact role
    
  # Join 10: INSUREDINFO with BCTL_ACCOUNTROLE (filter for 'insured' typecode)
  - type: INNER
    left_source: INSUREDINFO_BASE
    right_source: BCTL_ACCOUNTROLE
    condition: BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
    description: Join with account role and filter for insured type
    
  # Join 11: INSUREDINFO with BC_CONTACT
  - type: LEFT
    left_source: INSUREDINFO_BASE
    right_source: BC_CONTACT
    condition: BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
    description: Join insured info with contact details
    
  # Join 12: INSUREDINFO with BC_ADDRESS
  - type: LEFT
    left_source: INSUREDINFO_BASE
    right_source: BC_ADDRESS
    condition: BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID
    description: Join insured info with primary address
    
  # Join 13: INSUREDINFO with BCTL_STATE
  - type: LEFT
    left_source: INSUREDINFO_BASE
    right_source: BCTL_STATE
    condition: BCTL_STATE.ID = BC_ADDRESS.STATE
    description: Join insured info with state lookup
    output_alias: INSUREDINFO_COMPLETE

output_columns:
  # BC_ACCOUNT columns
  - BC_ACCOUNT.ACCOUNTNUMBER
  - BC_ACCOUNT.ACCOUNTNAME
  - BC_ACCOUNT.ACCOUNTTYPE
  - BC_ACCOUNT.BILLINGLEVEL
  - BC_ACCOUNT.SERVICETIER
  - BC_ACCOUNT.SECURITYZONEID
  - BC_ACCOUNT.SEGMENT
  - BC_ACCOUNT.CLOSEDATE
  - BC_ACCOUNT.CREATETIME
  - BC_ACCOUNT.DELINQUENCYSTATUS
  - BC_ACCOUNT.FIRSTTWICEPERMTHINVOICEDOM
  - BC_ACCOUNT.SECONDTWICEPERMTHINVOICEDOM
  - BC_ACCOUNT.PUBLICID
  - BC_ACCOUNT.ID as ACCOUNT_ID
  - BC_ACCOUNT.BEANVERSION
  - BC_ACCOUNT.RETIRED
  - BC_ACCOUNT.UPDATETIME
  
  # Lookup table columns
  - BCTL_ACCOUNTTYPE.NAME as ACCOUNTTYPE_NAME
  - BC_PARENTACCT.FOREIGNENTITYID as PARENT_ACCOUNT_ID
  - BCTL_BILLINGLEVEL.NAME as BILLINGLEVEL_NAME
  - BCTL_CUSTOMERSERVICETIER.NAME as SERVICETIER_NAME
  - BC_SECURITYZONE.NAME as SECURITYZONE_NAME
  - BCTL_DELINQUENCYSTATUS.NAME as DELINQUENCYSTATUS_NAME
  - BCTL_ACCOUNTSEGMENT.NAME as ACCOUNTSEGMENT_NAME
  
  # Insured contact information
  - BC_CONTACT.FIRSTNAME as INSURED_FIRSTNAME
  - BC_CONTACT.LASTNAME as INSURED_LASTNAME
  - BC_ADDRESS.ADDRESSLINE1 as INSURED_ADDRESS1
  - BC_ADDRESS.ADDRESSLINE2 as INSURED_ADDRESS2
  - BC_ADDRESS.ADDRESSLINE3 as INSURED_ADDRESS3
  - BC_ADDRESS.CITY as INSURED_CITY
  - BC_ADDRESS.POSTALCODE as INSURED_POSTALCODE
  - BCTL_STATE.NAME as INSURED_STATE

execution_order: 1
dependencies: []
notes: |
  This join component combines all source tables for DimBillingAccount ETL.
  Join execution follows SSIS package order:
  1. First, all direct BC_ACCOUNT lookups (joins 1-7)
  2. Then, insured information chain (joins 8-13)
  3. The INSUREDINFO intermediate result is created through progressive joins
  4. Final output contains all necessary columns for downstream transformations
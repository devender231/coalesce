name: SRC_ROW_COUNT_SOURCE
type: Row Count
description: Counts source rows from OLE_SRC - GuideWire

transformation_type: ROW_COUNT
execution_order: 1

input:
  source: SRC_JOINS_ALL
  description: Joined dataset from all source tables

logic:
  operation: COUNT
  target_variable: User::SourceCount
  description: Counts all rows from the source after initial joins

output:
  row_count_variable: User::SourceCount
  pass_through: true
  description: Passes all rows through while counting them

upstream_dependencies:
  - SRC_JOINS_ALL.yml

metadata:
  purpose: Audit and tracking of source row counts
  usage: Variable User::SourceCount is used for ETL audit logging
name: SRC_TR_CONDITIONAL_SPLIT_BEANVERSION
type: transformation
transformation_type: conditional_split
description: Route rows based on BeanVersion comparison to determine insert, update, or unchanged records
source: SRC_TR_LOOKUP_BEANVERSION

operation:
  type: CONDITIONAL_SPLIT
  evaluation_order: SEQUENTIAL
  
  conditions:
    # Output 1: Unchanged Records
    - output_name: UNCHANGED_ROWS
      condition: "BEANVERSION == LKP_BEANVERSION && !ISNULL(LKP_BEANVERSION)"
      description: Records where BeanVersion matches existing dimension - no changes needed
      priority: 1
    
    # Output 2: Insert Records
    - output_name: INSERT_ROWS
      condition: "ISNULL(LKP_BEANVERSION)"
      description: New records that don't exist in dimension table
      priority: 2
    
    # Output 3: Update Records
    - output_name: UPDATE_ROWS
      condition: "BEANVERSION != LKP_BEANVERSION && !ISNULL(LKP_BEANVERSION)"
      description: Existing records with changed BeanVersion requiring updates
      priority: 3
  
  default_output: ERROR_ROWS
  default_description: Records that don't match any condition - for error handling

outputs:
  - name: UNCHANGED_ROWS
    next_step: SRC_TR_ROW_COUNT_UNCHANGED
  - name: INSERT_ROWS
    next_step: SRC_TR_ROW_COUNT_INSERT
  - name: UPDATE_ROWS
    next_step: SRC_TR_ROW_COUNT_UPDATE
  - name: ERROR_ROWS
    next_step: ERROR_HANDLER

metadata:
  execution_order: 4
  purpose: Classify records into insert, update, or unchanged categories for CDC processing
  previous_step: SRC_TR_LOOKUP_BEANVERSION
  next_steps:
    - SRC_TR_ROW_COUNT_UNCHANGED
    - SRC_TR_ROW_COUNT_INSERT
    - SRC_TR_ROW_COUNT_UPDATE
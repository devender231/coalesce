fileVersion: 1.0
name: SRC_TR_CONDITIONAL_SPLIT_BEANVERSION
type: ConditionalSplit
description: Routes rows based on whether BeanVersion matches EDWBeanVersion for SCD logic

config:
  clusterKey: false
  downstreamOption: true
  groupByAll: false
  initialize: ON_CREATE
  insertStrategy: UNION
  orderby: false
  postSQL: ''
  preSQL: ''
  testsEnabled: true
  truncateBefore: true
  warehouseName: DEV_WH

transformation:
  type: CONDITIONAL_SPLIT
  defaultOutputName: DEFAULT_OUTPUT
  
  conditions:
    - outputName: UNCHANGED_ROWS
      condition: "BEANVERSION = EDW_BEANVERSION"
      description: Rows where BeanVersion matches - no update needed
      order: 1
    
    - outputName: UPDATE_ROWS
      condition: "BEANVERSION != EDW_BEANVERSION AND EDW_BEANVERSION IS NOT NULL"
      description: Rows where BeanVersion differs - needs update
      order: 2
    
    - outputName: INSERT_ROWS
      condition: "EDW_BEANVERSION IS NULL"
      description: Rows with no match in EDW - needs insert
      order: 3


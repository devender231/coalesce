fileVersion: 1
id: SRC_TR_CONDITIONAL_SPLIT_BEANVERSION
name: SRC_TR_CONDITIONAL_SPLIT_BEANVERSION
operation:
  config:
    insertStrategy: INSERT
    selectDistinct: false
  database: ""
  deployEnabled: true
  description: Conditional split transformation to route rows based on BeanVersion match
  isMultisource: false
  locationName: SRC
  materializationType: view
  metadata:
    appliedNodeTests: []
    columns:
      - acceptedValues:
          strictMatch: true
          values: []
        appliedColumnTests: {}
        columnReference:
          columnCounter: 1
          stepCounter: SRC_TR_CONDITIONAL_SPLIT_BEANVERSION
        config: {}
        dataType: STRING
        description: "Route indicator: UNCHANGED, INSERT, or UPDATE"
        name: ROUTE_TYPE
        nullable: true
        sourceColumnReferences:
          - columnReferences: []
            transform: |
              CASE
                WHEN BEANVERSION = EDWBEANVERSION THEN 'UNCHANGED'
                WHEN EDWBEANVERSION IS NULL THEN 'INSERT'
                ELSE 'UPDATE'
              END
    cteString: ""
    enabledColumnTestIDs: []
    sourceMapping:
      - aliases:
          SRC_TR_LOOKUP_BEANVERSION: SRC_TR_LOOKUP_BEANVERSION
        customSQL:
          customSQL: |
            SELECT *,
                   CASE
                     WHEN BEANVERSION = EDWBEANVERSION THEN 'UNCHANGED'
                     WHEN EDWBEANVERSION IS NULL THEN 'INSERT'
                     ELSE 'UPDATE'
                   END as ROUTE_TYPE
            FROM {{ ref('SRC', 'SRC_TR_LOOKUP_BEANVERSION') }}
        dependencies:
          - locationName: SRC
            nodeName: SRC_TR_LOOKUP_BEANVERSION
        join:
          joinCondition: ""
        name: SRC_TR_CONDITIONAL_SPLIT_BEANVERSION
        noLinkRefs: []
  name: SRC_TR_CONDITIONAL_SPLIT_BEANVERSION

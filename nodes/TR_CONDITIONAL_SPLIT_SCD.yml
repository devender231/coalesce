name: TR_CONDITIONAL_SPLIT_SCD
type: conditional_split
description: Splits records into INSERT, UPDATE, and UNCHANGED based on SCD Type 1 logic
source: TR_LOOKUP_BEANVERSION
transformation_logic: |
  Implements SCD Type 1 logic to determine record action:
  - INSERT: New records (DIM_BEANVERSION IS NULL)
  - UPDATE: Changed records (BEANVERSION != DIM_BEANVERSION)
  - UNCHANGED: No changes (BEANVERSION = DIM_BEANVERSION)
split_conditions:
  - output_name: INSERT
    condition: "DIM_BEANVERSION IS NULL"
    description: New records that don't exist in dimension table
    priority: 1
  
  - output_name: UPDATE
    condition: "DIM_BEANVERSION IS NOT NULL AND DIMBILLINGACCOUNT.BEANVERSION != DIM_BEANVERSION"
    description: Existing records with changed BeanVersion
    priority: 2
  
  - output_name: UNCHANGED
    condition: "DIM_BEANVERSION IS NOT NULL AND DIMBILLINGACCOUNT.BEANVERSION = DIM_BEANVERSION"
    description: Existing records with no changes
    priority: 3
default_output: ERROR
input_columns:
  - BC_ACCOUNT.ID
  - BC_ACCOUNT.PUBLICID
  - BC_ACCOUNT.ACCOUNTNUMBER
  - BC_ACCOUNT.ACCOUNTTYPE
  - BC_ACCOUNT.BILLINGLEVEL
  - BC_ACCOUNT.SERVICETIER
  - BC_ACCOUNT.SECURITYZONEID
  - BC_ACCOUNT.DELINQUENCYSTATUS
  - BC_ACCOUNT.SEGMENT

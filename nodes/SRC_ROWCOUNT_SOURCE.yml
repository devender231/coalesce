name: SRC_ROWCOUNT_SOURCE
type: transformation
config:
  transformation_type: row_count
  description: "Counts source rows from OLE_SRC - GuideWire"
  execution_order: 1
dependencies:
  - SRC_JOIN_DIMBILLINGACCOUNT
logic:
  operation: count_rows
  variable_name: "User::SourceCount"
  description: "Captures total number of rows from the joined source dataset"
output:
  row_count_variable: "User::SourceCount"
  pass_through_data: true
  description: "Passes all data through while capturing row count"
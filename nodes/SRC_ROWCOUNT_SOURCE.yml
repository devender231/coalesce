name: SRC_ROWCOUNT_SOURCE
type: transformation
transformation_type: ROW_COUNT
description: Counts source rows from OLE_SRC - GuideWire
execution_order: 1

source:
  upstream_component: SRC_BC_ACCOUNT
  description: Primary source table for row counting

logic:
  operation: COUNT
  variable_name: User::SourceCount
  count_type: ALL_ROWS
  description: Captures total number of rows from the source before any transformations

output:
  variable: User::SourceCount
  data_type: INTEGER
  description: Total count of source rows

validation:
  - rule: COUNT_MUST_BE_POSITIVE
    condition: User::SourceCount > 0
    error_message: Source count must be greater than zero

dependencies:
  - SRC_BC_ACCOUNT

next_component: SRC_DERIVED_BATCHID
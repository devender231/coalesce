name: SRC_ROWCOUNT_SOURCE
type: source
config:
  source_type: transformation
  transformation_type: ROW_COUNT
  description: "Counts source rows from OLE_SRC - GuideWire"
  execution_order: 1
  depends_on:
    - SRC_JOINS_DIMBILLINGACCOUNT
transformation_logic:
  operation: COUNT_ROWS
  variable_assignment:
    variable_name: "User::SourceCount"
    variable_type: INTEGER
    description: "Total count of source rows after joins"
input_source:
  - SRC_JOINS_DIMBILLINGACCOUNT
output:
  pass_through: true
  add_columns:
    - name: SOURCE_ROW_COUNT
      data_type: INTEGER
      expression: "COUNT(*)"
      nullable: false
name: SRC_ROWCOUNT_SOURCE
type: transformation
config:
  transformation_type: ROW_COUNT
  description: "Counts source rows from OLE_SRC - GuideWire"
  input_source: SRC_DIMBILLINGACCOUNT_JOINS
  logic:
    operation: COUNT
    variable_name: "User::SourceCount"
    count_type: "ALL_ROWS"
  execution_order: 1
  output:
    pass_through: true
    add_columns:
      - name: SOURCE_ROW_COUNT
        dataType: INTEGER
        expression: "COUNT(*)"

name: SRC_ROWCOUNT_SOURCE
type: transformation
transformation_type: ROW_COUNT
description: Counts source rows from OLE_SRC - GuideWire
execution_order: 2

source:
  - SRC_DIMBILLINGACCOUNT_JOINS

transformation_logic:
  operation: COUNT_ROWS
  output_variable: User::SourceCount
  description: Counts all rows from the joined source data

output:
  columns:
    - name: ROW_COUNT
      dataType: INTEGER
      description: Total count of source rows
  variable_assignment:
    variable_name: User::SourceCount
    variable_type: INTEGER
    description: Stores the count of source rows for audit purposes
name: SRC_JOINS_ALL
type: Join
description: All joins for DimBillingAccount ETL process

sources:
  - name: BC_ACCOUNT
    alias: BC_ACCOUNT
  - name: BCTL_ACCOUNTTYPE
    alias: BCTL_ACCOUNTTYPE
  - name: BC_PARENTACCT
    alias: BC_PARENTACCT
  - name: BCTL_BILLINGLEVEL
    alias: BCTL_BILLINGLEVEL
  - name: BCTL_CUSTOMERSERVICETIER
    alias: BCTL_CUSTOMERSERVICETIER
  - name: BC_SECURITYZONE
    alias: BC_SECURITYZONE
  - name: BCTL_DELINQUENCYSTATUS
    alias: BCTL_DELINQUENCYSTATUS
  - name: BCTL_ACCOUNTSEGMENT
    alias: BCTL_ACCOUNTSEGMENT
  - name: BC_ACCOUNTCONTACT
    alias: BC_ACCOUNTCONTACT
  - name: BC_ACCOUNTCONTACTROLE
    alias: BC_ACCOUNTCONTACTROLE
  - name: BCTL_ACCOUNTROLE
    alias: BCTL_ACCOUNTROLE
  - name: BC_CONTACT
    alias: BC_CONTACT
  - name: BC_ADDRESS
    alias: BC_ADDRESS
  - name: BCTL_STATE
    alias: BCTL_STATE
  - name: DIMBILLINGACCOUNT
    alias: DIMBILLINGACCOUNT

joins:
  - join_number: 1
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BCTL_ACCOUNTTYPE
    condition: BC_ACCOUNT.ACCOUNTTYPE = BCTL_ACCOUNTTYPE.ID
    description: Join BC_ACCOUNT with BCTL_ACCOUNTTYPE to get account type name

  - join_number: 2
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BC_PARENTACCT
    condition: BC_PARENTACCT.OWNERID = BC_ACCOUNT.ID
    description: Join BC_ACCOUNT with BC_PARENTACCT to get parent account information

  - join_number: 3
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BCTL_BILLINGLEVEL
    condition: BC_ACCOUNT.BILLINGLEVEL = BCTL_BILLINGLEVEL.ID
    description: Join BC_ACCOUNT with BCTL_BILLINGLEVEL to get billing level name

  - join_number: 4
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BCTL_CUSTOMERSERVICETIER
    condition: BC_ACCOUNT.SERVICETIER = BCTL_CUSTOMERSERVICETIER.ID
    description: Join BC_ACCOUNT with BCTL_CUSTOMERSERVICETIER to get service tier name

  - join_number: 5
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BC_SECURITYZONE
    condition: BC_ACCOUNT.SECURITYZONEID = BC_SECURITYZONE.ID
    description: Join BC_ACCOUNT with BC_SECURITYZONE to get security zone name

  - join_number: 6
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BCTL_DELINQUENCYSTATUS
    condition: BC_ACCOUNT.DELINQUENCYSTATUS = BCTL_DELINQUENCYSTATUS.ID
    description: Join BC_ACCOUNT with BCTL_DELINQUENCYSTATUS to get delinquency status name

  - join_number: 7
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: BCTL_ACCOUNTSEGMENT
    condition: BC_ACCOUNT.SEGMENT = BCTL_ACCOUNTSEGMENT.ID
    description: Join BC_ACCOUNT with BCTL_ACCOUNTSEGMENT to get account segment name

  - join_number: 8
    join_type: LEFT
    left_table: BC_ACCOUNT
    right_table: INSUREDINFO
    condition: INSUREDINFO.ACCOUNTID = BC_ACCOUNT.ID
    description: Join BC_ACCOUNT with INSUREDINFO subquery to get insured information
    note: INSUREDINFO is a derived dataset from subsequent joins

  - join_number: 9
    join_type: INNER
    left_table: INSUREDINFO
    right_table: BC_ACCOUNTCONTACT
    condition: BC_ACCOUNTCONTACT.ID = INSUREDINFO.ACCOUNTID
    description: Inner join INSUREDINFO with BC_ACCOUNTCONTACT to get account contact

  - join_number: 10
    join_type: INNER
    left_table: INSUREDINFO
    right_table: BC_ACCOUNTCONTACTROLE
    condition: BC_ACCOUNTCONTACTROLE.ACCOUNTCONTACTID = BC_ACCOUNTCONTACT.ID
    description: Inner join INSUREDINFO with BC_ACCOUNTCONTACTROLE to get contact role

  - join_number: 11
    join_type: INNER
    left_table: INSUREDINFO
    right_table: BCTL_ACCOUNTROLE
    condition: BCTL_ACCOUNTROLE.ID = BC_ACCOUNTCONTACTROLE.ROLE AND BCTL_ACCOUNTROLE.TYPECODE = 'insured'
    description: Inner join INSUREDINFO with BCTL_ACCOUNTROLE filtered for insured role type

  - join_number: 12
    join_type: LEFT
    left_table: INSUREDINFO
    right_table: BC_CONTACT
    condition: BC_CONTACT.ID = BC_ACCOUNTCONTACT.CONTACTID
    description: Left join INSUREDINFO with BC_CONTACT to get contact details

  - join_number: 13
    join_type: LEFT
    left_table: INSUREDINFO
    right_table: BC_ADDRESS
    condition: BC_ADDRESS.ID = BC_CONTACT.PRIMARYADDRESSID
    description: Left join INSUREDINFO with BC_ADDRESS to get primary address

  - join_number: 14
    join_type: LEFT
    left_table: INSUREDINFO
    right_table: BCTL_STATE
    condition: BCTL_STATE.ID = BC_ADDRESS.STATE
    description: Left join INSUREDINFO with BCTL_STATE to get state name

  - join_number: 15
    join_type: INNER
    left_table: LOOKUP_INPUT
    right_table: DIMBILLINGACCOUNT
    condition: LOOKUP_INPUT.PUBLICID = DIMBILLINGACCOUNT.PUBLICID
    description: Inner join for lookup matching PUBLICID with existing dimension records
    note: This join is used in the LOOKUP transformation step

execution_order: Sequential from join 1 to 15
upstream_dependencies:
  - SRC_BC_ACCOUNT.yml
  - SRC_BC_PARENTACCT.yml
  - SRC_BC_ACCOUNTCONTACT.yml
  - SRC_BC_ACCOUNTCONTACTROLE.yml
  - SRC_BCTL_ACCOUNTROLE.yml
  - SRC_BC_CONTACT.yml
  - SRC_BC_ADDRESS.yml
  - SRC_BCTL_STATE.yml
  - SRC_BCTL_ACCOUNTTYPE.yml
  - SRC_BCTL_BILLINGLEVEL.yml
  - SRC_BCTL_CUSTOMERSERVICETIER.yml
  - SRC_BC_SECURITYZONE.yml
  - SRC_BCTL_DELINQUENCYSTATUS.yml
  - SRC_BCTL_ACCOUNTSEGMENT.yml
  - SRC_DIMBILLINGACCOUNT.yml
name: SRC_TR_ROWCOUNT_UNCHANGED
type: transformation
config:
  transformation_type: row_count
  description: "Counts unchanged rows (BeanVersion matches)"
  input_source: SRC_TR_CONDITIONAL_SPLIT
  input_path: unchanged
  logic:
    operation: count_rows
    variable_name: "User::UnChangeCount"
    count_type: unchanged_records
    filter_condition: "BEANVERSION == EDWBEANVERSION"
  output:
    pass_through: true
    add_count_column: false
  execution_order: 6
  dependencies:
    - SRC_TR_CONDITIONAL_SPLIT
name: SRC_TR_ROWCOUNT_UNCHANGED
type: transformation
transformation_type: ROW_COUNT
execution_sequence: 5
description: Counts unchanged rows (BeanVersion matches)

input:
  source: SRC_TR_CONDITIONALSPLIT_BEANVERSION
  output_path: UNCHANGED_OUTPUT
  description: Takes unchanged output from conditional split

logic:
  operation: COUNT_ROWS
  variable: User::UnChangeCount
  description: Stores count of unchanged rows in variable User::UnChangeCount

output:
  name: ROWCOUNT_UNCHANGED_OUTPUT
  columns: ALL
  metadata:
    row_count_variable: User::UnChangeCount
    description: Rows that do not require processing
name: SRC_TR_ROWCOUNT_UNCHANGED
type: transformation
transformation_type: ROW_COUNT
description: Counts unchanged rows where BeanVersion matches EDWBeanVersion

source:
  - SRC_TR_CONDITIONALSPLIT_BEANVERSION.UNCHANGED_ROWS

logic:
  operation: COUNT_ROWS
  output_variable: User::UnChangeCount
  description: Counts rows that have no changes and do not need to be updated

execution_order: 6
dependencies:
  - SRC_TR_CONDITIONALSPLIT_BEANVERSION

output:
  row_count_variable: UnChangeCount
  pass_through: false
  description: Rows are counted but not passed to target (no action needed)
  action: DISCARD

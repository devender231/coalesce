name: SRC_TR_ROWCOUNT_UNCHANGED
type: transformation
config:
  transformation_type: ROW_COUNT
  description: "Counts unchanged rows (BeanVersion matches)"
  execution_order: 5
  logic:
    operation: COUNT_ROWS
    variable: "User::UnChangeCount"
    count_type: "unchanged_rows"
    filter: "BEANVERSION == EDWBeanVersion"
    
  input:
    source: SRC_TR_CONDITIONALSPLIT_BEANVERSION
    output_name: UNCHANGED_OUTPUT
    
  output:
    row_count_variable: "User::UnChangeCount"
    pass_through: false
    action: DISCARD
    
  audit:
    capture_count: true
    log_to_variable: true
    log_message: "Unchanged rows - no action required"
    
dependencies:
  - SRC_TR_CONDITIONALSPLIT_BEANVERSION
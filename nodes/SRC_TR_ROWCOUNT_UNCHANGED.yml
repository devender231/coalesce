fileVersion: 1.0.0
id: tr_rowcount_unchanged
name: SRC_TR_ROWCOUNT_UNCHANGED
description: Counts unchanged rows (BeanVersion matches)
type: RowCount

execution_order: 5

source:
  name: UNCHANGED_OUTPUT
  description: Input from conditional split unchanged output

transformation:
  type: ROW_COUNT
  operation: COUNT_ROWS
  output_variable: User::UnChangeCount
  description: Counts rows where BeanVersion matches (no changes detected)

logic:
  count_expression: COUNT(*)
  variable_assignment:
    variable_name: User::UnChangeCount
    variable_type: INTEGER
    description: Number of rows with no changes (BeanVersion matches)
  
  filter_condition: "BEANVERSION == EDWBeanVersion"

output:
  name: ROWCOUNT_UNCHANGED_OUTPUT
  pass_through: true
  description: Unchanged rows passed through with count captured
  action: NO_LOAD
  reason: These rows already exist in EDW with same BeanVersion

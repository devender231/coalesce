fileVersion: 1
id: customer_order_joins_node
name: SRC_CUSTOMER_ORDER_JOINS
description: Combined joins from SSIS package - CUSTOMERS to ORDERS to ORDER_ITEMS to PAYMENTS
type: sql
config:
  clusterKey: false
  downstreamOption: true
  groupByAll: false
  initialize: ON_CREATE
  insertStrategy: INSERT
  orderby: false
  postSQL: ''
  preSQL: ''
  testsEnabled: true
  truncateBefore: true
columns:
  - name: CUSTOMER_ID
    dataType: NUMBER
    description: Customer identifier from CUSTOMERS table
  - name: FIRST_NAME
    dataType: VARCHAR
    description: Customer first name
  - name: LAST_NAME
    dataType: VARCHAR
    description: Customer last name
  - name: EMAIL
    dataType: VARCHAR
    description: Customer email address
  - name: ORDER_ID
    dataType: NUMBER
    description: Order identifier from ORDERS table
  - name: ORDER_DATE
    dataType: DATE
    description: Date when order was placed
  - name: TOTAL_AMOUNT
    dataType: NUMBER
    description: Total amount of the order
  - name: PRODUCT_NAME
    dataType: VARCHAR
    description: Product name from ORDER_ITEMS table
  - name: QUANTITY
    dataType: NUMBER
    description: Quantity of items ordered
  - name: PRICE
    dataType: NUMBER
    description: Price per item
  - name: AMOUNT_PAID
    dataType: NUMBER
    description: Amount paid from PAYMENTS table
dependsOn:
  - type: source
    name: SRC_CUSTOMERS
  - type: source
    name: SRC_ORDERS
  - type: source
    name: SRC_ORDER_ITEMS
  - type: source
    name: SRC_PAYMENTS
sql: |
  -- Join 1: INNER JOIN CUSTOMERS with ORDERS
  -- Join 2: LEFT JOIN with ORDER_ITEMS
  -- Join 3: LEFT JOIN with PAYMENTS
  SELECT
    c.CUSTOMER_ID,
    c.FIRST_NAME,
    c.LAST_NAME,
    c.EMAIL,
    o.ORDER_ID,
    o.ORDER_DATE,
    o.TOTAL_AMOUNT,
    oi.PRODUCT_NAME,
    oi.QUANTITY,
    oi.PRICE,
    p.AMOUNT_PAID
  FROM {{ ref('SRC_CUSTOMERS') }} c
  INNER JOIN {{ ref('SRC_ORDERS') }} o
    ON c.CUSTOMER_ID = o.CUSTOMER_ID
  LEFT JOIN {{ ref('SRC_ORDER_ITEMS') }} oi
    ON o.ORDER_ID = oi.ORDER_ID
  LEFT JOIN {{ ref('SRC_PAYMENTS') }} p
    ON o.ORDER_ID = p.ORDER_ID
executionOrder: 1
  name: CONDITIONAL_SPLIT
  schema: ""
  sqlType: Transformation
  type: transformation
  version: 1
  transformationLogic:
    type: CONDITIONAL_SPLIT
    description: "Routes rows based on whether BeanVersion matches EDWBeanVersion"
    conditions:
      - conditionName: UNCHANGED
        expression: "BEANVERSION == EDW_BEANVERSION"
        description: "Rows where BeanVersion matches EDW BeanVersion (no change)"
      - conditionName: INSERT
        expression: "EDW_BEANVERSION IS NULL"
        description: "Rows with no match in lookup (new inserts)"
      - conditionName: UPDATE
        expression: "BEANVERSION != EDW_BEANVERSION AND EDW_BEANVERSION IS NOT NULL"
        description: "Rows where BeanVersion differs (updates)"

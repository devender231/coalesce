name: SRC_DIMBILLINGACCOUNT_DERIVED_BATCHID
type: transformation
transformation_type: DERIVED
description: Adds or overwrites BatchID column
source:
  - SRC_DIMBILLINGACCOUNT_ROWCOUNT_SOURCE
logic:
  derived_columns:
    - column_name: BatchID
      expression: '@[User::BatchID]'
      data_type: INTEGER
      operation: ADD_OR_REPLACE
      description: Assigns BatchID from package variable
output:
  pass_through: true
  new_columns:
    - BatchID
fileVersion: 1.0
name: SRC_DIMBILLINGACCOUNT_DERIVED_BATCHID
type: transformation
description: |
  Derived Column transformation for DimBillingAccount package
  Adds or overwrites BatchID column with package variable value
  Execution Order: Step 3 - After row count, add BatchID

sources:
  - name: SRC_DIMBILLINGACCOUNT_ROWCOUNT_SOURCE
    type: transformation

transformation_type: DERIVED_COLUMN

transformation_logic:
  operation: ADD_COLUMN
  description: Adds BatchID column from package variable
  
  derived_columns:
    - column_name: BatchID
      data_type: INTEGER
      expression: "@[User::BatchID]"
      replace_existing: true
      description: Batch identifier from package variable for tracking data lineage
      
output_columns:
  # All previous columns plus new BatchID
  - BC_ACCOUNT.ACCOUNTNUMBER
  - BC_ACCOUNT.ACCOUNTNAME
  - BC_ACCOUNT.ACCOUNTTYPE
  - BC_ACCOUNT.BILLINGLEVEL
  - BC_ACCOUNT.SERVICETIER
  - BC_ACCOUNT.SECURITYZONEID
  - BC_ACCOUNT.SEGMENT
  - BC_ACCOUNT.CLOSEDATE
  - BC_ACCOUNT.CREATETIME
  - BC_ACCOUNT.DELINQUENCYSTATUS
  - BC_ACCOUNT.FIRSTTWICEPERMTHINVOICEDOM
  - BC_ACCOUNT.SECONDTWICEPERMTHINVOICEDOM
  - BC_ACCOUNT.PUBLICID
  - BC_ACCOUNT.ID
  - BC_ACCOUNT.BEANVERSION
  - BC_ACCOUNT.RETIRED
  - BC_ACCOUNT.UPDATETIME
  - ACCOUNTTYPE_NAME
  - BILLINGLEVEL_NAME
  - SERVICETIER_NAME
  - SECURITYZONE_NAME
  - DELINQUENCYSTATUS_NAME
  - SEGMENT_NAME
  - PARENT_ACCOUNT_ID
  - INSURED_FIRSTNAME
  - INSURED_LASTNAME
  - INSURED_ADDRESS1
  - INSURED_ADDRESS2
  - INSURED_ADDRESS3
  - INSURED_CITY
  - INSURED_POSTALCODE
  - INSURED_STATE
  - BatchID  # NEW COLUMN

execution_order: 3
dependencies:
  - SRC_DIMBILLINGACCOUNT_ROWCOUNT_SOURCE

metadata:
  ssis_component_type: DERIVED_COLUMN
  ssis_expression: "@[User::BatchID]"
  purpose: Add batch tracking identifier for data lineage and audit

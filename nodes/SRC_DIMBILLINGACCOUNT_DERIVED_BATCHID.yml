# Transformation YAML - Derived Column BatchID
version: 1.0

name: SRC_DIMBILLINGACCOUNT_DERIVED_BATCHID
description: Adds or overwrites BatchID column with variable value
transformation_type: DERIVED_COLUMN

sources:
  - name: ROWCOUNT_SOURCE_OUTPUT
    type: transformation
    source_ref: SRC_DIMBILLINGACCOUNT_ROWCOUNT_SOURCE

transformation:
  type: DERIVED_COLUMN
  logic:
    description: Adds BatchID column from SSIS variable
    derived_columns:
      - column_name: BatchID
        expression: "@[User::BatchID]"
        data_type: INTEGER
        operation: ADD_OR_REPLACE
        description: Batch identifier from SSIS variable

output:
  name: DERIVED_BATCHID_OUTPUT
  description: Data with BatchID column added
  columns:
    - name: ALL_PREVIOUS_COLUMNS
      source: ROWCOUNT_SOURCE_OUTPUT.*
      description: All columns from previous step
    - name: BatchID
      source: DERIVED
      data_type: INTEGER
      description: Batch identifier added by transformation

execution_order: 3
dependencies:
  - SRC_DIMBILLINGACCOUNT_ROWCOUNT_SOURCE
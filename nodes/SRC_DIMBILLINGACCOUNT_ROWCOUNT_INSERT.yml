# Transformation YAML - Row Count Insert
version: 1.0

name: SRC_DIMBILLINGACCOUNT_ROWCOUNT_INSERT
description: Counts new insert rows (lookup no match)
transformation_type: ROW_COUNT

sources:
  - name: INSERT_OUTPUT
    type: transformation
    source_ref: SRC_DIMBILLINGACCOUNT_CONDITIONALSPLIT
    output_path: INSERT_OUTPUT

transformation:
  type: ROW_COUNT
  logic:
    description: Counts rows with no match in dimension table (new records)
    variable: User::InsertCount
    operation: COUNT(*)
    filter: EDWBeanVersion IS NULL

output:
  name: ROWCOUNT_INSERT_OUTPUT
  description: Pass-through insert data with row count captured
  columns:
    - name: ALL_COLUMNS
      source: INSERT_OUTPUT.*
      description: All columns from insert rows passed through

metadata:
  row_count_variable: User::InsertCount
  capture_point: After conditional split - insert path
  action: INSERT
  description: These rows will be inserted into target dimension table

execution_order: 7
dependencies:
  - SRC_DIMBILLINGACCOUNT_CONDITIONALSPLIT
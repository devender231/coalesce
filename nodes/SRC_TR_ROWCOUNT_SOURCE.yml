fileVersion: 1.0.0
id: tr_rowcount_source
name: SRC_TR_ROWCOUNT_SOURCE
description: Counts source rows from OLE_SRC - GuideWire
type: RowCount

execution_order: 1

source:
  name: JOINED_DIMBILLINGACCOUNT
  description: Input from join operations

transformation:
  type: ROW_COUNT
  operation: COUNT_ROWS
  output_variable: User::SourceCount
  description: Counts all rows from the source GuideWire system

logic:
  count_expression: COUNT(*)
  variable_assignment:
    variable_name: User::SourceCount
    variable_type: INTEGER
    description: Total number of source rows

output:
  name: ROWCOUNT_SOURCE_OUTPUT
  pass_through: true
  description: All input rows passed through with source count captured

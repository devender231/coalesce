name: TR_ROW_COUNT_UPDATE
type: row_count
description: Counts the number of records to be updated from conditional split
source: TR_CONDITIONAL_SPLIT_SCD.UPDATE
transformation_logic: |
  Count all rows that have changes and need to be updated (UPDATE output)
  Store count in variable for logging and monitoring
  These records will update existing records in DimBillingAccount

  - BC_CONTACT.LASTNAME
  - BC_ADDRESS.ADDRESSLINE1
  - BC_ADDRESS.CITY
  - BCTL_STATE.NAME
  - DIMBILLINGACCOUNT.BEANVERSION
  - DIM_BEANVERSION
  - BatchID
  - UPDATE_ROW_COUNT
row_count_variable: UPDATE_ROW_COUNT

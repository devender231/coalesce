  - BC_ACCOUNT.DELINQUENCYSTATUS
  - BC_ACCOUNT.SEGMENT
  - BCTL_ACCOUNTTYPE.NAME
  - BC_PARENTACCT.ACCOUNTNUMBER
  - BCTL_BILLINGLEVEL.NAME
  - BCTL_CUSTOMERSERVICETIER.NAME
  - BC_SECURITYZONE.NAME
  - BCTL_DELINQUENCYSTATUS.NAME
  - BCTL_ACCOUNTSEGMENT.NAME
  - BC_CONTACT.FIRSTNAME
  - BC_CONTACT.LASTNAME
  - BC_ADDRESS.ADDRESSLINE1
  - BC_ADDRESS.CITY
  - BCTL_STATE.NAME
  - DIMBILLINGACCOUNT.BEANVERSION
  - DIM_BEANVERSION
  - BatchID
output_columns:
  - BC_ACCOUNT.ID

fileVersion: 1
id: "JOIN_CUSTOMER_ORDER_001"
name: "SRC_JOIN_CUSTOMER_ORDER"
description: "Joins CUSTOMERS, ORDERS, ORDER_ITEMS, and PAYMENTS tables"
type: "join"
executionOrder: 1

config:
  database: "PC_COALESCE_DB"
  schema: "RAW"
  
joins:
  - joinId: "join_001"
    joinType: "INNER"
    leftTable:
      database: "PC_COALESCE_DB"
      schema: "RAW"
      table: "CUSTOMERS"
      alias: "c"
    rightTable:
      database: "PC_COALESCE_DB"
      schema: "RAW"
      table: "ORDERS"
      alias: "o"
    joinCondition: "c.customer_id = o.customer_id"
    columns:
      - name: "customer_id"
        source: "c"
        dataType: "INTEGER"
      - name: "first_name"
        source: "c"
        dataType: "VARCHAR"
      - name: "last_name"
        source: "c"
        dataType: "VARCHAR"
      - name: "email"
        source: "c"
        dataType: "VARCHAR"
      - name: "order_id"
        source: "o"
        dataType: "INTEGER"
      - name: "order_date"
        source: "o"
        dataType: "DATE"
      - name: "total_amount"
        source: "o"
        dataType: "DECIMAL"

  - joinId: "join_002"
    joinType: "LEFT"
    leftTable:
      result: "join_001"
      alias: "base"
    rightTable:
      database: "PC_COALESCE_DB"
      schema: "RAW"
      table: "ORDER_ITEMS"
      alias: "oi"
    joinCondition: "base.order_id = oi.order_id"
    columns:
      - name: "product_name"
        source: "oi"
        dataType: "VARCHAR"
      - name: "quantity"
        source: "oi"
        dataType: "INTEGER"
      - name: "price"
        source: "oi"
        dataType: "DECIMAL"

  - joinId: "join_003"
    joinType: "LEFT"
    leftTable:
      result: "join_002"
      alias: "base"
    rightTable:
      database: "PC_COALESCE_DB"
      schema: "RAW"
      table: "PAYMENTS"
      alias: "p"
    joinCondition: "base.order_id = p.order_id"
    columns:
      - name: "amount_paid"
        source: "p"
        dataType: "DECIMAL"

outputColumns:
  - customer_id
  - first_name
  - last_name
  - email
  - order_id
  - order_date
  - total_amount
  - product_name
  - quantity
  - price
  - amount_paid


name: SRC_TR_DERIVED_BATCHID
type: transformation
transformation_type: DERIVED_COLUMN
description: Adds or overwrites BatchID column
source: SRC_TR_ROWCOUNT_SOURCE
execution_order: 2
logic:
  derived_columns:
    - column_name: BATCHID
      expression: "@[User::BatchID]"
      data_type: INTEGER
      operation: ADD_OR_REPLACE
      description: Assigns the current batch ID from the User variable to track ETL batch execution
output:
  all_input_columns: true
  additional_columns:
    - BATCHID
name: SRC_TR_DERIVED_BATCHID
type: transformation
transformation_type: DERIVED_COLUMN
execution_sequence: 2
description: Adds or overwrites BatchID column

input:
  source: SRC_TR_ROWCOUNT_SOURCE
  description: Takes output from source row count transformation

logic:
  operation: ADD_COLUMN
  derived_columns:
    - column_name: BatchID
      expression: "@[User::BatchID]"
      data_type: INTEGER
      description: Batch identifier from SSIS variable

output:
  name: DERIVED_BATCHID_OUTPUT
  columns: ALL
  new_columns:
    - BatchID
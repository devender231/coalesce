fileVersion: 1.0.0
id: tr_derived_batchid
name: SRC_TR_DERIVED_BATCHID
description: Adds or overwrites BatchID column
type: DerivedColumn

execution_order: 2

source:
  name: ROWCOUNT_SOURCE_OUTPUT
  description: Input from row count transformation

transformation:
  type: DERIVED
  operation: ADD_OR_REPLACE_COLUMN
  description: Adds BatchID column from package variable

derived_columns:
  - column_name: BatchID
    data_type: INTEGER
    expression: "@[User::BatchID]"
    operation: ADD_OR_REPLACE
    description: Batch identifier from SSIS package variable
    nullable: false

logic:
  derived_expressions:
    - name: BatchID
      expression: "@[User::BatchID]"
      description: Assigns the current batch ID from package variable to each row

output:
  name: DERIVED_BATCHID_OUTPUT
  description: All input columns plus BatchID column
  columns_added:
    - BatchID

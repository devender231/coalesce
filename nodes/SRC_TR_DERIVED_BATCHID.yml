name: SRC_TR_DERIVED_BATCHID
type: transformation
config:
  transformation_type: derived_column
  description: "Adds or overwrites BatchID column"
  input_source: SRC_TR_ROWCOUNT_SOURCE
  derived_columns:
    - column_name: BATCHID
      expression: "@[User::BatchID]"
      data_type: INTEGER
      operation: add_or_replace
      description: "Batch identifier for tracking ETL execution"
  output:
    pass_through: true
    include_derived: true
  execution_order: 3
  dependencies:
    - SRC_TR_ROWCOUNT_SOURCE
# Transformation: Derived Column - BatchID
name: SRC_TR_DERIVED_BATCHID
type: DERIVED_COLUMN
description: Adds or overwrites BatchID column with current batch execution ID
execution_order: 3

input:
  source: SRC_TR_ROW_COUNT_SOURCE
  description: Source data with row count captured

transformation_logic:
  operation: ADD_COLUMN
  derived_columns:
    - column_name: BatchID
      expression: "@[User::BatchID]"
      data_type: INTEGER
      description: Current batch execution identifier from SSIS variable
      action: ADD_OR_REPLACE

output:
  description: Dataset with BatchID column added for audit tracking
  next_step: SRC_TR_LOOKUP_BEANVERSION

metadata:
  ssis_component: Derived Column
  purpose: Tag all rows with current batch ID for lineage and audit
  variable_source: SSIS User Variable
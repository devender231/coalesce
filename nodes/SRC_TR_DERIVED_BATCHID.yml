name: SRC_TR_DERIVED_BATCHID
type: transformation
transformation_type: DERIVED_COLUMN
description: Adds or overwrites BatchID column
execution_order: 2

input:
  source: SRC_TR_ROW_COUNT_SOURCE
  description: Dataset after source row count

transformation_logic:
  operation: ADD_COLUMN
  derived_columns:
    - column_name: BatchID
      expression: "@[User::BatchID]"
      data_type: INTEGER
      description: Batch identifier from SSIS variable
      action: ADD_OR_REPLACE

output:
  name: DATASET_WITH_BATCHID
  columns_added:
    - BatchID

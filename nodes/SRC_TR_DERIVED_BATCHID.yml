name: SRC_TR_DERIVED_BATCHID
type: DERIVED_COLUMN
execution_order: 2
description: Adds or overwrites BatchID column with the current batch identifier

input:
  source: SRC_TR_ROW_COUNT_SOURCE
  description: Data after source row count

transformation_logic:
  operation: ADD_COLUMN
  derived_columns:
    - column_name: BatchID
      expression: '@[User::BatchID]'
      data_type: INTEGER
      description: Current batch execution identifier
      action: ADD_OR_REPLACE

output:
  name: DATA_WITH_BATCHID
  description: All source data with BatchID column added
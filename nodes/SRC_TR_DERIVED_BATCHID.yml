name: SRC_TR_DERIVED_BATCHID
type: derived_column
description: Adds or overwrites BatchID column from package variable

input:
  source: SRC_TR_ROW_COUNT_SOURCE
  
transformation:
  type: DERIVED
  operation: ADD_COLUMN
  
derived_columns:
  - column_name: BatchID
    data_type: INTEGER
    expression: "@[User::BatchID]"
    description: Batch identifier from SSIS package variable
    action: ADD_OR_REPLACE

logic:
  BatchID: "@[User::BatchID]"

output:
  include_all_input_columns: true
  additional_columns:
    - BatchID

execution_order: 3

dependencies:
  - SRC_TR_ROW_COUNT_SOURCE
name: SRC_TR_DERIVED_BATCHID
type: transformation
config:
  transformation_type: DERIVED_COLUMN
  description: "Adds or overwrites BatchID column"
  execution_order: 2
  logic:
    operation: ADD_COLUMN
    derived_columns:
      - column_name: BatchID
        expression: "@[User::BatchID]"
        data_type: INTEGER
        nullable: false
        description: "Batch identifier from SSIS variable"
        
  input:
    source: SRC_JOIN_DIMBILLINGACCOUNT
    
  output:
    columns:
      - all_input_columns: true
      - BatchID
    
dependencies:
  - SRC_JOIN_DIMBILLINGACCOUNT
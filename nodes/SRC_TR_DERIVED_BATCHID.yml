name: SRC_TR_DERIVED_BATCHID
type: transformation
transformation_type: DERIVED_COLUMN
execution_order: 2
description: Adds or overwrites BatchID column with package variable value

input:
  source: SRC_TR_ROW_COUNT_SOURCE
  description: Input from row count transformation

transformation_logic:
  operation: ADD_COLUMN
  derived_columns:
    - column_name: BatchID
      expression: "@[User::BatchID]"
      data_type: INTEGER
      description: Batch identifier from package variable
      action: ADD_OR_REPLACE
  
output:
  type: pass_through_with_new_column
  description: All input rows with added BatchID column
  new_columns:
    - BatchID
  
metadata:
  purpose: Add batch tracking identifier to each row
  variable_reference: User::BatchID
  variable_type: Integer
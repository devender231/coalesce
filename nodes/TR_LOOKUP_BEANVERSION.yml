name: TR_LOOKUP_BEANVERSION
type: lookup
description: Lookup BeanVersion from DimBillingAccount to identify changes
source: TR_DERIVED_COLUMN_BATCHID
lookup_table: DIMBILLINGACCOUNT
lookup_logic: |
  Lookup existing records in DimBillingAccount
  Match on PUBLICID
  Return BEANVERSION for comparison
  If no match found, treat as new record (INSERT)
lookup_conditions:
  - source_column: BC_ACCOUNT.PUBLICID
    lookup_column: DIMBILLINGACCOUNT.PUBLICID
    match_type: EXACT
returned_columns:
  - column_name: DIM_BEANVERSION
    source: DIMBILLINGACCOUNT.BEANVERSION
    data_type: INT
    description: Existing BeanVersion from dimension table
no_match_behavior: NULL

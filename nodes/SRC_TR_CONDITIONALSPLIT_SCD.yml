name: SRC_TR_CONDITIONALSPLIT_SCD
type: transformation
transformation_type: CONDITIONAL_SPLIT
description: Routes rows based on whether BeanVersion matches EDWBeanVersion
source: SRC_TR_LOOKUP_BEANVERSION
execution_order: 4
logic:
  conditions:
    - condition_name: UNCHANGED_RECORDS
      expression: BEANVERSION == EDW_BEANVERSION
      output_name: UNCHANGED_OUTPUT
      description: Records where source BeanVersion matches target BeanVersion (no change)
    - condition_name: UPDATE_RECORDS
      expression: BEANVERSION != EDW_BEANVERSION AND EDW_BEANVERSION IS NOT NULL
      output_name: UPDATE_OUTPUT
      description: Records where BeanVersion differs (requires update)
    - condition_name: INSERT_RECORDS
      expression: EDW_BEANVERSION IS NULL
      output_name: INSERT_OUTPUT
      description: Records with no match in target (new inserts)
  default_output: ERROR_OUTPUT
outputs:
  - output_name: UNCHANGED_OUTPUT
    description: Rows that have not changed
  - output_name: UPDATE_OUTPUT
    description: Rows that need to be updated
  - output_name: INSERT_OUTPUT
    description: Rows that need to be inserted
  - output_name: ERROR_OUTPUT
    description: Rows that don't match any condition
name: SRC_TR_CONDITIONALSPLIT_SCD
type: transformation
config:
  transformation_type: conditional_split
  description: "Routes rows based on whether BeanVersion matches EDWBeanVersion for SCD logic"
source:
  - SRC_TR_LOOKUP_BEANVERSION
transformation_logic:
  split_conditions:
    - output_name: UNCHANGED_ROWS
      condition: "BEANVERSION == EDWBeanVersion"
      condition_order: 1
      description: "Records where source BeanVersion matches EDW BeanVersion - no changes detected"
      action: "Route to unchanged count and exclude from load"
    
    - output_name: NEW_INSERT_ROWS
      condition: "ISNULL(EDWBeanVersion)"
      condition_order: 2
      description: "Records with no match in EDW - new records to insert"
      action: "Route to insert count and load as new records"
    
    - output_name: UPDATE_ROWS
      condition: "BEANVERSION != EDWBeanVersion AND !ISNULL(EDWBeanVersion)"
      condition_order: 3
      description: "Records where BeanVersion differs - changed records to update"
      action: "Route to update count and load as updates"
    
    - output_name: DEFAULT_OUTPUT
      condition: "DEFAULT"
      condition_order: 4
      description: "Catch-all for any rows not matching above conditions"
      action: "Error handling or additional logging"
output_streams:
  - stream_name: UNCHANGED_ROWS
    downstream_target: SRC_TR_ROWCOUNT_UNCHANGED
    load_action: EXCLUDE
  
  - stream_name: NEW_INSERT_ROWS
    downstream_target: SRC_TR_ROWCOUNT_INSERT
    load_action: INSERT
  
  - stream_name: UPDATE_ROWS
    downstream_target: SRC_TR_ROWCOUNT_UPDATE
    load_action: UPDATE
  
  - stream_name: DEFAULT_OUTPUT
    downstream_target: ERROR_HANDLER
    load_action: LOG_ERROR
execution_order: 5
dependencies:
  upstream:
    - SRC_TR_LOOKUP_BEANVERSION
  downstream:
    - SRC_TR_ROWCOUNT_UNCHANGED
    - SRC_TR_ROWCOUNT_INSERT
    - SRC_TR_ROWCOUNT_UPDATE
metadata:
  created_from: "SSIS Package: EDW_BC_Load_DimBillingAccount"
  transformation_sequence: 4
  ssis_component_type: "Conditional Split"
  purpose: "Implement SCD Type 1 logic by routing records based on change detection"
  scd_logic: "Compare BeanVersion to determine INSERT vs UPDATE vs NO CHANGE"
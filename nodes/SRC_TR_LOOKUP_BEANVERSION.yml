  testsEnabled: true
  truncateBefore: true
  warehouseName: DEV_WH

transformation:
  type: LOOKUP
  lookupTable:
    name: SRC_DIMBILLINGACCOUNT
    alias: DIMBILLINGACCOUNT
  
  lookupColumns:
    - name: PUBLICID
      dataType: STRING
    - name: BEANVERSION
      dataType: STRING
  
  joinCondition:
    type: LEFT
    expression: "INPUT.PUBLICID = DIMBILLINGACCOUNT.PUBLICID"
  
  outputMapping:
    - sourceColumn: DIMBILLINGACCOUNT.BEANVERSION
      targetColumn: EDW_BEANVERSION
      dataType: STRING
      description: Existing BeanVersion from EDW for comparison
  
  noMatchBehavior: RETURN_NULL
  cacheMode: FULL


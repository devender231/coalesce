fileVersion: 1.0.0
id: tr_lookup_beanversion
name: SRC_TR_LOOKUP_BEANVERSION
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID
type: Lookup

execution_order: 3

source:
  name: DERIVED_BATCHID_OUTPUT
  description: Input from derived column transformation

transformation:
  type: LOOKUP
  operation: LOOKUP_MATCH
  description: Looks up BeanVersion from target dimension table

lookup_configuration:
  lookup_table: DIMBILLINGACCOUNT
  lookup_query: |
    SELECT 
      PUBLICID,
      BEANVERSION
    FROM DIMBILLINGACCOUNT
  
  join_conditions:
    - source_column: PUBLICID
      lookup_column: PUBLICID
      match_type: EXACT
  
  lookup_columns:
    - lookup_column: BEANVERSION
      output_alias: EDWBeanVersion
      data_type: STRING
      description: BeanVersion from existing dimension record
  
  no_match_behavior: SEND_TO_NO_MATCH_OUTPUT
  cache_mode: FULL_CACHE

logic:
  match_condition: "PUBLICID = DIMBILLINGACCOUNT.PUBLICID"
  lookup_return_columns:
    - column_name: EDWBeanVersion
      source: DIMBILLINGACCOUNT.BEANVERSION
      description: Existing BeanVersion from EDW for comparison

outputs:
  - name: LOOKUP_MATCH_OUTPUT
    description: Rows with matching PUBLICID in DIMBILLINGACCOUNT
    includes_columns:
      - All source columns
      - EDWBeanVersion
  
  - name: LOOKUP_NO_MATCH_OUTPUT
    description: Rows with no matching PUBLICID (new records)
    includes_columns:
      - All source columns

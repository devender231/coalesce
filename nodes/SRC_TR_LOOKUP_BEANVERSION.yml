name: SRC_TR_LOOKUP_BEANVERSION
type: transformation
config:
  transformation_type: LOOKUP
  description: "Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID"
  execution_order: 3
  logic:
    operation: LOOKUP_JOIN
    lookup_table: SRC_DIMBILLINGACCOUNT
    lookup_query: "SELECT PUBLICID, BEANVERSION FROM DIMBILLINGACCOUNT"
    join_condition:
      - input_column: PUBLICID
        lookup_column: PUBLICID
        match_type: EXACT
    lookup_columns:
      - column_name: BEANVERSION
        alias: EDWBeanVersion
        data_type: STRING
        nullable: true
    no_match_behavior: PASS_NULL
    
  input:
    source: SRC_TR_DERIVED_BATCHID
    
  output:
    columns:
      - all_input_columns: true
      - EDWBeanVersion
    
dependencies:
  - SRC_TR_DERIVED_BATCHID
  - SRC_DIMBILLINGACCOUNT
name: SRC_TR_LOOKUP_BEANVERSION
type: transformation
transformation_type: LOOKUP
execution_sequence: 3
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID

input:
  source: SRC_TR_DERIVED_BATCHID
  description: Takes output from derived column transformation

lookup_configuration:
  lookup_table: SRC_DIMBILLINGACCOUNT
  lookup_sql: "SELECT Publicid, BeanVersion FROM DimBillingAccount"
  join_condition:
    left_column: PUBLICID
    right_column: PUBLICID
    comparison: "="
  lookup_columns:
    - source_column: BeanVersion
      output_column: EDWBeanVersion
      description: BeanVersion from existing DimBillingAccount record
  no_match_behavior: PASS_THROUGH
  description: Retrieves existing BeanVersion for comparison

output:
  name: LOOKUP_OUTPUT
  columns: ALL
  new_columns:
    - EDWBeanVersion
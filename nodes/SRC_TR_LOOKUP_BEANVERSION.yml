fileVersion: 1
id: "TR_LOOKUP_BEANVERSION"
name: "TR_LOOKUP_BEANVERSION"
description: "Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID"
type: "sql"
operation:
  type: "transformation"
  transformation_type: "LOOKUP"
  database: "{{ ref('database') }}"
  schema: "{{ ref('schema') }}"

transformation:
  type: "LOOKUP"
  description: "Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID"
  logic: "SQL: Select Publicid, BeanVersion from DimBillingAccount; Join: PUBLICID = DIMBILLINGACCOUNT.PUBLICID"
  lookup_table: "DIMBILLINGACCOUNT"
  lookup_columns:
    - "PUBLICID"
    - "BEANVERSION"
  join_condition: "PUBLICID = DIMBILLINGACCOUNT.PUBLICID"
  output_alias: "EDWBeanVersion"
  
sql_logic: |
  SELECT 
    src.*,
    lookup.BEANVERSION as EDWBeanVersion
  FROM {{ ref('SRC_TR_DERIVED_BATCHID') }} src
  LEFT JOIN (
    SELECT PUBLICID, BEANVERSION 
    FROM DIMBILLINGACCOUNT
  ) lookup
  ON src.PUBLICID = lookup.PUBLICID

metadata:
  package_name: "EDW_BC_Load_DimBillingAccount"
  source_system: "GuideWire"
  execution_order: 4
  upstream_dependencies:
    - "SRC_TR_DERIVED_BATCHID"
  created_from: "SSIS_Package"
  transformation_sequence: 3

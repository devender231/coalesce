# Transformation: Lookup BeanVersion
name: SRC_TR_LOOKUP_BEANVERSION
type: LOOKUP
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID to detect changes
execution_order: 4

input:
  source: SRC_TR_DERIVED_BATCHID
  description: Source data with BatchID added

lookup_configuration:
  lookup_table: DIMBILLINGACCOUNT
  lookup_query: |
    SELECT 
      Publicid,
      BeanVersion
    FROM DimBillingAccount
  
  join_conditions:
    - source_column: PUBLICID
      lookup_column: PUBLICID
      match_type: EXACT
  
  lookup_columns:
    - column_name: BeanVersion
      alias: EDWBeanVersion
      description: Existing BeanVersion from EDW dimension table
  
  no_match_behavior: PASS_THROUGH
  cache_mode: FULL

output:
  description: Dataset enriched with EDW BeanVersion for SCD comparison
  output_columns:
    - all_input_columns: true
    - EDWBeanVersion: STRING
  next_step: SRC_TR_CONDITIONAL_SPLIT_SCD

metadata:
  ssis_component: Lookup Transformation
  purpose: Retrieve existing BeanVersion to determine if record needs update
  scd_logic: Type 1 SCD - Compare BeanVersion for change detection
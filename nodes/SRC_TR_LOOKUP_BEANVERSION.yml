name: SRC_TR_LOOKUP_BEANVERSION
type: transformation
transformation_type: LOOKUP
execution_order: 3
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID to identify existing records

input:
  source: SRC_TR_DERIVED_BATCHID
  description: Input from derived column transformation with BatchID

lookup_configuration:
  lookup_table: SRC_DIMBILLINGACCOUNT
  lookup_query: |
    SELECT 
      PUBLICID,
      BEANVERSION as EDWBeanVersion
    FROM DIMBILLINGACCOUNT
  
  join_condition:
    input_column: PUBLICID
    lookup_column: PUBLICID
    join_type: LEFT_OUTER
  
  lookup_columns:
    - column_name: EDWBeanVersion
      source_column: BEANVERSION
      description: BeanVersion from existing dimension table
      on_no_match: NULL
  
  cache_mode: FULL
  description: Retrieves existing BeanVersion to compare with source BeanVersion

output:
  type: pass_through_with_lookup_columns
  description: All input rows with EDWBeanVersion column added
  new_columns:
    - EDWBeanVersion
  match_output: All rows (including no match)
  
metadata:
  purpose: Identify existing records and their current BeanVersion for SCD logic
  lookup_type: LEFT_OUTER_JOIN
  no_match_behavior: PASS_THROUGH_WITH_NULL
name: SRC_TR_LOOKUP_BEANVERSION
type: transformation
config:
  transformation_type: lookup
  description: "Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID for SCD Type 1 change detection"
source:
  - SRC_TR_DERIVED_BATCHID
lookup_table:
  source: SRC_DIMBILLINGACCOUNT
  columns:
    - PUBLICID
    - BEANVERSION
lookup_logic:
  join_type: LEFT_OUTER
  match_columns:
    - source_column: PUBLICID
      lookup_column: PUBLICID
      match_type: EXACT
  return_columns:
    - lookup_column: BEANVERSION
      output_alias: EDWBeanVersion
      data_type: STRING
      nullable: true
  no_match_behavior: PASS_THROUGH
  cache_mode: FULL
transformation_logic:
  sql_equivalent: |
    SELECT 
      input.*,
      dim.BEANVERSION AS EDWBeanVersion
    FROM input_stream input
    LEFT JOIN DIMBILLINGACCOUNT dim
      ON input.PUBLICID = dim.PUBLICID
output:
  pass_through: true
  new_columns:
    - EDWBeanVersion
  match_indicator:
    column_name: LOOKUP_MATCH
    match_value: 1
    no_match_value: 0
execution_order: 4
dependencies:
  upstream:
    - SRC_TR_DERIVED_BATCHID
    - SRC_DIMBILLINGACCOUNT
  downstream:
    - SRC_TR_CONDITIONALSPLIT_SCD
metadata:
  created_from: "SSIS Package: EDW_BC_Load_DimBillingAccount"
  transformation_sequence: 3
  ssis_component_type: "Lookup"
  purpose: "Identify existing records and detect changes for SCD logic"
  scd_type: "Type 1 - Overwrite"
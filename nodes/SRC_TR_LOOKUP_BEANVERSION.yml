name: SRC_TR_LOOKUP_BEANVERSION
type: transformation
transformation_type: LOOKUP
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID
source: SRC_TR_DERIVED_BATCHID
execution_order: 3
logic:
  lookup_source: SRC_DIMBILLINGACCOUNT
  lookup_query: |
    SELECT 
      PUBLICID,
      BEANVERSION AS EDW_BEANVERSION
    FROM DIMBILLINGACCOUNT
  join_condition:
    - input_column: PUBLICID
      lookup_column: PUBLICID
  lookup_columns:
    - column_name: EDW_BEANVERSION
      source_column: BEANVERSION
      data_type: STRING
      on_no_match: NULL
  description: Retrieves existing BeanVersion from target table to determine if record needs update
output:
  all_input_columns: true
  lookup_columns:
    - EDW_BEANVERSION
name: SRC_TR_LOOKUP_BEANVERSION
type: lookup
description: Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID

input:
  source: SRC_TR_DERIVED_BATCHID
  
lookup_configuration:
  lookup_table: DIMBILLINGACCOUNT
  lookup_type: LEFT_OUTER
  cache_mode: FULL_CACHE
  
lookup_query:
  sql: "SELECT PUBLICID, BEANVERSION FROM DIMBILLINGACCOUNT"
  
join_conditions:
  - input_column: PUBLICID
    lookup_column: PUBLICID
    comparison: EQUAL

output_columns:
  - column_name: EDWBeanVersion
    source: DIMBILLINGACCOUNT.BEANVERSION
    data_type: STRING
    description: BeanVersion from existing dimension table

logic:
  description: Performs lookup to retrieve existing BeanVersion for comparison
  join_condition: "LOOKUP_INPUT.PUBLICID = DIMBILLINGACCOUNT.PUBLICID"
  no_match_behavior: PASS_NULL

output:
  include_all_input_columns: true
  additional_columns:
    - EDWBeanVersion

execution_order: 4

dependencies:
  - SRC_TR_DERIVED_BATCHID
name: SRC_TR_LOOKUP_BEANVERSION
type: transformation
transformation_type: lookup
description: Lookup BeanVersion from DIMBILLINGACCOUNT to determine if record exists and needs update
source: SRC_TR_DERIVED_BATCHID

operation:
  type: LOOKUP
  lookup_table: SRC_DIMBILLINGACCOUNT
  lookup_type: LEFT_OUTER
  
  join_conditions:
    - source_column: PUBLICID
      lookup_column: PUBLICID
      match_type: EXACT
  
  lookup_columns:
    - column_name: BEANVERSION
      alias: LKP_BEANVERSION
      description: Bean version from existing dimension table for change detection
  
  cache_mode: FULL
  no_match_behavior: PASS_NULL

output:
  pass_through: true
  all_source_columns: true
  lookup_columns:
    - LKP_BEANVERSION

metadata:
  execution_order: 3
  purpose: Retrieve existing BeanVersion to determine if record is new, unchanged, or updated
  previous_step: SRC_TR_DERIVED_BATCHID
  next_step: SRC_TR_CONDITIONAL_SPLIT_BEANVERSION
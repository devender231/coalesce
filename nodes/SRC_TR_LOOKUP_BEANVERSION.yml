name: SRC_TR_LOOKUP_BEANVERSION
type: transformation
config:
  transformation_type: lookup
  description: "Lookup BeanVersion from DIMBILLINGACCOUNT by PUBLICID"
  input_source: SRC_TR_DERIVED_BATCHID
  lookup_source: SRC_DIMBILLINGACCOUNT
  lookup_logic:
    sql_query: "SELECT PUBLICID, BEANVERSION FROM DIMBILLINGACCOUNT"
    join_condition:
      left_column: PUBLICID
      right_column: PUBLICID
      match_type: exact
  lookup_columns:
    - source_column: BEANVERSION
      alias: EDWBEANVERSION
      data_type: STRING
      description: "Existing BeanVersion from EDW for comparison"
  match_behavior:
    on_match: return_lookup_value
    on_no_match: return_null
  output:
    pass_through: true
    include_lookup_columns: true
  execution_order: 4
  dependencies:
    - SRC_TR_DERIVED_BATCHID
    - SRC_DIMBILLINGACCOUNT
fileVersion: 1
id: SRC_TR_CONDITIONAL_SPLIT
name: SRC_TR_CONDITIONAL_SPLIT
type: transformation
metadata:
  description: Conditional split transformation based on BeanVersion comparison
  transformationType: conditionalSplit
  database: EDW
  schema: dbo
sources:
  - id: SRC_TR_LOOKUP_BEANVERSION
    alias: LOOKUP_RESULT
transformation:
  type: CONDITIONAL_SPLIT
  conditions:
    - name: UNCHANGED_RECORDS
      expression: "EXISTING_BEANVERSION IS NOT NULL AND BEANVERSION = EXISTING_BEANVERSION"
      outputPath: SRC_TR_ROW_COUNT_UNCHANGED
      description: Records with matching BeanVersion (no changes)
    - name: INSERT_RECORDS
      expression: "EXISTING_BEANVERSION IS NULL"
      outputPath: SRC_TR_ROW_COUNT_INSERT
      description: New records not in dimension table
    - name: UPDATE_RECORDS
      expression: "EXISTING_BEANVERSION IS NOT NULL AND BEANVERSION <> EXISTING_BEANVERSION"
      outputPath: SRC_TR_ROW_COUNT_UPDATE
      description: Existing records with changed BeanVersion
  defaultOutput: ERROR_OUTPUT
columns:
  - name: PUBLICID
    dataType: VARCHAR(255)
    sourceExpression: LOOKUP_RESULT.PUBLICID
  - name: ACCOUNTTYPE
    dataType: VARCHAR(255)
    sourceExpression: LOOKUP_RESULT.ACCOUNTTYPE
  - name: PARENTACCOUNT
    dataType: VARCHAR(50)
    sourceExpression: LOOKUP_RESULT.PARENTACCOUNT
  - name: BILLINGLEVEL
    dataType: VARCHAR(255)
    sourceExpression: LOOKUP_RESULT.BILLINGLEVEL
  - name: SERVICETIER
    dataType: VARCHAR(255)
    sourceExpression: LOOKUP_RESULT.SERVICETIER
  - name: SECURITYZONE
    dataType: VARCHAR(255)
    sourceExpression: LOOKUP_RESULT.SECURITYZONE
  - name: DELINQUENCYSTATUS
    dataType: VARCHAR(255)
    sourceExpression: LOOKUP_RESULT.DELINQUENCYSTATUS
  - name: SEGMENT
    dataType: VARCHAR(255)
    sourceExpression: LOOKUP_RESULT.SEGMENT
  - name: INSUREDFIRSTNAME
    dataType: VARCHAR(255)
    sourceExpression: LOOKUP_RESULT.INSUREDFIRSTNAME
  - name: INSUREDLASTNAME
    dataType: VARCHAR(255)
    sourceExpression: LOOKUP_RESULT.INSUREDLASTNAME
  - name: INSUREDADDRESS
    dataType: VARCHAR(255)
    sourceExpression: LOOKUP_RESULT.INSUREDADDRESS
  - name: INSUREDCITY
    dataType: VARCHAR(100)
    sourceExpression: LOOKUP_RESULT.INSUREDCITY
  - name: INSUREDSTATE
    dataType: VARCHAR(100)
    sourceExpression: LOOKUP_RESULT.INSUREDSTATE
  - name: INSUREDPOSTALCODE
    dataType: VARCHAR(20)
    sourceExpression: LOOKUP_RESULT.INSUREDPOSTALCODE
  - name: BEANVERSION
    dataType: INT
    sourceExpression: LOOKUP_RESULT.BEANVERSION
  - name: EXISTING_BEANVERSION
    dataType: INT
    sourceExpression: LOOKUP_RESULT.EXISTING_BEANVERSION
  - name: BATCHID
    dataType: DATETIME
    sourceExpression: LOOKUP_RESULT.BATCHID
name: SRC_TR_CONDITIONAL_SPLIT
type: conditional_split
description: Routes rows based on whether BeanVersion matches EDWBeanVersion

input:
  source: SRC_TR_LOOKUP_BEANVERSION
  
transformation:
  type: CONDITIONAL_SPLIT
  
split_conditions:
  - output_name: UNCHANGED_ROWS
    condition: "BEANVERSION == EDWBeanVersion"
    description: Rows where source BeanVersion matches EDW BeanVersion (no changes)
    priority: 1
    
  - output_name: UPDATE_ROWS
    condition: "BEANVERSION != EDWBeanVersion AND !ISNULL(EDWBeanVersion)"
    description: Rows where BeanVersion differs (updates needed)
    priority: 2
    
  - output_name: INSERT_ROWS
    condition: "ISNULL(EDWBeanVersion)"
    description: Rows with no match in lookup (new inserts)
    priority: 3
    default: true

logic:
  description: |
    Splits data flow into three paths:
    1. UNCHANGED_ROWS: BeanVersion matches - no action needed
    2. UPDATE_ROWS: BeanVersion differs - update existing records
    3. INSERT_ROWS: No lookup match - insert new records

output_paths:
  - name: UNCHANGED_ROWS
    destination: SRC_TR_ROW_COUNT_UNCHANGED
    
  - name: UPDATE_ROWS
    destination: SRC_TR_ROW_COUNT_UPDATE
    
  - name: INSERT_ROWS
    destination: SRC_TR_ROW_COUNT_INSERT

execution_order: 5

dependencies:
  - SRC_TR_LOOKUP_BEANVERSION
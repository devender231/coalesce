name: SRC_ROWCOUNT_UPDATE
type: transformation
config:
  transformation_type: ROW_COUNT
  description: "Counts update rows (BeanVersion different)"
  input_source: SRC_CONDITIONALSPLIT_BEANVERSION
  input_branch: UPDATE_ROWS
  logic:
    operation: COUNT
    variable_name: "User::UpdateCount"
    count_type: "UPDATE_ROWS"
    description: "Tracks number of records requiring updates"
  execution_order: 7
  output:
    pass_through: true
    add_columns:
      - name: UPDATE_ROW_COUNT
        dataType: INTEGER
        expression: "COUNT(*)"

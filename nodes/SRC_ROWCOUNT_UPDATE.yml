name: SRC_ROWCOUNT_UPDATE
type: source
config:
  source_type: transformation
  transformation_type: ROW_COUNT
  description: "Counts update rows (BeanVersion different)"
  execution_order: 7
  depends_on:
    - SRC_CONDITIONALSPLIT_BEANVERSION
transformation_logic:
  operation: COUNT_ROWS
  input_stream: UPDATE_ROWS
  variable_assignment:
    variable_name: "User::UpdateCount"
    variable_type: INTEGER
    description: "Count of rows to be updated (BeanVersion differs)"
input_source:
  - SRC_CONDITIONALSPLIT_BEANVERSION.UPDATE_ROWS
output:
  pass_through: true
  add_columns:
    - name: UPDATE_ROW_COUNT
      data_type: INTEGER
      expression: "COUNT(*)"
      nullable: false
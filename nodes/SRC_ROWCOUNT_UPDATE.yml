name: SRC_ROWCOUNT_UPDATE
type: transformation
transformation_type: ROW_COUNT
description: Counts update rows (BeanVersion different)
execution_order: 8

source:
  - SRC_CONDITIONAL_SPLIT_BEANVERSION
  source_output: UPDATE_ROWS

transformation_logic:
  operation: COUNT_ROWS
  output_variable: User::UpdateCount
  description: Counts rows where BeanVersion differs from existing dimension (requires update)

output:
  columns:
    - name: ROW_COUNT
      dataType: INTEGER
      description: Count of update rows
  variable_assignment:
    variable_name: User::UpdateCount
    variable_type: INTEGER
    description: Stores the count of update rows for audit purposes
  action: LOAD_TO_TARGET
  target_table: DIMBILLINGACCOUNT
  load_type: UPDATE
  update_key:
    - PUBLICID
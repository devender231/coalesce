name: SRC_ROWCOUNT_UPDATE
type: transformation
transformation_type: ROW_COUNT
description: Counts update rows where BeanVersion differs from EDWBeanVersion
execution_order: 7

source:
  upstream_component: SRC_CONDITIONAL_SPLIT_SCD
  output_path: UPDATE_RECORDS
  description: Receives records where BeanVersion differs from EDWBeanVersion

logic:
  operation: COUNT
  variable_name: User::UpdateCount
  count_type: ALL_ROWS
  description: Captures count of existing records requiring updates in EDW

output:
  variable: User::UpdateCount
  data_type: INTEGER
  description: Total count of records requiring updates
  action: UPDATE_TARGET
  target_table: DIMBILLINGACCOUNT
  update_key: PUBLICID

validation:
  - rule: COUNT_NON_NEGATIVE
    condition: User::UpdateCount >= 0
    error_message: Update count cannot be negative
  
  - rule: BEANVERSION_DIFFERENT
    condition: BEANVERSION != EDWBeanVersion
    error_message: Update records must have different BeanVersion values
  
  - rule: PUBLICID_EXISTS
    condition: EDWBeanVersion IS NOT NULL
    error_message: Update records must have existing EDWBeanVersion (PUBLICID must exist in EDW)

dependencies:
  - SRC_CONDITIONAL_SPLIT_SCD
  - Variable: User::UpdateCount

next_component: TARGET_DIMBILLINGACCOUNT_UPDATE
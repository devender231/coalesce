# Row Count Transformation - Update Rows
# Package: EDW_BC_Load_DimBillingAccount
# Description: Counts update rows (BeanVersion different)

name: SRC_ROWCOUNT_UPDATE
type: TRANSFORMATION
transformation_type: ROW_COUNT
version: 1.0

source:
  name: UPDATE_OUTPUT
  description: Rows with different BeanVersion from conditional split
  upstream_dependency: SRC_CONDITIONALSPLIT_SCD

transformation_logic:
  operation: COUNT_ROWS
  description: Counts rows where BeanVersion differs from EDWBeanVersion - records to update
  variable_assignment:
    variable_name: User::UpdateCount
    variable_type: INTEGER
    scope: PACKAGE
    description: Stores count of update records

output:
  name: UPDATE_COUNTED
  description: Dataset ready for update with count captured
  row_count_variable: User::UpdateCount
  disposition: LOAD_TO_TARGET
  target_table: DIMBILLINGACCOUNT
  load_type: UPDATE

execution_order: 7

metadata:
  created_from: SSIS_Documentation/EDW_BC_Load_DimBillingAccount.json
  transformation_sequence: 7
  purpose: Audit and monitoring - track update row count
  load_action: UPDATE
name: TR_06_ROWCOUNT_INSERT
type: transformation
transformation_type: ROW_COUNT
description: Counts new insert rows where EDWBeanVersion is NULL (lookup no match)
config:
  materialized: ephemeral
  
source:
  name: TR_04_CONDITIONALSPLIT_SCD
  type: conditional_split
  output_path: NEW_ROWS

transformation_logic:
  operation: COUNT
  count_variable: User::InsertCount
  description: |
    Captures the count of rows where EDWBeanVersion IS NULL.
    These are new records that do not exist in the dimension and will be inserted.
    Count is stored in SSIS variable User::InsertCount for audit logging.

output_columns:
  - name: INSERT_ROW_COUNT
    data_type: INTEGER
    expression: COUNT(*)
    description: Total count of new rows to be inserted

execution_order: 7
dependencies:
  - TR_04_CONDITIONALSPLIT_SCD

notes: |
  Sixth transformation in the pipeline (second row count after split).
  Processes NEW_ROWS output from conditional split.
  These rows will be sent to the target dimension for INSERT operation.
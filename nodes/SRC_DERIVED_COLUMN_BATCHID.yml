name: SRC_DERIVED_COLUMN_BATCHID
type: Derived Column
description: Adds or overwrites BatchID column

transformation_type: DERIVED
execution_order: 2

input:
  source: SRC_ROW_COUNT_SOURCE
  description: Dataset after source row count

derived_columns:
  - column_name: BatchID
    expression: "@[User::BatchID]"
    data_type: INTEGER
    operation: ADD_OR_REPLACE
    description: Adds BatchID from SSIS variable User::BatchID

logic:
  operation: DERIVE
  expression: "BatchID = @[User::BatchID]"
  description: Sets BatchID column value from ETL batch execution variable

output:
  columns: ALL_INPUT_COLUMNS_PLUS_BatchID
  description: All input columns plus the derived BatchID column

upstream_dependencies:
  - SRC_ROW_COUNT_SOURCE.yml
  - SRC_JOINS_ALL.yml

metadata:
  purpose: Add batch tracking identifier to each row
  usage: BatchID is used for ETL batch tracking and audit purposes
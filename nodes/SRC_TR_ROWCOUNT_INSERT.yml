name: SRC_TR_ROWCOUNT_INSERT
type: transformation
config:
  transformation_type: ROW_COUNT
  description: "Counts new insert rows (lookup no match)"
  execution_order: 6
  logic:
    operation: COUNT_ROWS
    variable: "User::InsertCount"
    count_type: "insert_rows"
    filter: "EDWBeanVersion IS NULL"
    
  input:
    source: SRC_TR_CONDITIONALSPLIT_BEANVERSION
    output_name: INSERT_OUTPUT
    
  output:
    row_count_variable: "User::InsertCount"
    pass_through: true
    action: SEND_TO_TARGET
    
  audit:
    capture_count: true
    log_to_variable: true
    log_message: "New rows to be inserted"
    
dependencies:
  - SRC_TR_CONDITIONALSPLIT_BEANVERSION
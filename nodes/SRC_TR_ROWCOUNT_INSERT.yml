name: SRC_TR_ROWCOUNT_INSERT
type: transformation
transformation_type: ROW_COUNT
execution_sequence: 6
description: Counts new insert rows (lookup no match)

input:
  source: SRC_TR_CONDITIONALSPLIT_BEANVERSION
  output_path: INSERT_OUTPUT
  description: Takes insert output from conditional split

logic:
  operation: COUNT_ROWS
  variable: User::InsertCount
  description: Stores count of new insert rows in variable User::InsertCount

output:
  name: ROWCOUNT_INSERT_OUTPUT
  columns: ALL
  metadata:
    row_count_variable: User::InsertCount
    description: New rows to be inserted into DimBillingAccount
    target_operation: INSERT
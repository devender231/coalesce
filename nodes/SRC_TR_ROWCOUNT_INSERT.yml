fileVersion: 1.0.0
id: tr_rowcount_insert
name: SRC_TR_ROWCOUNT_INSERT
description: Counts new insert rows (lookup no match)
type: RowCount

execution_order: 6

source:
  name: LOOKUP_NO_MATCH_OUTPUT
  description: Input from lookup no match output (new records)

transformation:
  type: ROW_COUNT
  operation: COUNT_ROWS
  output_variable: User::InsertCount
  description: Counts rows with no match in DIMBILLINGACCOUNT (new inserts)

logic:
  count_expression: COUNT(*)
  variable_assignment:
    variable_name: User::InsertCount
    variable_type: INTEGER
    description: Number of new rows to be inserted
  
  filter_condition: "PUBLICID NOT IN (SELECT PUBLICID FROM DIMBILLINGACCOUNT)"

output:
  name: ROWCOUNT_INSERT_OUTPUT
  pass_through: true
  description: New rows to be inserted with count captured
  action: INSERT
  target_table: DIMBILLINGACCOUNT

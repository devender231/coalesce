name: SRC_TR_ROWCOUNT_INSERT
type: transformation
config:
  transformation_type: row_count
  description: "Counts new insert rows (lookup no match)"
  input_source: SRC_TR_CONDITIONAL_SPLIT
  input_path: insert
  logic:
    operation: count_rows
    variable_name: "User::InsertCount"
    count_type: new_records
    filter_condition: "EDWBEANVERSION IS NULL"
  output:
    pass_through: true
    add_count_column: false
  execution_order: 7
  dependencies:
    - SRC_TR_CONDITIONAL_SPLIT
name: SRC_TR_ROWCOUNT_INSERT
type: transformation
transformation_type: ROW_COUNT
config:
  description: "Counts new insert rows (lookup no match)"
  input_source: "SRC_TR_CONDITIONALSPLIT_BEANVERSION.INSERT_OUTPUT"
  logic:
    count_variable: "User::InsertCount"
    count_type: "ALL_ROWS"
    filter_condition: "EDWBeanVersion IS NULL"
  output:
    pass_through: true
    add_count_column: false
    terminal_node: false
    next_step: "TARGET_DIMBILLINGACCOUNT_INSERT"
  execution_order: 6
  
dependencies:
  - "SRC_TR_CONDITIONALSPLIT_BEANVERSION"

metadata:
  purpose: "Audit count of new rows to be inserted into target table"
  variable_scope: "Package"
  variable_type: "Integer"
  ssis_component: "Row Count Transformation"
  output_path: "INSERT_OUTPUT"
  target_operation: "INSERT"
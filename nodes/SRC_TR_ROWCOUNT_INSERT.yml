steps:
  SRC_TR_ROWCOUNT_INSERT:
    operation:
      config:
        insertStrategy: INSERT
        selectDistinct: false
      database: ""
      deployEnabled: true
      description: "Row Count transformation - Counts new insert rows where lookup had no match (Variable: User::InsertCount)"
      isDataVault: false
      isMultisource: false
      locationName: TRG
      materializationType: view
      metadata:
        appliedNodeTests: []
        columns:
          - columnReference:
              columnCounter: 1
              stepCounter: 1
            config: {}
            dataType: NUMBER(38,0)
            description: "Count of insert rows"
            name: INSERT_ROW_COUNT
            nullable: false
            sourceColumnReferences:
              - columnReferences: []
                transform: "COUNT(*)"
          - columnReference:
              columnCounter: 2
              stepCounter: 1
            config: {}
            dataType: VARCHAR(16777216)
            description: "Transformation type identifier"
            name: TRANSFORMATION_TYPE
            nullable: false
            sourceColumnReferences:
              - columnReferences: []
                transform: "'INSERT_COUNT'"
        cteString: ""
        enabledColumnTestIDs: []
        sourceMapping:
          - aliases:
              SPLIT_DATA: SRC_TR_CONDITIONALSPLIT_BEANVERSION
            customSQL:
              customSQL: |
                SELECT
                  COUNT(*) AS INSERT_ROW_COUNT,
                  'INSERT_COUNT' AS TRANSFORMATION_TYPE
                FROM {{ ref('TRG', 'SRC_TR_CONDITIONALSPLIT_BEANVERSION') }} SPLIT_DATA
                WHERE SPLIT_DATA.ROW_CATEGORY = 'INSERT'
            dependencies:
              - locationName: TRG
                nodeName: SRC_TR_CONDITIONALSPLIT_BEANVERSION
            join:
              joinCondition: "FROM {{ ref('TRG', 'SRC_TR_CONDITIONALSPLIT_BEANVERSION') }} SPLIT_DATA WHERE SPLIT_DATA.ROW_CATEGORY = 'INSERT'"
            name: SRC_TR_ROWCOUNT_INSERT
            noLinkRefs: []
      name: SRC_TR_ROWCOUNT_INSERT
      overrideSQL: false
      schema: ""
      sqlType: Transform
      type: sql
      version: 1
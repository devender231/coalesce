name: SRC_TR_ROWCOUNT_INSERT
type: transformation
transformation_type: ROW_COUNT
description: Counts new insert rows where lookup found no match

source:
  - SRC_TR_CONDITIONALSPLIT_BEANVERSION.INSERT_ROWS

logic:
  operation: COUNT_ROWS
  output_variable: User::InsertCount
  description: Counts rows that are new records to be inserted into target table


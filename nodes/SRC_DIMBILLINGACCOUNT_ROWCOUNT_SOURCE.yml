fileVersion: 1.0
name: SRC_DIMBILLINGACCOUNT_ROWCOUNT_SOURCE
type: transformation
description: |
  Row Count transformation for DimBillingAccount package
  Counts source rows from OLE_SRC - GuideWire
  Execution Order: Step 2 - After joins, count source rows

sources:
  - name: SRC_DIMBILLINGACCOUNT_JOINS
    type: transformation

transformation_type: ROW_COUNT

transformation_logic:
  operation: COUNT_ROWS
  description: Counts all rows from the joined source dataset
  variable_assignment:
    variable_name: User::SourceCount
    variable_type: INT32
    scope: PACKAGE
  
  count_logic:
    count_all_rows: true
    filter_condition: null
    
output_columns:
  # Pass through all columns from joined sources
  - BC_ACCOUNT.ACCOUNTNUMBER
  - BC_ACCOUNT.ACCOUNTNAME
  - BC_ACCOUNT.ACCOUNTTYPE
  - BC_ACCOUNT.BILLINGLEVEL
  - BC_ACCOUNT.SERVICETIER
  - BC_ACCOUNT.SECURITYZONEID
  - BC_ACCOUNT.SEGMENT
  - BC_ACCOUNT.CLOSEDATE
  - BC_ACCOUNT.CREATETIME
  - BC_ACCOUNT.DELINQUENCYSTATUS
  - BC_ACCOUNT.FIRSTTWICEPERMTHINVOICEDOM
  - BC_ACCOUNT.SECONDTWICEPERMTHINVOICEDOM
  - BC_ACCOUNT.PUBLICID
  - BC_ACCOUNT.ID
  - BC_ACCOUNT.BEANVERSION
  - BC_ACCOUNT.RETIRED
  - BC_ACCOUNT.UPDATETIME
  - ACCOUNTTYPE_NAME
  - BILLINGLEVEL_NAME
  - SERVICETIER_NAME
  - SECURITYZONE_NAME
  - DELINQUENCYSTATUS_NAME
  - SEGMENT_NAME
  - PARENT_ACCOUNT_ID
  - INSURED_FIRSTNAME
  - INSURED_LASTNAME
  - INSURED_ADDRESS1
  - INSURED_ADDRESS2
  - INSURED_ADDRESS3
  - INSURED_CITY
  - INSURED_POSTALCODE
  - INSURED_STATE

execution_order: 2
dependencies:
  - SRC_DIMBILLINGACCOUNT_JOINS

metadata:
  ssis_component_type: ROW_COUNT
  ssis_variable: User::SourceCount
  purpose: Track number of source rows for audit and reconciliation

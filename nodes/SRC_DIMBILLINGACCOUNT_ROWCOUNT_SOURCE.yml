# Transformation YAML - Row Count Source
version: 1.0

name: SRC_DIMBILLINGACCOUNT_ROWCOUNT_SOURCE
description: Counts source rows from OLE_SRC - GuideWire
transformation_type: ROW_COUNT

sources:
  - name: JOINED_DATA
    type: transformation
    source_ref: SRC_DIMBILLINGACCOUNT_JOINS

transformation:
  type: ROW_COUNT
  logic:
    description: Counts all rows from the joined dataset
    variable: User::SourceCount
    operation: COUNT(*)

output:
  name: ROWCOUNT_SOURCE_OUTPUT
  description: Pass-through data with row count captured
  columns:
    - name: ALL_COLUMNS
      source: JOINED_DATA.*
      description: All columns from joined data passed through

metadata:
  row_count_variable: User::SourceCount
  capture_point: After joins, before transformations

execution_order: 2
dependencies:
  - SRC_DIMBILLINGACCOUNT_JOINS
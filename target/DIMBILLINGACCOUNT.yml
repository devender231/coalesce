audit:
  row_counts:
    - name: SOURCE_ROW_COUNT
      variable: SourceRowCount
      description: "Total rows read from BC_ACCOUNT source"
    
    - name: UNCHANGED_ROW_COUNT
      variable: UnchangedRowCount
      description: "Rows with no changes (BeanVersion matches)"
    
    - name: INSERT_ROW_COUNT
      variable: InsertRowCount
      description: "New rows inserted into DIMBILLINGACCOUNT"
    
    - name: UPDATE_ROW_COUNT
      variable: UpdateRowCount
      description: "Existing rows updated in DIMBILLINGACCOUNT"

execution:
  pre_sql:
    - "-- Pre-execution validation"
    - "-- Ensure target table exists"
  
  post_sql:
    - "-- Post-execution audit"
    - "-- Log row counts to audit table"
    - "INSERT INTO EDW.AUDIT_LOG (PACKAGE_NAME, SOURCE_COUNT, INSERT_COUNT, UPDATE_COUNT, UNCHANGED_COUNT, BATCH_ID, EXECUTION_TIME)"

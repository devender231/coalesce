      severity: ERROR
    
    - name: CHECK_BEANVERSION_POSITIVE
      type: RANGE
      columns:
        - BEANVERSION
      min_value: 0
      severity: WARNING
    
    - name: CHECK_DUPLICATE_PUBLICID
      type: UNIQUENESS
      columns:
        - PUBLICID
      severity: ERROR


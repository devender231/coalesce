            LEFT JOIN {{ ref('TARGET', 'SRC_BCTL_ACCOUNTTYPE') }} "SRC_BCTL_ACCOUNTTYPE"
              ON "SRC_BC_ACCOUNT"."ACCOUNTTYPE" = "SRC_BCTL_ACCOUNTTYPE"."ID"
            LEFT JOIN {{ ref('TARGET', 'SRC_BC_PARENTACCT') }} "SRC_BC_PARENTACCT"
              ON "SRC_BC_PARENTACCT"."OWNERID" = "SRC_BC_ACCOUNT"."ID"
            LEFT JOIN {{ ref('TARGET', 'SRC_BCTL_BILLINGLEVEL') }} "SRC_BCTL_BILLINGLEVEL"
              ON "SRC_BC_ACCOUNT"."BILLINGLEVEL" = "SRC_BCTL_BILLINGLEVEL"."ID"
            LEFT JOIN {{ ref('TARGET', 'SRC_BCTL_CUSTOMERSERVICETIER') }} "SRC_BCTL_CUSTOMERSERVICETIER"
              ON "SRC_BC_ACCOUNT"."SERVICETIER" = "SRC_BCTL_CUSTOMERSERVICETIER"."ID"
            LEFT JOIN {{ ref('TARGET', 'SRC_BC_SECURITYZONE') }} "SRC_BC_SECURITYZONE"
              ON "SRC_BC_ACCOUNT"."SECURITYZONEID" = "SRC_BC_SECURITYZONE"."ID"
            LEFT JOIN {{ ref('TARGET', 'SRC_BCTL_DELINQUENCYSTATUS') }} "SRC_BCTL_DELINQUENCYSTATUS"
              ON "SRC_BC_ACCOUNT"."DELINQUENCYSTATUS" = "SRC_BCTL_DELINQUENCYSTATUS"."ID"
            LEFT JOIN {{ ref('TARGET', 'SRC_BCTL_ACCOUNTSEGMENT') }} "SRC_BCTL_ACCOUNTSEGMENT"
              ON "SRC_BC_ACCOUNT"."SEGMENT" = "SRC_BCTL_ACCOUNTSEGMENT"."ID"
            LEFT JOIN {{ ref('TARGET', 'SRC_BC_ACCOUNTCONTACT') }} "SRC_BC_ACCOUNTCONTACT"
              ON "SRC_BC_ACCOUNTCONTACT"."INSUREDACCOUNTID" = "SRC_BC_ACCOUNT"."ID"
            LEFT JOIN {{ ref('TARGET', 'SRC_BC_ACCOUNTCONTACTROLE') }} "SRC_BC_ACCOUNTCONTACTROLE"
              ON "SRC_BC_ACCOUNTCONTACTROLE"."ACCOUNTCONTACTID" = "SRC_BC_ACCOUNTCONTACT"."ID"
            LEFT JOIN {{ ref('TARGET', 'SRC_BCTL_ACCOUNTROLE') }} "SRC_BCTL_ACCOUNTROLE"
              ON "SRC_BCTL_ACCOUNTROLE"."ID" = "SRC_BC_ACCOUNTCONTACTROLE"."ROLE"
              AND "SRC_BCTL_ACCOUNTROLE"."TYPECODE" = 'insured'
            LEFT JOIN {{ ref('TARGET', 'SRC_BC_CONTACT') }} "SRC_BC_CONTACT"
              ON "SRC_BC_CONTACT"."ID" = "SRC_BC_ACCOUNTCONTACT"."CONTACTID"
            LEFT JOIN {{ ref('TARGET', 'SRC_BC_ADDRESS') }} "SRC_BC_ADDRESS"
              ON "SRC_BC_ADDRESS"."ID" = "SRC_BC_CONTACT"."PRIMARYADDRESSID"
            LEFT JOIN {{ ref('TARGET', 'SRC_BCTL_STATE') }} "SRC_BCTL_STATE"
              ON "SRC_BCTL_STATE"."ID" = "SRC_BC_ADDRESS"."STATE"
            LEFT JOIN {{ ref('TARGET', 'SRC_DIMBILLINGACCOUNT') }} "SRC_DIMBILLINGACCOUNT"
